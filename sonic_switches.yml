---
# =============================================================================
# sonic_switches.yml - Common variables for all SONiC-managed switches
# =============================================================================

ansible_connection: ssh
ansible_user: admin
ansible_ssh_pass: "{{ sonic_admin_password }}"
ansible_become_password: "{{ sonic_admin_password }}"
ansible_ssh_transfer_method: piped
sonic_platform: "{{ profile_sonic_platform }}"

# ---- Fabric port defaults ----
fabric_port_mtu: "9216"
fabric_port_fec: "rs"
fabric_port_admin_status: "up"

# ---- Actuator / health ----
sonic_health_endpoint: "/actuator/health"

# ---- SONiC features enabled on all switches ----
common_enabled_features:
  - bgp
  - lldp
  - snmp
  - pmon
  - swss
  - syncd
  - teamd
  - database
  - mgmt-framework
  - eventd
  - gnmi
  - radv

common_disabled_features:
  - nat
  - sflow
  - macsec
  - mux
