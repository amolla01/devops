---
- name: "backup | Kill stale ControlMaster {{ backup_refresh_label }}"
  ansible.builtin.shell:
    cmd: >
      ssh -o ControlPath=/tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
          -O stop {{ ansible_host }} 2>/dev/null || true;
      rm -f /tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
      /tmp/ansible-ssh-{{ ansible_host }}-22-admin 2>/dev/null || true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  changed_when: false

- name: "backup | Reset connection {{ backup_refresh_label }}"
  ansible.builtin.meta: reset_connection

- name: "backup | Wait for SSH port 22 {{ backup_refresh_label }}"
  ansible.builtin.shell: |
    for i in $(seq 1 24); do
      output=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=5 -o BatchMode=yes -o LogLevel=ERROR \
               {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1)
      rc=$?
      if [ $rc -eq 0 ] || echo "$output" | grep -qi "permission denied"; then
        echo "PORT_OPEN"
        exit 0
      fi
      sleep 5
    done
    echo "TIMEOUT after 120s waiting for {{ ansible_host }}:22"
    exit 1
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  register: _port_check_backup
  changed_when: false
  failed_when: "'PORT_OPEN' not in _port_check_backup.stdout"

- name: "backup | Re-establish raw SSH {{ backup_refresh_label }}"
  ansible.builtin.shell: |
    sshpass -p '{{ ansible_ssh_pass }}' ssh \
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
      -o LogLevel=ERROR -o PreferredAuthentications=password \
      -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no \
      -o PasswordAuthentication=yes -o GSSAPIAuthentication=no \
      {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  register: _backup_transport_probe
  changed_when: false
  retries: 8
  delay: 10
  until: "'ok' in (_backup_transport_probe.stdout | default(''))"

# After reset_connection + raw SSH probe, Ansible's own internal connection
# is still dead. wait_for_connection retries the full module path (including
# sftp/scp module push) using the play-level SSH settings until the host is
# ready to accept module execution.
- name: "backup | Re-establish Ansible SSH {{ backup_refresh_label }}"
  ansible.builtin.wait_for_connection:
    delay: 5
    sleep: 10
    timeout: 120
