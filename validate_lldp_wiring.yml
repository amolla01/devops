---
# =============================================================================
# validate_lldp_wiring.yml — Intent-vs-Actual Topology Validation
# =============================================================================
# PURPOSE:
#   Compares LLDP-discovered neighbors on each switch against the intended
#   wiring defined in host_vars (uplink_interfaces, fabric_interfaces,
#   downlink_interfaces, exit_interfaces). Reports wiring mismatches,
#   missing neighbors, and unexpected connections.
#
# PROBLEM SOLVED:
#   After deployment, wiring errors are SILENT — traffic simply fails with
#   no clear root cause. This playbook catches:
#     - Cables plugged into wrong ports
#     - Cables connected to wrong neighbor device
#     - Missing connections (cable not plugged in / link down)
#     - Unexpected connections (rogue devices)
#
# USAGE:
#   # Validate all switches:
#   ansible-playbook playbooks/validate_lldp_wiring.yml -i inventory/hosts.yml
#
#   # Validate specific switches:
#   ansible-playbook playbooks/validate_lldp_wiring.yml -i inventory/hosts.yml \
#     --limit "Spine_S1,Leaf_L1"
#
#   # Verbose mode (show all details including passing checks):
#   ansible-playbook playbooks/validate_lldp_wiring.yml -i inventory/hosts.yml \
#     -e "verbose_output=true"
#
#   # Strict mode (fail playbook on ANY mismatch):
#   ansible-playbook playbooks/validate_lldp_wiring.yml -i inventory/hosts.yml \
#     -e "strict_mode=true"
#
#   # Skip server downlinks (only validate fabric links):
#   ansible-playbook playbooks/validate_lldp_wiring.yml -i inventory/hosts.yml \
#     -e "validate_downlinks=false"
#
# LLDP DATA SOURCE:
#   SONiC: `docker exec lldp lldpctl -f json` → structured JSON with
#   chassis name (remote hostname) and port description (remote port name)
#
# INTENT DATA SOURCE:
#   host_vars per-switch:
#     - fabric_interfaces[].neighbor / neighbor_port  (spines)
#     - uplink_interfaces[].neighbor / neighbor_port  (leaves)
#     - downlink_interfaces[].neighbor / neighbor_port (leaves → servers)
#     - exit_interfaces[].neighbor / neighbor_port    (border-leaves → exit routers)
# =============================================================================

- name: "LLDP Intent-vs-Actual Wiring Validation"
  hosts: sonic_switches
  gather_facts: false
  become: true
  vars:
    verbose_output: false
    strict_mode: false
    validate_downlinks: true
    ansible_user: admin
    ansible_password: "{{ sonic_admin_password }}"

  tasks:
    # ─── Phase 1: Build Intent Map ────────────────────────────────────────
    - name: "Build intended neighbor map from host_vars"
      ansible.builtin.set_fact:
        _intent_map: >-
          {{
            (fabric_interfaces | default([]))
            + (uplink_interfaces | default([]))
            + (downlink_interfaces | default([]) if validate_downlinks | bool else [])
            + (exit_interfaces | default([]))
          }}
      tags: [always]

    - name: "Display intent summary"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: Expecting {{ _intent_map | length }} LLDP neighbors"
      tags: [always]

    # ─── Phase 2: Gather Actual LLDP Data ─────────────────────────────────
    - name: "Gather LLDP neighbors via lldpctl JSON"
      ansible.builtin.shell: |
        docker exec lldp lldpctl -f json 2>/dev/null || echo '{}'
      register: _lldp_raw
      changed_when: false
      failed_when: false
      tags: [gather]

    - name: "Parse LLDP JSON output"
      vars:
        _raw_interface: "{{ (_lldp_raw.stdout | from_json).lldp.interface | default([]) }}"
      ansible.builtin.set_fact:
        _lldp_data: "{{ _raw_interface if _raw_interface is mapping else _raw_interface | combine }}"
      when: _lldp_raw.stdout | length > 2
      tags: [gather]

    - name: "Set empty LLDP data if no output"
      ansible.builtin.set_fact:
        _lldp_data: {}
      when: _lldp_raw.stdout | length <= 2
      tags: [gather]

    # ─── Phase 3: Compare Intent vs Actual ────────────────────────────────
    - name: "Validate each intended neighbor against LLDP discovery"
      ansible.builtin.set_fact:
        _validation_results: "{{ _validation_results | default([]) + [_result] }}"
      vars:
        _local_port: "{{ item.port }}"
        # LLDP data for this port (may be nested differently based on lldpd version)
        _lldp_entry: >-
          {{ _lldp_data[_local_port] | default(
             _lldp_data.get(_local_port, {})
          ) }}
        # Extract actual neighbor chassis name
        _actual_neighbor: >-
          {{ (_lldp_entry.chassis | default({})).keys() | list | first | default('')
             if _lldp_entry.chassis is defined else '' }}
        # Extract actual remote port (try port.descr first, fall back to port.id.value)
        _actual_port: >-
          {{ _lldp_entry.port.descr | default(
               (_lldp_entry.port.id | default({})).value | default('')
             ) if _lldp_entry.port is defined else '' }}
        # Expected values
        _expected_neighbor: "{{ item.neighbor }}"
        _expected_port: "{{ item.neighbor_port }}"
        # Determine status
        _status: >-
          {% if _actual_neighbor == '' %}MISSING
          {% elif _actual_neighbor != _expected_neighbor %}WRONG_NEIGHBOR
          {% elif _actual_port != _expected_port %}WRONG_PORT
          {% else %}OK{% endif %}
        _result:
          local_port: "{{ _local_port }}"
          expected_neighbor: "{{ _expected_neighbor }}"
          expected_port: "{{ _expected_port }}"
          actual_neighbor: "{{ _actual_neighbor | default('NONE') }}"
          actual_port: "{{ _actual_port | default('NONE') }}"
          status: "{{ _status | trim }}"
      loop: "{{ _intent_map }}"
      loop_control:
        label: "{{ item.port }} → {{ item.neighbor }}"
      tags: [validate]

    # ─── Phase 4: Detect Unexpected Neighbors ─────────────────────────────
    - name: "Identify unexpected LLDP neighbors (not in intent)"
      ansible.builtin.set_fact:
        _unexpected_neighbors: "{{ _unexpected_neighbors | default([]) + [_unexpected] }}"
      vars:
        _intended_ports: "{{ _intent_map | map(attribute='port') | list }}"
        _lldp_port: "{{ item.key }}"
        _neighbor_info: "{{ item.value }}"
        _unexpected:
          local_port: "{{ _lldp_port }}"
          actual_neighbor: "{{ (_neighbor_info.chassis | default({})).keys() | list | first | default('unknown') }}"
          actual_port: "{{ (_neighbor_info.port | default({})).descr | default('unknown') }}"
          status: "UNEXPECTED"
      loop: "{{ _lldp_data | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.key not in _intended_ports
        - item.key != "eth0"
        - "'Management' not in item.key"
      tags: [validate]

    # ─── Phase 5: Report Results ──────────────────────────────────────────
    - name: "Compute validation summary"
      ansible.builtin.set_fact:
        _total_checks: "{{ _validation_results | length }}"
        _passed: "{{ _validation_results | selectattr('status', 'equalto', 'OK') | list | length }}"
        _missing: "{{ _validation_results | selectattr('status', 'equalto', 'MISSING') | list }}"
        _wrong_neighbor: "{{ _validation_results | selectattr('status', 'equalto', 'WRONG_NEIGHBOR') | list }}"
        _wrong_port: "{{ _validation_results | selectattr('status', 'equalto', 'WRONG_PORT') | list }}"
        _unexpected: "{{ _unexpected_neighbors | default([]) }}"
      tags: [report]

    - name: "Display PASSING checks"
      ansible.builtin.debug:
        msg: "✓ {{ item.local_port }} → {{ item.expected_neighbor }}:{{ item.expected_port }}"
      loop: "{{ _validation_results | selectattr('status', 'equalto', 'OK') | list }}"
      loop_control:
        label: "{{ item.local_port }}"
      when: verbose_output | bool
      tags: [report]

    - name: "Display MISSING neighbors"
      ansible.builtin.debug:
        msg: |
          ✗ MISSING: {{ item.local_port }}
            Expected: {{ item.expected_neighbor }}:{{ item.expected_port }}
            Actual:   NO LLDP NEIGHBOR DETECTED
            Possible causes: cable unplugged, link down, remote port admin-down, LLDP disabled on remote
      loop: "{{ _missing }}"
      loop_control:
        label: "{{ item.local_port }}"
      when: _missing | length > 0
      tags: [report]

    - name: "Display WRONG NEIGHBOR errors"
      ansible.builtin.debug:
        msg: |
          ✗ WRONG NEIGHBOR: {{ item.local_port }}
            Expected: {{ item.expected_neighbor }}:{{ item.expected_port }}
            Actual:   {{ item.actual_neighbor }}:{{ item.actual_port }}
            → Cable connected to WRONG DEVICE! Check physical wiring.
      loop: "{{ _wrong_neighbor }}"
      loop_control:
        label: "{{ item.local_port }}"
      when: _wrong_neighbor | length > 0
      tags: [report]

    - name: "Display WRONG PORT errors"
      ansible.builtin.debug:
        msg: |
          ✗ WRONG PORT: {{ item.local_port }}
            Expected: {{ item.expected_neighbor }}:{{ item.expected_port }}
            Actual:   {{ item.actual_neighbor }}:{{ item.actual_port }}
            → Correct device, WRONG PORT! Cable in wrong port on {{ item.actual_neighbor }}.
      loop: "{{ _wrong_port }}"
      loop_control:
        label: "{{ item.local_port }}"
      when: _wrong_port | length > 0
      tags: [report]

    - name: "Display UNEXPECTED connections"
      ansible.builtin.debug:
        msg: |
          ⚠ UNEXPECTED: {{ item.local_port }}
            Not in intent (host_vars), but LLDP sees: {{ item.actual_neighbor }}:{{ item.actual_port }}
            → Rogue connection or missing inventory entry.
      loop: "{{ _unexpected }}"
      loop_control:
        label: "{{ item.local_port }}"
      when: _unexpected | length > 0
      tags: [report]

    - name: "Validation Summary"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════╗
          ║  LLDP WIRING VALIDATION: {{ inventory_hostname | center(20) }}  ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║  Total intended links:    {{ _total_checks | string | ljust(5) }}                           ║
          ║  ✓ Passed (correct):      {{ _passed | string | ljust(5) }}                           ║
          ║  ✗ Missing (no LLDP):     {{ _missing | length | string | ljust(5) }}                           ║
          ║  ✗ Wrong neighbor:        {{ _wrong_neighbor | length | string | ljust(5) }}                           ║
          ║  ✗ Wrong port:            {{ _wrong_port | length | string | ljust(5) }}                           ║
          ║  ⚠ Unexpected:            {{ _unexpected | length | string | ljust(5) }}                           ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║  Result: {{ 'ALL WIRING CORRECT ✓' if (_missing | length + _wrong_neighbor | length + _wrong_port | length) == 0 else 'WIRING ERRORS DETECTED ✗' | ljust(25) }}                       ║
          ╚══════════════════════════════════════════════════════════════════╝
      tags: [report]

    # ─── Phase 6: Fail if strict mode ─────────────────────────────────────
    - name: "Assert all wiring is correct (strict mode)"
      ansible.builtin.assert:
        that:
          - (_missing | length) == 0
          - (_wrong_neighbor | length) == 0
          - (_wrong_port | length) == 0
        fail_msg: |
          WIRING VALIDATION FAILED on {{ inventory_hostname }}!
          Missing: {{ _missing | length }}, Wrong neighbor: {{ _wrong_neighbor | length }}, Wrong port: {{ _wrong_port | length }}
          Details:
          {% for item in _missing + _wrong_neighbor + _wrong_port %}
            - {{ item.local_port }}: expected {{ item.expected_neighbor }}:{{ item.expected_port }}, got {{ item.actual_neighbor }}:{{ item.actual_port }} [{{ item.status }}]
          {% endfor %}
        success_msg: "All {{ _total_checks }} LLDP neighbors match intent on {{ inventory_hostname }}"
      when: strict_mode | bool
      tags: [assert]
