---
# =============================================================================
# deploy_exit_routers.yml — MikroTik CHR Exit Router Full Automation
# =============================================================================
#
# Comprehensive deployment playbook for MikroTik Cloud Hosted Router (CHR)
# exit routers. Handles the full lifecycle: preflight → base config → BGP →
# route-policy → NAT → firewall → verification.
#
# The exit routers provide north/south connectivity from the CLOS fabric
# to external networks (internet, campus, WAN). Each border-leaf peers with
# one exit router via eBGP on a /31 point-to-point link.
#
# Topology:
#   Border_Leaf1 (ASN 65021) ←→ Exit_Router1 (ASN 65253)
#   Border_Leaf2 (ASN 65022) ←→ Exit_Router2 (ASN 65254)
#
# Usage:
#   # Full deployment (all phases):
#   ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml
#
#   # Preflight only (verify SSH + RouterOS):
#   ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml \
#     --tags preflight
#
#   # Base config only (hostname, NTP, security, management):
#   ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml \
#     --tags base
#
#   # BGP + route-policy only:
#   ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml \
#     --tags bgp
#
#   # NAT + firewall only:
#   ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml \
#     --tags nat,firewall
#
#   # Verification only:
#   ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml \
#     --tags verify
#
#   # Single router:
#   ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml \
#     --limit Exit_Router1
#
# Requirements:
#   - MikroTik CHR VMs running and reachable via SSH (172.16.2.98/99)
#   - SSH key or password authentication configured
#   - RouterOS 7.x (supports /routing/bgp/connection syntax)
#
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Play 1: Exit Router Deployment
# ─────────────────────────────────────────────────────────────────────────────
- name: "Deploy MikroTik CHR Exit Routers"
  hosts: exit_routers
  gather_facts: false
  become: false   # MikroTik/RouterOS has no sudo; never inherit become from ansible.cfg / group_vars
  vars:
    # ── NAT / External connectivity ──
    exit_nat_enabled: "{{ nat_enabled | default(true) }}"
    exit_nat_out_interface: "{{ nat_interface | default('ether1') }}"
    exit_nat_src_ranges:
      - "10.0.0.0/8"
      - "172.16.2.0/24"

    # ── DNS forwarding ──
    exit_dns_servers:
      - "8.8.8.8"
      - "8.8.4.4"

    # ── BGP route advertisement ──
    # Routes the exit router announces INTO the fabric (default route)
    exit_advertise_default: "{{ advertise_default | default(true) }}"

    # ── Firewall ──
    exit_firewall_enabled: "{{ firewall_enabled | default(true) }}"

    # ── GRACEFUL_SHUTDOWN community support ──
    honor_gshut: "{{ honor_graceful_shutdown | default(true) }}"

  tasks:
    # ═══════════════════════════════════════════════════════════════════════
    # PHASE 1: PREFLIGHT
    # ═══════════════════════════════════════════════════════════════════════
    - name: "preflight | Wait for SSH port"
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 120
        delay: 5
      delegate_to: localhost
      tags: [preflight]

    - name: "preflight | Verify RouterOS responds"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/system identity print'
      register: _identity
      retries: 3
      delay: 10
      until: _identity.rc == 0
      changed_when: false
      tags: [preflight]

    - name: "preflight | Get RouterOS version"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/system resource print' | grep -E "version|cpu-count|free-memory"
      register: _ros_version
      changed_when: false
      tags: [preflight]

    - name: "preflight | Report"
      ansible.builtin.debug:
        msg: |
          {{ hostname }} ({{ ansible_host }}): SSH OK
          {{ _ros_version.stdout | default('version unknown') }}
      tags: [preflight]

    # ═══════════════════════════════════════════════════════════════════════
    # PHASE 2: BASE CONFIGURATION
    # ═══════════════════════════════════════════════════════════════════════
    - name: "base | Set system identity (hostname)"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/system identity set name={{ hostname }}'
      changed_when: true
      tags: [base]

    - name: "base | Configure NTP client"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/system ntp client set enabled=yes servers=0.pool.ntp.org,1.pool.ntp.org'
      changed_when: true
      tags: [base]

    - name: "base | Configure DNS"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip dns set servers={{ exit_dns_servers | join(",") }} allow-remote-requests=yes'
      changed_when: true
      tags: [base]

    - name: "base | Disable unnecessary services (security hardening)"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip service disable api,api-ssl,ftp,telnet,www,www-ssl,winbox'
      changed_when: true
      failed_when: false
      tags: [base]

    - name: "base | Enable SSH only"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip service enable ssh'
      changed_when: true
      tags: [base]

    - name: "base | Set router-id for BGP/OSPF"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing id add name=main id={{ router_id }} disabled=no'
      changed_when: true
      failed_when: false
      tags: [base]

    - name: "base | Configure management IP (if not already set by DHCP)"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip address add address={{ mgmt_ip }} interface={{ mgmt_interface.port }} comment=Management disabled=no'
      changed_when: true
      failed_when: false
      tags: [base]

    - name: "base | Set default gateway for management"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip route add dst-address=0.0.0.0/0 gateway={{ mgmt_gateway }} routing-table=main comment=mgmt-default distance=250'
      changed_when: true
      failed_when: false
      tags: [base]

    # ═══════════════════════════════════════════════════════════════════════
    # PHASE 3: FABRIC INTERFACE + BGP
    # ═══════════════════════════════════════════════════════════════════════
    - name: "bgp | Configure fabric-facing interface"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/interface ethernet set {{ item.port }} speed={{ item.speed }}Mbps mtu=9216 l2mtu=9216'
      loop: "{{ fabric_interfaces }}"
      loop_control:
        label: "{{ item.port }}"
      changed_when: true
      failed_when: false
      tags: [bgp]

    - name: "bgp | Add IP address to fabric interface"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip address add address={{ item.local_ip }} interface={{ item.port }} comment=fabric_{{ item.neighbor }}'
      loop: "{{ fabric_interfaces | selectattr('local_ip', 'defined') | list }}"
      loop_control:
        label: "{{ item.port }} = {{ item.local_ip }}"
      changed_when: true
      failed_when: false
      tags: [bgp]

    - name: "bgp | Create BGP instance"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing bgp template add name=fabric as={{ bgp_local_asn }} router-id={{ router_id }} address-families=ip disabled=no'
      changed_when: true
      failed_when: false
      tags: [bgp]

    - name: "bgp | Configure BGP connection to border-leaf"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing bgp connection add name=to_{{ item.neighbor }} remote.address={{ item.neighbor_ip }}/32 remote.as={{ item.neighbor_asn }} local.role=ebgp local.address={{ item.local_ip | regex_replace("/.*$", "") }} templates=fabric routing-table=main as={{ bgp_local_asn }} multihop=no disabled=no'
      loop: "{{ fabric_interfaces | selectattr('neighbor_ip', 'defined') | list }}"
      loop_control:
        label: "BGP → {{ item.neighbor }} (AS{{ item.neighbor_asn }})"
      changed_when: true
      failed_when: false
      tags: [bgp]

    - name: "bgp | Configure BGP input filter (honor GRACEFUL_SHUTDOWN)"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing filter rule add chain=bgp-in rule="if (bgp-communities includes 65535:0) { set bgp-local-pref 0; accept; }"'
      changed_when: true
      failed_when: false
      when: honor_gshut | bool
      tags: [bgp]

    - name: "bgp | Configure BGP output filter (advertise default route)"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing filter rule add chain=bgp-out rule="if (dst == 0.0.0.0/0) { accept; } else { reject; }"'
      changed_when: true
      failed_when: false
      when: exit_advertise_default | bool
      tags: [bgp]

    - name: "bgp | Apply filters to BGP connections"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing bgp connection set [find name~"to_"] input.filter=bgp-in output.filter=bgp-out'
      changed_when: true
      failed_when: false
      tags: [bgp]

    - name: "bgp | Add loopback address for router-id reachability"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip address add address={{ router_id }}/32 interface=lo comment=loopback'
      changed_when: true
      failed_when: false
      tags: [bgp]

    - name: "bgp | Configure default route redistribution into BGP"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing bgp connection set [find name~"to_"] output.redistribute=connected,static output.default-originate=always'
      changed_when: true
      failed_when: false
      when: exit_advertise_default | bool
      tags: [bgp]

    # ═══════════════════════════════════════════════════════════════════════
    # PHASE 4: NAT (Source NAT for fabric → external)
    # ═══════════════════════════════════════════════════════════════════════
    - name: "nat | Configure source NAT (masquerade) for fabric traffic"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall nat add chain=srcnat out-interface={{ exit_nat_out_interface }} src-address={{ item }} action=masquerade comment=fabric-snat-{{ item | regex_replace("/", "_") }}'
      loop: "{{ exit_nat_src_ranges }}"
      loop_control:
        label: "SNAT {{ item }} → {{ exit_nat_out_interface }}"
      changed_when: true
      failed_when: false
      when: exit_nat_enabled | bool
      tags: [nat]

    # ═══════════════════════════════════════════════════════════════════════
    # PHASE 5: FIREWALL (basic input chain protection)
    # ═══════════════════════════════════════════════════════════════════════
    - name: "firewall | Accept established/related connections"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=input action=accept connection-state=established,related comment=accept-established'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Accept ICMP"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=input action=accept protocol=icmp comment=accept-icmp'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Accept SSH from management subnet"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=input action=accept protocol=tcp dst-port=22 src-address=172.16.2.0/24 comment=accept-ssh-mgmt'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Accept BGP from fabric peers"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=input action=accept protocol=tcp dst-port=179 src-address=10.0.253.0/24 comment=accept-bgp-fabric'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Accept BFD from fabric peers"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=input action=accept protocol=udp dst-port=3784,3785 src-address=10.0.253.0/24 comment=accept-bfd'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Drop all other input"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=input action=drop comment=drop-all-else'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Accept forward established/related"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=forward action=accept connection-state=established,related comment=fwd-established'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Accept forward from fabric to external"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=forward action=accept src-address=10.0.0.0/8 out-interface={{ exit_nat_out_interface }} comment=fwd-fabric-out'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    - name: "firewall | Drop invalid forward"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter add chain=forward action=drop connection-state=invalid comment=drop-invalid-fwd'
      changed_when: true
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [firewall]

    # ═══════════════════════════════════════════════════════════════════════
    # PHASE 6: VERIFICATION
    # ═══════════════════════════════════════════════════════════════════════
    - name: "verify | Check BGP sessions"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/routing bgp session print detail'
      register: _bgp_sessions
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: "verify | Check BGP received routes"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip route print where bgp count-only'
      register: _bgp_route_count
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: "verify | Check interface status"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/interface print where running=yes'
      register: _iface_status
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: "verify | Check NAT rules"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall nat print'
      register: _nat_rules
      changed_when: false
      failed_when: false
      when: exit_nat_enabled | bool
      tags: [verify]

    - name: "verify | Check firewall filter rules"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ip firewall filter print'
      register: _fw_rules
      changed_when: false
      failed_when: false
      when: exit_firewall_enabled | bool
      tags: [verify]

    - name: "verify | Ping border-leaf neighbor IP"
      ansible.builtin.shell: |
        {{ mikrotik_ssh_cmd }} '/ping {{ item.neighbor_ip }} count=3'
      loop: "{{ fabric_interfaces | selectattr('neighbor_ip', 'defined') | list }}"
      loop_control:
        label: "ping {{ item.neighbor_ip }} ({{ item.neighbor }})"
      register: _ping_results
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: "verify | Display deployment status"
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          {{ hostname }} ({{ ansible_host }}) — Exit Router Deployment Status
          ═══════════════════════════════════════════════════════════════════
          
          BGP Sessions:
          {{ _bgp_sessions.stdout | default('  (none)') }}
          
          BGP Routes Received: {{ _bgp_route_count.stdout | default('0') }}
          
          Active Interfaces:
          {{ _iface_status.stdout | default('  (none)') }}
          
          NAT Rules: {{ (_nat_rules.stdout_lines | default([])) | length }} configured
          Firewall Rules: {{ (_fw_rules.stdout_lines | default([])) | length }} configured
          
          Peer Connectivity:
          {% for result in _ping_results.results | default([]) %}
            {{ result.item.neighbor_ip }} ({{ result.item.neighbor }}): {{ 'OK' if result.rc == 0 else 'FAILED' }}
          {% endfor %}
          ═══════════════════════════════════════════════════════════════════
      tags: [verify]


# ─────────────────────────────────────────────────────────────────────────────
# Play 2: Summary
# ─────────────────────────────────────────────────────────────────────────────
- name: "Exit Router Deployment Summary"
  hosts: localhost
  gather_facts: false
  become: false
  connection: local
  tasks:
    - name: "Print deployment summary"
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          MikroTik CHR Exit Router Deployment Complete
          ═══════════════════════════════════════════════════════════════════
          
          Routers Deployed:
          {% for host in groups['exit_routers'] %}
            {{ host }}: {{ hostvars[host].ansible_host }} (AS{{ hostvars[host].bgp_local_asn }})
              Peer: {{ hostvars[host].fabric_interfaces[0].neighbor }} (AS{{ hostvars[host].fabric_interfaces[0].neighbor_asn }})
              Link: {{ hostvars[host].fabric_interfaces[0].local_ip | default('not configured') }}
          {% endfor %}
          
          Features Configured:
            ✓ System identity, NTP, DNS
            ✓ Security hardening (SSH-only, disabled services)
            ✓ BGP eBGP peering with border-leaves
            ✓ GRACEFUL_SHUTDOWN community honored (RFC 8326)
            ✓ Default route origination into fabric
            ✓ Source NAT (masquerade) for fabric → external
            ✓ Firewall input/forward chain protection
            ✓ MTU 9216 on fabric-facing interfaces
          
          Topology:
            Border_Leaf1 (65021) ── 10.0.253.0/31 ── Exit_Router1 (65253)
            Border_Leaf2 (65022) ── 10.0.253.2/31 ── Exit_Router2 (65254)
          
          Verify:
            ansible-playbook playbooks/deploy_exit_routers.yml -i inventory/hosts.yml --tags verify
          ═══════════════════════════════════════════════════════════════════
      tags: [always]
