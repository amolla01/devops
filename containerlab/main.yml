- name: Install prerequisite packages for kubespray
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - curl
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  become: true

- name: Set hostname to match inventory name
  ansible.builtin.hostname:
    name: "{{ hostname | default(inventory_hostname) }}"
  become: true

- name: Ensure hostname resolves to primary IP in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ ansible_host }}\\s"
    line: "{{ ansible_host }} {{ hostname | default(inventory_hostname) }}"
    state: present
  become: true
