---
- name: Assert BGP vars are present
  ansible.builtin.assert:
    that:
      - bgp_local_asn is defined
      - loopback_ip is defined
      - server_interfaces is defined and server_interfaces | length > 0
    fail_msg: "bgp_local_asn, loopback_ip, and server_interfaces must all be defined"

- name: Install FRR
  ansible.builtin.package:
    name: frr
    state: present
  become: true

- name: Enable bgpd in FRR daemons file
  ansible.builtin.template:
    src: daemons.j2
    dest: /etc/frr/daemons
    mode: "0644"
  become: true

- name: Harden IPv6 ND on fabric uplinks (prevent link-local neighbor FAILED -> ECMP leg blackhole)
  ansible.builtin.template:
    src: nd-stability.conf.j2
    dest: /etc/sysctl.d/60-frr-nd-stability.conf
    mode: "0644"
  become: true
  register: nd_stability_conf

- name: Apply the ND-stability sysctls now
  ansible.builtin.command: sysctl -p /etc/sysctl.d/60-frr-nd-stability.conf
  become: true
  when: nd_stability_conf is changed
  changed_when: false

- name: Deploy FRR BGP configuration
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    mode: "0640"
    owner: frr
    group: frr
  become: true

- name: Ensure FRR is enabled and restarted to pick up config
  ansible.builtin.service:
    name: frr
    state: restarted
    enabled: true
  become: true

- name: Wait for BGP to initialise
  ansible.builtin.pause:
    seconds: 10

- name: Verify BGP summary is reachable
  ansible.builtin.command: vtysh -c "show bgp summary"
  become: true
  changed_when: false
  register: bgp_check
  failed_when: bgp_check.rc != 0

- name: Prefer the fabric default route for package downloads once BGP is present
  ansible.builtin.shell: |
    set -e
    if ip route show default | grep -q 'proto bgp'; then
      ip route del default via 10.0.0.2 dev {{ mgmt_interface | default('enp1s0') }} 2>/dev/null || true
      ip route del default via {{ netplan_mgmt_gateway }} dev {{ mgmt_interface | default('enp1s0') }} 2>/dev/null || true
    fi
  become: true
  changed_when: false
