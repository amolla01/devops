---
- name: Generate containerlab route and reachability dashboard
  hosts: lab_servers[0]
  become: true
  gather_facts: true
  vars:
    clab_root_dir: "{{ playbook_dir | regex_replace('/playbooks$', '') }}"
    report_dir: "{{ remote_lab_dir | default(clab_root_dir) }}/reports"
    control_report_dir: "{{ clab_root_dir }}/reports"
    report_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    report_file: "{{ report_dir }}/clab-route-report-{{ report_timestamp }}.html"
    report_title: "containerlab route and reachability report"
    report_target: "203.0.113.1"
    report_dns_name: "bbc.com"
    report_mgmt_subnet: "{{ sonic_mgmt_subnet | default('172.16.2.0/24') }}"
    report_sources: >-
      {{ (groups['all'] | default([]) | reject('equalto', 'localhost') | list | unique) }}
    report_targets: >-
      {{ (groups['all'] | default([]) | reject('equalto', 'localhost') | list | unique) }}
  tasks:
    - name: Ensure report directory exists on the lab control node
      ansible.builtin.file:
        path: "{{ control_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Ensure report directory exists on the configured lab path
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Initialize report entries
      ansible.builtin.set_fact:
        clab_route_report_entries: []

    - name: Collect route and reachability data for each VM pair
      ansible.builtin.shell: |
        set -o pipefail
        set +e
        src_host='{{ item.0 }}'
        dst_host='{{ item.1 }}'
        dst_ip='{{ hostvars[item.1].ansible_host | default("n/a") }}'
        dst_loop='{{ hostvars[item.1].loopback_ip | default("n/a") }}'
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          "{{ hostvars[item.0].ansible_user | default('ubuntu') }}@{{ hostvars[item.0].ansible_host | default('n/a') }}" "
          printf 'SOURCE=%s\n' \"$src_host\";
          printf 'TARGET=%s\n' \"$dst_host\";
          printf 'MGMT_IP=%s\n' \"$dst_ip\";
          printf 'LOOPBACK_IP=%s\n' \"$dst_loop\";
          printf '\nROUTE_LOOKUP\n';
          ip route get \"$dst_loop\" 2>&1 || true;
          printf '\nPING_LOOPBACK\n';
          ping -c 2 -W 2 \"$dst_loop\" 2>&1 || true;
          printf '\nPING_INTERNET\n';
          ping -c 2 -W 2 '{{ report_target }}' 2>&1 || true;
          printf '\nBGP_SUMMARY\n';
          (vtysh -c 'show ip bgp summary' 2>&1 || echo 'BGP summary unavailable') || true;
        "
      loop: >-
        {{
          (report_sources | list)
          | product(report_targets | list)
          | list
        }}
      when: >-
        item.0 != item.1 and
        hostvars[item.0].ansible_host is defined and
        hostvars[item.1].ansible_host is defined and
        (hostvars[item.1].loopback_ip is defined or hostvars[item.1].ansible_host is defined)
      register: report_probe
      changed_when: false
      failed_when: false

    - name: Build structured report rows
      ansible.builtin.set_fact:
        clab_route_report_entries: >-
          {{ clab_route_report_entries + [{
            'source_host': item.item[0],
            'target_host': item.item[1],
            'mgmt_ip': hostvars[item.item[1]].ansible_host | default('n/a'),
            'loopback_ip': (hostvars[item.item[1]].loopback_ip | default('n/a')).split('/') | first,
            'route_lookup': ((item.stdout | default('')) | regex_replace('(?s).*?ROUTE_LOOKUP\\n', '') | regex_replace('\\nPING_LOOPBACK.*', '') | trim) if (item.stdout | default('')) else 'n/a',            'status': (
              'SSH_DENIED' if (((item.stdout | default('')) | regex_search('Permission denied|Connection refused|ssh: connect to host .* port .*|Failed to connect')) is not none) else
              'NO_ROUTE' if (((item.stdout | default('')) | regex_search('No route to host|Network is unreachable|Destination Host Unreachable|ip route get.*not found')) is not none) else
              'FRR_UNAVAILABLE' if (((item.stdout | default('')) | regex_search('BGP summary unavailable|vtysh:|Unable to connect to.*bgpd|No such file or directory')) is not none) else
              'PING_FAILED' if (((item.stdout | default('')) | regex_search('100% packet loss|Destination Host Unreachable|1 packets transmitted, 0 received|2 packets transmitted, 0 received|packet loss')) is not none) else
              'OK' if (((item.stdout | default('')) | regex_search('0% packet loss|1 packets transmitted, 1 received|2 packets transmitted, 2 received')) is not none) else 'PING_FAILED'
            ),            'internet_ping': 'OK' if (((item.stdout | default('')) | regex_search('0% packet loss|1 packets transmitted, 1 received|2 packets transmitted, 2 received')) is not none) else 'FAILED',
            'bgp_summary': ((item.stdout | default('')) | regex_replace('(?s).*?BGP_SUMMARY\\n', '') | trim) if (item.stdout | default('')) else 'n/a',
            'source_ip': hostvars[item.item[0]].ansible_host | default('n/a')
          }] }}
      loop: "{{ report_probe.results | default([]) }}"

    - name: Render HTML report from collected data
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/clab-route-report.html.j2"
        dest: "{{ report_file }}"
        mode: "0644"
      vars:
        report_entries: "{{ clab_route_report_entries }}"
        report_title_value: "{{ report_title }}"
        report_timestamp_value: "{{ report_timestamp }}"
        report_target_value: "{{ report_target }}"
        report_dns_name_value: "{{ report_dns_name }}"
        report_mgmt_subnet_value: "{{ report_mgmt_subnet }}"

    - name: Fetch generated report into the local clab reports folder on the control node
      ansible.builtin.fetch:
        src: "{{ report_file }}"
        dest: "{{ control_report_dir }}/"
        flat: true
      run_once: true

    - name: Print report path
      ansible.builtin.debug:
        msg: "Generated dashboard at remote path {{ report_file }} and locally staged at {{ control_report_dir }}/{{ report_file | basename }}"
