---
# =============================================================================
# verify-fabric-ecmp.yml  ·  READ-ONLY, NON-FATAL fabric reachability verifier
# -----------------------------------------------------------------------------
# Diagnoses the "checkerboard" cluster-subnet ping pattern: dual-homed hosts
# advertise their /32 via BOTH leaves of their rack, so every remote /32 has two
# ECMP next-hops. If one leaf of a pair has the session Established but is NOT
# installing/propagating a given /32, the flows that deterministically hash onto
# that leg blackhole -> per (src,dst) pair pass/fail that never recovers.
#
# This play ONLY reports. Nothing here changes state and nothing fails the run
# (every task is failed_when:false / any_errors_fatal:false). Safe to run
# on/off, solo, as often as you like.
#
# Run it from a host that can reach the 172.16.2.0/24 OOB mgmt bridge
# (typically the R810 clab host, or the control node when its route is up):
#
#   ansible-playbook -i inventory.yml playbooks/verify-fabric-ecmp.yml
#
# Narrow scope while triaging:
#   ... --limit Leaf-L1,Leaf-L2            # just rack1 leaves
#   ... --limit k8s_cluster                # skip switches, host side only
#   ... -e verify_ping_matrix=false        # skip the (slower) ping matrix
# =============================================================================

# ── PLAY 1 · Leaf/Border-leaf: BGP session health + missing cluster /32s ─────
- name: "ECMP verify · leaf BGP sessions and route propagation"
  hosts: leaves:border_leaves
  gather_facts: false
  become: true
  any_errors_fatal: false
  vars:
    # Cluster IPs come straight from inventory (the 'ip:' on every k8s_cluster host)
    cluster_expected_ips: >-
      {{ groups['k8s_cluster']
         | map('extract', hostvars, 'ip')
         | select('string') | list }}
    # vtysh lives inside the FRR/BGP container on SONiC. The container name
    # varies by image (bgp / bgp0 / frr / sonic-frr). Auto-detect it, and record
    # rc/stderr so a bad collection can never masquerade as "0 routes installed".
  tasks:
    - name: "Detect the FRR/BGP container name on this switch"
      ansible.builtin.shell: |
        for c in bgp frr bgp0 sonic-frr; do
          if docker ps --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | grep -qx "$c"; then
            echo "$c"; exit 0
          fi
        done
        # last resort: first container whose name contains 'bgp' or 'frr'
        docker ps --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | grep -Ei 'bgp|frr' | head -1
      args:
        executable: /bin/bash
      register: frr_ctr
      changed_when: false
      failed_when: false

    - name: "Collect BGP ipv4 summary JSON via vtysh"
      ansible.builtin.shell: |
        set -o pipefail
        ctr="{{ frr_ctr.stdout | trim }}"
        if [ -z "$ctr" ]; then echo '{}'; exit 3; fi
        docker exec "$ctr" vtysh -c "show ip bgp ipv4 unicast summary json"
      args:
        executable: /bin/bash
      register: bgp_sum_raw
      changed_when: false
      failed_when: false

    - name: "Collect full route table JSON via vtysh"
      ansible.builtin.shell: |
        set -o pipefail
        ctr="{{ frr_ctr.stdout | trim }}"
        if [ -z "$ctr" ]; then echo '{}'; exit 3; fi
        docker exec "$ctr" vtysh -c "show ip route json"
      args:
        executable: /bin/bash
      register: bgp_route_raw
      changed_when: false
      failed_when: false

    - name: "RAW DIAG · what vtysh actually returned"
      ansible.builtin.debug:
        msg:
          - "leaf={{ inventory_hostname }} container='{{ frr_ctr.stdout | trim }}' sum_rc={{ bgp_sum_raw.rc | default('n/a') }} sum_len={{ bgp_sum_raw.stdout | default('') | length }} route_rc={{ bgp_route_raw.rc | default('n/a') }} route_len={{ bgp_route_raw.stdout | default('') | length }}"
          - "SUM_STDERR: {{ bgp_sum_raw.stderr | default('') | trim }}"
          - "ROUTE_STDERR: {{ bgp_route_raw.stderr | default('') | trim }}"
          - "route_slash32_hits={{ bgp_route_raw.stdout | default('') | regex_findall('/32') | length }}  route_10dot_hits={{ bgp_route_raw.stdout | default('') | regex_findall('10\\.0\\.') | length }}"
          - "route_sample_around_/32: {{ bgp_route_raw.stdout | default('') | regex_search('.{0,34}/32') }}"
          - "route_head: {{ bgp_route_raw.stdout | default('') | truncate(240, true, '') }}"

    - name: "Count Established sessions (from summary JSON)"
      ansible.builtin.set_fact:
        established_count: >-
          {{ ((bgp_sum_raw.stdout | default('{}') | from_json).peers | default({}))
             | dict2items | selectattr('value.state', 'equalto', 'Established') | list | length }}
      failed_when: false

    - name: "Default established_count if summary JSON was unparseable"
      ansible.builtin.set_fact:
        established_count: "{{ established_count | default(0) }}"

    - name: "Extract the /32 cluster prefixes actually installed on this leaf"
      # Scrape the raw JSON text for "10.0.<rack>.<host>/32" keys instead of
      # from_json|dict2items: the big route blob intermittently fails structured
      # parse and silently falls back to [] (false "0 installed"). regex_findall
      # on the text is immune to that and returns the IP (group) without /32.
      ansible.builtin.set_fact:
        present_cluster_ips: >-
          {{ bgp_route_raw.stdout | default('')
             | regex_findall('(10\\.0\\.(?:10|20|30)\\.[0-9]+)/32')
             | unique | list }}
      failed_when: false

    - name: "Fallback: default present list to empty if JSON was unparseable"
      ansible.builtin.set_fact:
        present_cluster_ips: "{{ present_cluster_ips | default([]) }}"

    - name: "Compute cluster /32s MISSING from this leaf (blackhole legs)"
      ansible.builtin.set_fact:
        missing_cluster_ips: "{{ cluster_expected_ips | difference(present_cluster_ips) }}"

    - name: "REPORT · {{ inventory_hostname }}"
      ansible.builtin.debug:
        msg:
          - "leaf={{ inventory_hostname }}  frr_container='{{ frr_ctr.stdout | trim }}'  sum_rc={{ bgp_sum_raw.rc | default('n/a') }}  route_rc={{ bgp_route_raw.rc | default('n/a') }}"
          - "established_sessions={{ established_count }}"
          - "installed_cluster_/32={{ present_cluster_ips | length }} / expected={{ cluster_expected_ips | length }}"
          - "MISSING_ON_THIS_LEAF={{ missing_cluster_ips }}"
          - >-
            {{ 'COLLECTION FAILED (route_rc=' ~ (bgp_route_raw.rc | default('n/a')) ~ ' route_len=' ~ (bgp_route_raw.stdout | default('') | length) ~ ') - result NOT trustworthy: ' ~ (bgp_route_raw.stderr | default('') | trim)
               if (bgp_route_raw.rc | default(1) != 0 or (bgp_route_raw.stdout | default('') | length) < 20)
               else ('>>> This leaf is a blackhole leg for the prefixes above <<<'
                     if (missing_cluster_ips | length > 0)
                     else 'OK: all cluster /32s installed on this leaf') }}

# ── PLAY 2 · Hosts: ECMP next-hop count + non-fatal reachability matrix ───────
- name: "ECMP verify · host next-hops and cluster-subnet reachability"
  hosts: k8s_cluster
  gather_facts: false
  become: true
  any_errors_fatal: false
  vars:
    verify_ping_matrix: true
    peers: "{{ groups['k8s_cluster'] | reject('equalto', inventory_hostname) | list }}"
  tasks:
    - name: "Show installed nexthops to each peer /32 (detect single-leg ECMP)"
      ansible.builtin.shell: |
        set -o pipefail
        r="$(ip route show {{ hostvars[item].ip }} 2>/dev/null)"
        if [ -z "$r" ]; then echo "NOROUTE"; exit 0; fi
        n="$(printf '%s\n' "$r" | grep -c 'nexthop')"
        [ "$n" -eq 0 ] && n=1
        echo "nexthops=$n"
      args:
        executable: /bin/bash
      loop: "{{ peers }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].ip }})"
      register: nexthop_check
      changed_when: false
      failed_when: false

    - name: "Flag peers with a broken/degraded path (no route or single leg)"
      ansible.builtin.set_fact:
        single_leg_or_noroute: >-
          {{ nexthop_check.results
             | selectattr('stdout', 'ne', 'nexthops=2')
             | map(attribute='item') | list }}

    - name: "Non-fatal ping matrix to every peer cluster IP"
      ansible.builtin.command: ping -c 2 -W 2 {{ hostvars[item].ip }}
      loop: "{{ peers }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].ip }})"
      register: ping_matrix
      changed_when: false
      failed_when: false
      when: verify_ping_matrix | bool

    - name: "Summarise reachability"
      ansible.builtin.set_fact:
        unreachable_peers: >-
          {{ (ping_matrix.results | default([]))
             | selectattr('rc', 'defined')
             | selectattr('rc', 'ne', 0)
             | map(attribute='item') | list }}
        reachable_peers: >-
          {{ (ping_matrix.results | default([]))
             | selectattr('rc', 'defined')
             | selectattr('rc', 'eq', 0)
             | map(attribute='item') | list }}
      when: verify_ping_matrix | bool

    - name: "Show the installed route for each UNREACHABLE peer (nexthop diagnosis)"
      ansible.builtin.command: ip route show {{ hostvars[item].ip }}
      loop: "{{ unreachable_peers | default([]) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].ip }})"
      register: unreachable_routes
      changed_when: false
      failed_when: false
      when: (verify_ping_matrix | bool) and (unreachable_peers | default([]) | length > 0)

    - name: "REPORT · {{ inventory_hostname }} ({{ hostvars[inventory_hostname].ip }})"
      ansible.builtin.debug:
        msg: >-
          {{
            [
              'host=' ~ inventory_hostname ~ '  cluster_ip=' ~ hostvars[inventory_hostname].ip,
              'single_leg_or_noroute=' ~ (single_leg_or_noroute | default([]) | join(', ') if (single_leg_or_noroute | default([]) | length > 0) else 'none (full dual-homed ECMP)')
            ]
            + (
              ['reachable=' ~ (reachable_peers | default([]) | length) ~ '/' ~ (peers | length),
               'UNREACHABLE=' ~ (unreachable_peers | default([]) | join(', ') if (unreachable_peers | default([]) | length > 0) else 'none')]
              if (verify_ping_matrix | bool) else []
            )
          }}

    - name: "REPORT · installed routes for unreachable peers on {{ inventory_hostname }}"
      ansible.builtin.debug:
        msg: "{{ item.item }} ({{ hostvars[item.item].ip }}) -> {{ (item.stdout | default('') | trim) if (item.stdout | default('') | trim | length > 0) else 'NO ROUTE INSTALLED' }}"
      loop: "{{ unreachable_routes.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: (verify_ping_matrix | bool) and (unreachable_peers | default([]) | length > 0)
