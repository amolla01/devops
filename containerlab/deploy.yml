    - name: Guardrail - collect first exited generic_vm name
      ansible.builtin.shell: |
        set -e
        docker ps -a --format '{{"{{"}}.Names{{"}}"}} {{"{{"}}.Status{{"}}"}}' \
          | awk '/^Host|^MonSrv/ { if ($0 ~ /^.+ Exited /) { print $1; exit 0 } }'
      args:
        executable: /bin/bash
      register: first_exited_generic_vm
      changed_when: false
      failed_when: false

    - name: Guardrail - show failure log for first exited generic_vm
      ansible.builtin.command: "docker logs --tail 120 {{ first_exited_generic_vm.stdout }}"
      register: exited_vm_log
      changed_when: false
      when: first_exited_generic_vm.stdout | length > 0

    - name: Guardrail - fail with actionable diagnostics if any generic_vm SSH is down
      ansible.builtin.assert:
        that:
          - (generic_vm_ssh_wait.results | selectattr('failed', 'defined') | selectattr('failed') | list | length) == 0
        fail_msg: >-
          One or more generic_vm nodes did not reach SSH on port 22.
          First exited container: {{ first_exited_generic_vm.stdout | default('none') }}.
          {% if exited_vm_log is defined and exited_vm_log.stdout is defined %}Docker log tail:\n{{ exited_vm_log.stdout | replace('\n', '\\n') }}{% else %}No exited generic_vm docker log captured.{% endif %}

