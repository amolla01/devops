---
- name: Deploy containerlab topology on R810, Storage & OverlayFS Fabric Audit
  hosts: lab_servers
  become: true
  gather_facts: true
  vars:
    local_project_root: "{{ playbook_dir }}/../../"
    remote_topo_file: "{{ remote_lab_dir }}/topology.clab.yml"
  tasks:
    - name: Ensure containerlab is installed
      ansible.builtin.command: "containerlab version"
      changed_when: false

    - name: Ensure remote lab directory exists
      ansible.builtin.file:
        path: "{{ remote_lab_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure host bridge + VLAN support is present on the lab server
      ansible.builtin.apt:
        name:
          - bridge-utils
          - vlan
          - iproute2
        state: present
        update_cache: false

    - name: Check whether the host internet bridge already exists
      ansible.builtin.command: "ip link show br-internet"
      register: br_internet_check
      failed_when: false
      changed_when: false

    - name: Create the host internet bridge when it is missing
      ansible.builtin.command: "ip link add br-internet type bridge"
      when: br_internet_check.rc != 0
      register: br_internet_create

    - name: Guardrail - report whether br-internet was created or already existed
      ansible.builtin.debug:
        msg: >-
          br-internet {{ 'created' if br_internet_create is defined and br_internet_create.changed else 'already existed' }}

    - name: Check whether the host VLAN subinterface already exists
      ansible.builtin.command: "ip link show eno1.100"
      register: eno1_vlan_check
      failed_when: false
      changed_when: false

    - name: Create the external VLAN subinterface on eno1 if missing
      ansible.builtin.command: "ip link add link eno1 name eno1.100 type vlan id 100"
      when: eno1_vlan_check.rc != 0
      register: eno1_vlan_create

    - name: Guardrail - report whether eno1.100 was created or already existed
      ansible.builtin.debug:
        msg: >-
          eno1.100 {{ 'created' if eno1_vlan_create is defined and eno1_vlan_create.changed else 'already existed' }}

    - name: Attach the host VLAN subinterface to the internet bridge without disturbing eno1
      ansible.builtin.command: "ip link set eno1.100 master br-internet"
      register: br_internet_attach
      failed_when: false
      changed_when: false

    - name: Bring the internet bridge up if it exists
      ansible.builtin.command: "ip link set br-internet up"
      register: br_internet_up
      failed_when: false
      changed_when: false

    - name: Bring the host VLAN subinterface up if it exists
      ansible.builtin.command: "ip link set eno1.100 up"
      register: eno1_vlan_up
      failed_when: false
      changed_when: false

    - name: Sync project tree to R810
      ansible.posix.synchronize:
        src: "{{ local_project_root }}/"
        dest: "{{ remote_lab_dir }}/"
        recursive: true
        delete: true
      become: false

    - name: Ensure genisoimage is installed (for cloud-init seed ISO)
      ansible.builtin.apt:
        name:
          - genisoimage
          - qemu-utils
        state: present
        update_cache: false

    - name: Generate cloud-init seed ISO for generic_vm nodes
      ansible.builtin.command:
        cmd: >-
          genisoimage -output {{ remote_lab_dir }}/configs/cloud-init/seed.iso
          -volid cidata -joliet -rock
          {{ remote_lab_dir }}/configs/cloud-init/user-data
          {{ remote_lab_dir }}/configs/cloud-init/meta-data
      changed_when: true

    - name: Create Ceph OSD backing disks required by topology bind mounts
      ansible.builtin.command:
        cmd: bash {{ remote_lab_dir }}/configs/ceph-disks/create-osd-disks.sh
        # cmd: bash {{ remote_lab_dir }}/configs/ceph-disks/create-k8_osh-disks.sh
      register: ceph_disk_create
      changed_when: "'created ' in ceph_disk_create.stdout"

    # - name: Create Host VM 150 GB data disks required by topology bind mounts
    #   ansible.builtin.command:
    #     cmd: bash {{ remote_lab_dir }}/configs/vmdisks/create-host-disks.sh
    #   register: host_disk_create
    #   changed_when: "'created ' in host_disk_create.stdout"
    - name: Create Host VM XX GB data disks required by topology bind mounts
      ansible.builtin.command:
        # cmd: bash {{ remote_lab_dir }}/configs/vmdisks/create-host-disks.sh
        cmd: bash {{ remote_lab_dir }}/configs/vmdisks/create-k8_osh-disks.sh
      register: host_disk_create
      # UPDATED: Only marks as changed if a brand-new file was actually created from scratch
      changed_when: "'created and pre-formatted' in host_disk_create.stdout"


    - name: Guardrail - fail if topology still contains unsupported serial=hostdata
      ansible.builtin.shell: |
        set -e
        if grep -n 'serial=hostdata' "{{ remote_topo_file }}" >/dev/null; then
          echo "ERROR: unsupported QEMU option found in {{ remote_topo_file }}: serial=hostdata"
          echo "       remove serial=hostdata from -drive entries for generic_vm nodes"
          grep -n 'serial=hostdata' "{{ remote_topo_file }}" || true
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

