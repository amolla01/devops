    #   ansible.builtin.assert:
    #     that:
    #       - item.stat.exists
    #       - item.stat.isreg
    #     fail_msg: >-
    #       Missing required VM data disk on R810: {{ item.stat.path }}.
    #       Re-run deploy sync and create-host-disks step.
    #   loop: "{{ host_data_disk_stats.results }}"
    #   loop_control:
    #     label: "{{ item.stat.path }}"


    - name: Destroy existing topology if present
      ansible.builtin.command: "containerlab destroy -t {{ remote_topo_file }} --cleanup"
      failed_when: false
      changed_when: true

    - name: Remove stale containerlab state directories
      ansible.builtin.shell: "find {{ remote_lab_dir }} -maxdepth 1 -type d -name 'clab-*' -exec rm -rf {} +"
      changed_when: true

    - name: Deploy topology on R810
      ansible.builtin.command: "containerlab deploy -t {{ remote_topo_file }} --reconfigure"

    - name: Probe All Datacenter SSH Ports Concurrently (Non-Blocking)
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 45
        delay: 0
      loop: "{{ groups['sonic_switches'] + groups['linux_endpoints'] + groups['exit_routers'] }}"
      loop_control:
        label: "Checking socket readiness: {{ item }} -> {{ hostvars[item].ansible_host }}"
      async: 45
      poll: 0
      register: concurrent_ssh_probes

    - name: Synchronize and Await Port Validation Results
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ concurrent_ssh_probes.results }}"
      loop_control:
        label: "Syncing status for JID: {{ item.ansible_job_id | default('SKIPPED') }}"
      register: generic_vm_ssh_wait
      until: generic_vm_ssh_wait.finished
      retries: 45
      delay: 1
      failed_when: false

