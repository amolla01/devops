---
- name: Deploy containerlab topology on R810
  hosts: lab_servers
  become: true
  gather_facts: true
  vars:
    local_project_root: "{{ playbook_dir }}/../../"
    remote_topo_file: "{{ remote_lab_dir }}/topology.clab.yml"
  tasks:
    - name: Ensure containerlab is installed
      ansible.builtin.command: "containerlab version"
      changed_when: false

    - name: Ensure remote lab directory exists
      ansible.builtin.file:
        path: "{{ remote_lab_dir }}"
        state: directory
        mode: "0755"

    - name: Sync project tree to R810
      ansible.posix.synchronize:
        src: "{{ local_project_root }}/"
        dest: "{{ remote_lab_dir }}/"
        recursive: true
        delete: true
      become: false

    - name: Ensure genisoimage is installed (for cloud-init seed ISO)
      ansible.builtin.apt:
        name:
          - genisoimage
          - qemu-utils
        state: present
        update_cache: false

    - name: Generate cloud-init seed ISO for generic_vm nodes
      ansible.builtin.command:
        cmd: >-
          genisoimage -output {{ remote_lab_dir }}/configs/cloud-init/seed.iso
          -volid cidata -joliet -rock
          {{ remote_lab_dir }}/configs/cloud-init/user-data
          {{ remote_lab_dir }}/configs/cloud-init/meta-data
      changed_when: true

    - name: Create Ceph OSD backing disks required by topology bind mounts
      ansible.builtin.command:
        cmd: bash {{ remote_lab_dir }}/configs/ceph-disks/create-osd-disks.sh
      register: ceph_disk_create
      changed_when: "'created ' in ceph_disk_create.stdout"

    - name: Destroy existing topology if present
      ansible.builtin.command: "containerlab destroy -t {{ remote_topo_file }} --cleanup"
      failed_when: false
      changed_when: true

    - name: Remove stale containerlab state directories
      ansible.builtin.shell: "find {{ remote_lab_dir }} -maxdepth 1 -type d -name 'clab-*' -exec rm -rf {} +"
      changed_when: true

    - name: Deploy topology on R810
      ansible.builtin.command: "containerlab deploy -t {{ remote_topo_file }} --reconfigure"

    - name: Wait for SONiC management SSH from R810 side
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 600
        delay: 5
      loop: "{{ groups['sonic_switches'] | default([]) }}"
      loop_control:
        label: "{{ item }} -> {{ hostvars[item].ansible_host }}"

    - name: Wait for generic_vm Linux SSH from R810 side
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 300
        delay: 10
      loop: "{{ (groups['linux_endpoints'] | default([])) + (groups['exit_routers'] | default([])) }}"
      loop_control:
        label: "{{ item }} -> {{ hostvars[item].ansible_host }}"
