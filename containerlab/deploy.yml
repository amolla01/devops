- name: Preflight Bootstrap - Seed WSL Public Keys to SONiC Fabric
  hosts: sonic_switches
  gather_facts: no
  serial: 1  # Loops through the switches one by one safely

  # tasks:
  #   - name: Push local WSL public key string via automated non-interactive double-sshpass pipe
  #     ansible.builtin.shell: >
