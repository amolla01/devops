---
- name: Deploy containerlab topology on R810, Storage & OverlayFS Fabric Audit
  hosts: lab_servers
  become: true
  gather_facts: true
  vars:
    local_project_root: "{{ playbook_dir }}/../../"
    remote_topo_file: "{{ remote_lab_dir }}/topology.clab.yml"
    serial_console_bootstrap_enabled: true
    clab_container_name_prefix: "clab-sheba-"
    serial_console_login_user: "ubuntu"
    serial_console_login_password: "ubuntu"
    clab_vm_ssh_pubkey_path: "{{ lookup('env','HOME') }}/.ssh/id_dc_lab.pub"
    serial_key_injection_targets: >-
      {{
        (
          (groups['generic_vm_nodes'] | default([]))
          + (groups['management_nodes'] | default([]))
          + (['oob-mgmt-node'] if ('oob-mgmt-node' in hostvars) else [])
        ) | unique
      }}
  tasks:
    - name: Ensure containerlab is installed
      ansible.builtin.command: "containerlab version"
      changed_when: false

    - name: Ensure remote lab directory exists
      ansible.builtin.file:
        path: "{{ remote_lab_dir }}"
        state: directory
        mode: "0755"

    - name: Sync project tree to R810
      ansible.posix.synchronize:
        src: "{{ local_project_root }}/"
        dest: "{{ remote_lab_dir }}/"
        recursive: true
        delete: true
      become: false

    - name: Ensure ISO utilities are installed (for cloud-init seed ISO)
      ansible.builtin.apt:
        name:
          - xorriso
          - genisoimage
          - libcdio-utils
          - qemu-utils
        state: present
        update_cache: false

    - name: Generate cloud-init seed ISO for generic_vm nodes
      ansible.builtin.command:
        cmd: bash {{ remote_lab_dir }}/configs/cloud-init/build-seed-iso.sh {{ remote_lab_dir }}/configs/cloud-init
      changed_when: true

    - name: Create Ceph OSD backing disks required by topology bind mounts
      ansible.builtin.command:
        cmd: bash {{ remote_lab_dir }}/configs/ceph-disks/create-osd-disks.sh
      register: ceph_disk_create
      changed_when: "'created ' in ceph_disk_create.stdout"

    - name: Create K8/OSH VM data disks required by topology bind mounts
      ansible.builtin.command:
        cmd: bash {{ remote_lab_dir }}/configs/vmdisks/create-k8_osh-disks.sh
      register: k8_osh_disk_create
      changed_when: "'Creating fresh' in k8_osh_disk_create.stdout"


    - name: Guardrail - fail if topology still contains unsupported serial=hostdata
      ansible.builtin.shell: |
        set -e
        if grep -n 'serial=hostdata' "{{ remote_topo_file }}" >/dev/null; then
          echo "ERROR: unsupported QEMU option found in {{ remote_topo_file }}: serial=hostdata"
          echo "       remove serial=hostdata from -drive entries for generic_vm nodes"
          grep -n 'serial=hostdata' "{{ remote_topo_file }}" || true
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Destroy existing topology if present
      ansible.builtin.command: "containerlab destroy -t {{ remote_topo_file }} --cleanup"
      failed_when: false
      changed_when: true

    - name: Remove stale containerlab state directories
      ansible.builtin.shell: "find {{ remote_lab_dir }} -maxdepth 1 -type d -name 'clab-*' -exec rm -rf {} +"
      changed_when: true

    - name: Deploy topology on R810
      ansible.builtin.command: "containerlab deploy -t {{ remote_topo_file }} --reconfigure"

    - name: Probe All Datacenter SSH Ports Concurrently (Non-Blocking)
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 45
        delay: 0
      loop: "{{ groups['sonic_switches'] + groups['linux_endpoints'] + groups['exit_routers'] }}"
      loop_control:
        label: "Checking socket readiness: {{ item }} -> {{ hostvars[item].ansible_host }}"
      async: 45
      poll: 0
      register: concurrent_ssh_probes

    - name: Synchronize and Await Port Validation Results
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ concurrent_ssh_probes.results }}"
      loop_control:
        label: "Syncing status for JID: {{ item.ansible_job_id | default('SKIPPED') }}"
      register: generic_vm_ssh_wait
      until: (generic_vm_ssh_wait.finished | default(0) | int) == 1
      retries: 45
      delay: 1
      failed_when: false

    - name: Read control-node SSH public key for VM bootstrap
      ansible.builtin.set_fact:
        clab_vm_bootstrap_pubkey: "{{ lookup('file', clab_vm_ssh_pubkey_path) | trim }}"

    - name: Verify serial console login works with ubuntu credentials
      ansible.builtin.shell: |
        set -euo pipefail
        CNAME="{{ clab_container_name_prefix }}{{ item }}"
        if ! docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -qx "$CNAME"; then
          CNAME="{{ item }}"
        fi

        docker exec -i "$CNAME" python3 - <<'PY'
        import re
        import socket
        import sys
        import time

        user = "{{ serial_console_login_user }}"
        password = "{{ serial_console_login_password }}"

        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.settimeout(2)
        s.connect(("127.0.0.1", 5000))

        seen = ""
        sent_user = False
        sent_pass = False
        deadline = time.time() + 90

        while time.time() < deadline:
          try:
            chunk = s.recv(4096).decode("utf-8", errors="ignore")
          except socket.timeout:
            chunk = ""

          if chunk:
            seen += chunk

          low = seen.lower()

          if "login incorrect" in low:
            sent_user = False
            sent_pass = False
            seen = ""
            s.sendall(b"\n")
            time.sleep(0.5)
            continue

          if ("login:" in low or "ubuntu login:" in low) and not sent_user:
            s.sendall((user + "\n").encode("utf-8"))
            sent_user = True
            seen = ""
            time.sleep(0.4)
            continue

          if "password:" in low and sent_user and not sent_pass:
            s.sendall((password + "\n").encode("utf-8"))
            sent_pass = True
            seen = ""
            time.sleep(0.7)
            continue

          if sent_pass:
            s.sendall(b"id -u\n")
            time.sleep(0.7)
            try:
              probe = s.recv(4096).decode("utf-8", errors="ignore")
            except socket.timeout:
              probe = ""
            if re.search(r"(^|\D)1000(\D|$)", probe):
              s.sendall(b"exit\n")
              s.close()
              print("serial_console_login_ok")
              sys.exit(0)

          if not chunk:
            s.sendall(b"\n")
            time.sleep(0.5)

        s.close()
        print("serial_console_login_failed")
        sys.exit(1)
        PY
      loop: "{{ serial_key_injection_targets }}"
      register: serial_login_probe
      loop_control:
        label: "Serial login probe: {{ item }}"
      changed_when: false
      retries: 4
      delay: 8
      until: serial_login_probe.rc == 0

    - name: Inject SSH public key into all Linux VM nodes over serial console
      ansible.builtin.shell: |
        set -euo pipefail
        CNAME="{{ clab_container_name_prefix }}{{ item }}"
        if ! docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -qx "$CNAME"; then
          CNAME="{{ item }}"
        fi

        PAYLOAD_B64=$(cat <<'EOF' | base64 -w 0
        mkdir -p /home/ubuntu/.ssh
        cat > /home/ubuntu/.ssh/authorized_keys <<'KEYEOF'
        {{ clab_vm_bootstrap_pubkey }}
        KEYEOF
        chmod 700 /home/ubuntu/.ssh
        chmod 600 /home/ubuntu/.ssh/authorized_keys
        chown -R ubuntu:ubuntu /home/ubuntu/.ssh || chown -R 1000:1000 /home/ubuntu/.ssh
        exit
        EOF
        )

        (
          sleep 1; echo "";
          sleep 1; echo "ubuntu";
          sleep 1; echo "ubuntu";
          sleep 1; echo "echo $PAYLOAD_B64 | base64 -d >/tmp/clab-key.sh";
          sleep 1; echo "bash /tmp/clab-key.sh";
          sleep 1; echo "exit";
        ) | docker exec -i "$CNAME" python3 -c '
        import socket
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.settimeout(20)
        s.connect(("127.0.0.1", 5000))
        while True:
            try:
                line = input() + "\n"
                s.sendall(line.encode("utf-8"))
            except EOFError:
                break
        s.close()
        '
      loop: "{{ serial_key_injection_targets }}"
      register: serial_key_injection
      loop_control:
        label: "Serial key injection: {{ item }}"
      changed_when: true
      retries: 6
      delay: 5
      until: serial_key_injection.rc == 0

    - name: Verify SSH key login works for all Linux VM nodes
      ansible.builtin.shell: >-
        ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ConnectTimeout=8
        -i /home/nh1221/.ssh/id_dc_lab
        ubuntu@{{ hostvars[item]['ansible_host'] }}
        "id -u"
      register: key_login_check
      changed_when: false
      failed_when: false
      loop: "{{ serial_key_injection_targets }}"
      loop_control:
        label: "SSH key login check: {{ item }}"

    - name: Build key-login failure buckets
      ansible.builtin.set_fact:
        key_login_route_failures: >-
          {{
            key_login_check.results
            | selectattr('rc', 'ne', 0)
            | selectattr('stderr', 'defined')
            | selectattr('stderr', 'search', 'No route to host')
            | map(attribute='item')
            | list
          }}
        key_login_hard_failures: >-
          {{
            key_login_check.results
            | rejectattr('rc', 'eq', 0)
            | rejectattr('stderr', 'defined')
            | list
            +
            (
              key_login_check.results
              | selectattr('rc', 'ne', 0)
              | selectattr('stderr', 'defined')
              | rejectattr('stderr', 'search', 'No route to host')
              | list
            )
          }}

    - name: Warn when key-login checks failed due to routing
      ansible.builtin.debug:
        msg: >-
          Key-login verification skipped as non-fatal for routing failures on:
          {{ key_login_route_failures | join(', ') }}.
          Remaining plays may still fail later if mgmt reachability is not restored.
      when: key_login_route_failures | length > 0

    - name: Fail only on non-routing key-login errors
      ansible.builtin.fail:
        msg: >-
          Non-routing key-login failures detected: {{ key_login_hard_failures | map(attribute='item') | list | join(', ') }}.
          Details: {{ key_login_hard_failures | map(attribute='stderr') | list | join(' | ') }}
      when: key_login_hard_failures | length > 0

    # - name: Bootstrap QEMU Nodes over Serial Consoles (Base64 Python Injection)
    #   ansible.builtin.shell: |
    #     # 1. Store raw shell actions in a clean payload variable to bypass string interpolation failures
    #     PAYLOAD=$(cat << 'EOF'
    #     mkdir -p /home/ubuntu/.ssh
    #     echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKcdWAA5aDYPkqJwaatRVM8G720Or7I3zYZ4E+Y7BoHL nh1221@Lab-ControlNode" > /home/ubuntu/.ssh/authorized_keys
    #     chmod 700 /home/ubuntu/.ssh && chmod 600 /home/ubuntu/.ssh/authorized_keys
    #     chown -R 1000:1000 /home/ubuntu/.ssh
    #     sudo ip addr add {{ hostvars[item]["ansible_host"] }}/24 dev enp1s0 2>/dev/null || true
    #     sudo ip link set dev enp1s0 up
    #     exit
    #     EOF
    #     )
    #     B64_PAYLOAD=$(echo "$PAYLOAD" | base64 -w 0)

    #     # 2. Execute a raw binary feed into port 5000 using host python3 sockets
    #     docker exec -i {{ item }} python3 -c "
    #     import socket, time, base64
    #     s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    #     s.connect(('127.0.0.1', 5000))
        
    #     # Wake console and log in
    #     s.sendall(b'\n')
    #     time.sleep(1)
    #     s.sendall(b'ubuntu\n')
    #     time.sleep(1)
    #     s.sendall(b'ubuntu\n')
    #     time.sleep(1)
        
    #     # Pass the base64-encoded stream cleanly into the VM kernel space
    #     cmd = f'echo {B64_PAYLOAD} | base64 -d > /tmp/run.sh && sh /tmp/run.sh\n'
    #     s.sendall(cmd.encode('utf-8'))
    #     time.sleep(2)
    #     s.close()
    #     "
    #   loop: "{{ groups['generic_vm_nodes'] }}"
    #   loop_control:
    #     label: "Bootstrapping VM: {{ item }} -> {{ hostvars[item]['ansible_host'] }}"
    #   changed_when: true

    - name: Dynamically Configure Hypervisor Gateway NAT for Pass-Through Links (Once)
      ansible.builtin.shell: |
        # 1. Ask Docker for the bridge ID assigned specifically to your active containerlab network
        # Containerlab names its networks based on the lab name (sheba) or uses "sonic_oob_mgmt"
        BR_NAME=$(docker network inspect sheba -f '{{"{{"}}.Id{{"}}"}}' 2>/dev/null | cut -c1-12)
        
        # Fallback to searching the out-of-band management network if lab name varies
        if [ -z "$BR_NAME" ]; then
          BR_NAME=$(docker network inspect sonic_oob_mgmt -f '{{"{{"}}.Id{{"}}"}}' 2>/dev/null | cut -c1-12)
        fi
        
        # Ultimate fallback to find any standard active containerlab bridge hash
        if [ -z "$BR_NAME" ]; then
          BR_NAME=$(ip -o link show | grep -E "br-[0-9a-f]{12}" | awk -F': ' '{print $2}' | head -n 1)
        fi

        if [ -n "$BR_NAME" ]; then
          # Ensure we have the "br-" prefix if we grabbed a raw ID
          case "$BR_NAME" in
            br-*) TRUE_BR="$BR_NAME" ;;
            *) TRUE_BR="br-$BR_NAME" ;;
          esac

          # 2. Inject the 10.0.0.2 gateway address straight onto the discovered bridge interface
          ip addr add 10.0.0.2/24 dev "$TRUE_BR" 2>/dev/null || true
          ip link set dev "$TRUE_BR" up 2>/dev/null || true
          
          # 3. Ensure global core packet forwarding is administratively enabled
          sysctl -w net.ipv4.ip_forward=1
          
          # 4. Apply IPTables Masquerading state engines securely without duplicating rules
          iptables -t nat -C POSTROUTING -s 10.0.0.0/24 -o eno1 -j MASQUERADE 2>/dev/null || \
          iptables -t nat -A POSTROUTING -s 10.0.0.0/24 -o eno1 -j MASQUERADE
          
          iptables -C FORWARD -d 10.0.0.0/24 -j ACCEPT 2>/dev/null || \
          iptables -A FORWARD -d 10.0.0.0/24 -j ACCEPT
          
          iptables -C FORWARD -s 10.0.0.0/24 -j ACCEPT 2>/dev/null || \
          iptables -A FORWARD -s 10.0.0.0/24 -j ACCEPT
        fi
      # Runs exactly once on your physical hypervisor host
      delegate_to: poweredge_r810
      become: true
      run_once: true
      changed_when: true


    - name: Guardrail - collect first exited generic_vm name
      ansible.builtin.shell: |
        set -e
        docker ps -a --format '{{"{{"}}.Names{{"}}"}} {{"{{"}}.Status{{"}}"}}' \
          | awk '/^Host|^MonSrv/ { if ($0 ~ /^.+ Exited /) { print $1; exit 0 } }'
      args:
        executable: /bin/bash
      register: first_exited_generic_vm
      changed_when: false
      failed_when: false

    - name: Guardrail - show failure log for first exited generic_vm
      ansible.builtin.command: "docker logs --tail 120 {{ first_exited_generic_vm.stdout }}"
      register: exited_vm_log
      changed_when: false
      when: first_exited_generic_vm.stdout | length > 0

    - name: Guardrail - fail with actionable diagnostics if any generic_vm SSH is down
      ansible.builtin.assert:
        that:
          - (generic_vm_ssh_wait.results | selectattr('failed', 'defined') | selectattr('failed') | list | length) == 0
        fail_msg: >-
          One or more generic_vm nodes did not reach SSH on port 22.
          First exited container: {{ first_exited_generic_vm.stdout | default('none') }}.
          {% if exited_vm_log is defined and exited_vm_log.stdout is defined %}Docker log tail:\n{{ exited_vm_log.stdout | replace('\n', '\\n') }}{% else %}No exited generic_vm docker log captured.{% endif %}

# =============================================================================
# PLAY 2: PLATFORM STATE COMPLIANCE AUDITING
# =============================================================================
- name: Verify Persistent Dracut Storage Integrity
  hosts: generic_vm_nodes
  become: true
  gather_facts: false
  vars:
    ansible_connection: ansible.builtin.ssh
    ansible_user: ubuntu                             # ◄── Fixed: removed 'ansible_ssh_' prefix
    ansible_private_key_file: /home/nh1221/.ssh/id_dc_lab # ◄── Fixed: removed 'ansible_ssh_' prefix and enforced absolute path
    ansible_password: "{{ hostvars[inventory_hostname].ansible_password | default('ubuntu') }}"
    ansible_become_password: "{{ hostvars[inventory_hostname].ansible_become_password | default(ansible_password) }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyJump=nh1221@192.168.9.198"
  tasks:
    # - name: Wait for SSH socket layers to become active and reachable
    #   ansible.builtin.wait_for_connection:
    #     timeout: 120

    - name: Capture directory capacity statistics
      ansible.builtin.command:
        cmd: df -h /
      register: root_capacity
      changed_when: false

    - name: Enforce Control Plane System Storage Integrity
      ansible.builtin.assert:
        that:
          - "'147G' in root_capacity.stdout or '150G' in root_capacity.stdout"
        fail_msg: "[CRITICAL FAILURE] The native dracut root overlay failed to lock onto your 150GB persistent canvas disk (/dev/vda)."
        success_msg: "SUCCESS: Enterprise Native Dracut Overlay is active! Everything installed via apt, /usr, /opt, /bin, and /etc is writing securely to your 150GB disk!"