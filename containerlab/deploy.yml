    - name: Bootstrap QEMU Nodes over Serial Consoles (Base64 Payload Injection)
      ansible.builtin.shell: |
        # 1. Compress the key installation string into an airtight Base64 payload block
        B64_PAYLOAD=$(echo '
        mkdir -p /home/ubuntu/.ssh
        echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKcdWAA5aDYPkqJwaatRVM8G720Or7I3zYZ4E+Y7BoHL nh1221@Lab-ControlNode" > /home/ubuntu/.ssh/authorized_keys
        chmod 700 /home/ubuntu/.ssh && chmod 600 /home/ubuntu/.ssh/authorized_keys
        chown -R 1000:1000 /home/ubuntu/.ssh
        sudo ip addr add {{ hostvars[item]["ansible_host"] }}/24 dev enp1s0 2>/dev/null || true
        sudo ip link set dev enp1s0 up
        ' | base64 -w 0)

        # 2. Pipe the automated execution strings straight into the active QEMU console socket
        (
          sleep 1; echo "";
          sleep 1; echo "ubuntu";
          sleep 1; echo "ubuntu";
          sleep 1; echo "echo $B64_PAYLOAD | base64 -d > /tmp/init.sh";
          sleep 1; echo "sh /tmp/init.sh";
          sleep 1; echo "exit";
        ) | docker exec -i {{ item }} python3 -c '
        import socket
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.connect(("127.0.0.1", 5000))
        while True:
            try:
                line = input() + "\n"
                s.sendall(line.encode("utf-8"))
            except EOFError:
                break
        s.close()
        '
      loop: "{{ groups['generic_vm_nodes'] }}"
      loop_control:
        label: "Bootstrapping VM: {{ item }} -> {{ hostvars[item]['ansible_host'] }}"
      changed_when: true

    - name: Dynamically Configure Hypervisor Gateway NAT for Pass-Through Links (Once)
      ansible.builtin.shell: |
        # 1. Ask Docker for the bridge ID assigned specifically to your active containerlab network
        # Containerlab names its networks based on the lab name (sheba) or uses "sonic_oob_mgmt"
        BR_NAME=$(docker network inspect sheba -f '{{"{{"}}.Id{{"}}"}}' 2>/dev/null | cut -c1-12)
        
        # Fallback to searching the out-of-band management network if lab name varies
        if [ -z "$BR_NAME" ]; then
          BR_NAME=$(docker network inspect sonic_oob_mgmt -f '{{"{{"}}.Id{{"}}"}}' 2>/dev/null | cut -c1-12)
        fi
        
        # Ultimate fallback to find any standard active containerlab bridge hash
        if [ -z "$BR_NAME" ]; then
          BR_NAME=$(ip -o link show | grep -E "br-[0-9a-f]{12}" | awk -F': ' '{print $2}' | head -n 1)
        fi

        if [ -n "$BR_NAME" ]; then
          # Ensure we have the "br-" prefix if we grabbed a raw ID
          case "$BR_NAME" in
            br-*) TRUE_BR="$BR_NAME" ;;
            *) TRUE_BR="br-$BR_NAME" ;;
          esac

          # 2. Inject the 10.0.0.2 gateway address straight onto the discovered bridge interface
          ip addr add 10.0.0.2/24 dev "$TRUE_BR" 2>/dev/null || true
          ip link set dev "$TRUE_BR" up 2>/dev/null || true
          
          # 3. Ensure global core packet forwarding is administratively enabled
          sysctl -w net.ipv4.ip_forward=1
          
          # 4. Apply IPTables Masquerading state engines securely without duplicating rules
          iptables -t nat -C POSTROUTING -s 10.0.0.0/24 -o eno1 -j MASQUERADE 2>/dev/null || \
          iptables -t nat -A POSTROUTING -s 10.0.0.0/24 -o eno1 -j MASQUERADE
          
          iptables -C FORWARD -d 10.0.0.0/24 -j ACCEPT 2>/dev/null || \
          iptables -A FORWARD -d 10.0.0.0/24 -j ACCEPT
          
          iptables -C FORWARD -s 10.0.0.0/24 -j ACCEPT 2>/dev/null || \
          iptables -A FORWARD -s 10.0.0.0/24 -j ACCEPT
        fi
      # Runs exactly once on your physical hypervisor host
      delegate_to: poweredge_r810
      become: true
      run_once: true
      changed_when: true

