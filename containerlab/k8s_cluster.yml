---
# Kubernetes version and cluster configuration

k8s_cni: calico
k8s_pod_cidr: "10.233.64.0/18"
k8s_service_cidr: "10.233.0.0/18"
k8s_dns_domain: "cluster.local"
k8s_container_runtime: containerd
container_manager: containerd      # <--- Add this exact variable line here
etcd_deployment_type: host         # <--- Add this line to explicitly declare host-based etcd topologies

kubespray_repo: "https://github.com/kubernetes-sigs/kubespray.git"   # also in all.yml for localhost scope
kubespray_version: "v2.31.0"
# kubespray_dest and kubespray_inventory_dir live in group_vars/all.yml
# so the 'hosts: localhost' inventory-generation play can resolve them.

# SSH settings for inter-node Kubespray connectivity
k8s_ssh_user: "ubuntu"

# ── Calico CNI — "none" backend: no BIRD, no encapsulation ───────────────────
# With calico_network_backend: none, calico-node does not start BIRD and creates
# no overlay (no VXLAN, no IP-IP). FRR owns port 179 exclusively.
# Pod CIDRs are announced natively into the SONiC fabric by FRR via a
# `network {{ k8s_pod_block_cidr }}` statement (pre-assigned /26 per node in
# host_vars). No encapsulation headers, full-MTU pod traffic, simple tcpdump.
calico_network_backend: "none"          # BIRD never starts; no overlay tunnel
calico_ipip_mode: "Never"              # explicitly disable IP-IP (belt + braces)
calico_vxlan_mode: "Never"             # explicitly disable VXLAN (belt + braces)
calico_pool_blocksize: 26              # /26 per node = 64 pod IPs; pre-assign in host_vars
calico_pool_name: "default-ipv4-ippool"
calico_felix_logseverityscreen: "Warning"
# ─── OFFLINE CALICO CONTAINER REGISTRY MATCHING ──────────────────────────────
# Force Kubespray to use your exact pre-cached air-gapped network images

calico_cni_version: "v3.29.2"
calico_node_version: "v3.29.2"
calico_policy_version: "v3.29.2"
calico_typha_version: "v3.29.2"
calico_node_extra_envs:
  IP_AUTODETECTION_METHOD: "interface=ens2"   # Calico IPAM binds to fabric NIC, not enp1s0

# ── MetalLB BGP — local FRR peering model ────────────────────────────────────
# MetalLB native speaker (frr_enabled: false) peers with the HOST FRR on
# 127.0.0.1:179 using ASN metallb_asn (64512). FRR accepts this session under a
# dedicated neighbor and re-advertises the /32 VIP routes to the Leaf switches.
# This design keeps FRR as the sole BGP control plane on every node:
#   MetalLB → FRR(localhost) → eBGP unnumbered → Leaf → Spine → fabric
metallb_frr_enabled: false              # use native Go BGP, NOT the embedded FRR sidecar
metallb_speaker_peer_address: "127.0.0.1"
metallb_speaker_peer_asn: "{{ metallb_asn }}"   # 64512 — MetalLB's own ASN
metallb_frr_local_asn: 64513           # FRR "router bgp" ASN that accepts MetalLB session
# NOTE: metallb_lb_pool and metallb_mgmt_pool are in group_vars/all.yml

# ── kube-proxy replacement (strict ARP for MetalLB L2 mode) ──────────────────
kube_proxy_strict_arp: true
kube_proxy_mode: "ipvs"

# ── Kubespray add-ons ──────────────────────────────────────────────────────────
helm_enabled: true

# Kubernetes Dashboard (web UI) — exposed via MetalLB mgmt-pool
dashboard_enabled: true

# Metrics Server (kubectl top, HPA) — kubelet-insecure-tls needed for self-signed certs
metrics_server_enabled: true
metrics_server_args:
  - "--kubelet-insecure-tls"
  - "--kubelet-preferred-address-types=InternalIP"

# ingress-nginx (internet-facing ingress controller) — exposed via MetalLB bgp-pool
ingress_nginx_enabled: true
ingress_nginx_host_network: false
ingress_nginx_class: nginx

# cert-manager (TLS certificate automation via Let's Encrypt or self-signed)
cert_manager_enabled: true
cert_manager_namespace: cert-manager

# node-local DNS cache (reduces CoreDNS load; transparent to applications)
enable_nodelocaldns: true
nodelocaldns_ip: "169.254.25.10"

# Local path provisioner disabled — Rook-Ceph provides all StorageClasses
local_volume_provisioner_enabled: false

# ── Multus meta-CNI ─────────────────────────────────────────────────────────
# Multus delegates the default pod network to Calico (the primary CNI) and
# allows secondary NICs via NetworkAttachmentDefinition CRs. Needed for:
#   - OVN/Neutron pods attaching directly to the fabric data-plane interface
#   - Ceph OSD pods binding to the vrf-storage VLAN-100 subinterface
#   - SR-IOV or other future accelerated networking attachments
kube_network_plugin_multus: true
multus_version: "4.1.0"

# ── Data-dir placement ───────────────────────────────────────────────────────
# Each Host VM has a 40 GB virtio data disk mounted at /opt by cloud-init
# (serial=hostdata → /dev/disk/by-id/virtio-hostdata → ext4 LABEL=hostdata).
# Redirect every large K8s data store there so the root disk never fills.
# containerd images alone run 15–20 GB; kubelet + etcd add several GB more.
containerd_storage_dir: "/opt/containerd"
kubelet_data_dir: "/opt/kubelet"
etcd_data_dir: "/opt/etcd"

# ── containerd snapshotter ───────────────────────────────────────────────────
# The Host VM root (and /opt) is a dracut LiveOS overlay (LiveOS_rootfs on / type
# overlay, backed by /dev/vda at /run/overlayfs-backing). containerd's default
# overlayfs snapshotter cannot stack an overlay mount on top of an overlay
# filesystem — the kernel rejects it with `invalid argument`, so every Pod
# sandbox fails to start (CreatePodSandboxError) and kubeadm init hangs waiting
# for the control plane. The native snapshotter uses plain bind/copy layers and
# works on any filesystem, at the cost of no layer dedup. Required for this
# overlay-root image; harmless on a normal ext4 root.
containerd_snapshotter: "native"


# ─── CORE KUBERNETES COMPONENT DEFINITIONS ──────────────────────────────────
# Pin tracking versions precisely to your synchronized air-gapped asset cache
k8s_version: "1.35.4"
calico_version: "3.29.2"
coredns_version: "1.12.0"
# kubeadm for k8s 1.35.x rejects external etcd < 3.5.24-0 at preflight.
etcd_version: "3.5.24"

# ─── OFFLINE PIPELINE PROVISIONING TRACKS ───────────────────────────────────
# Exact binary release tracks cached inside your non-volatile storage pool
# containerd_version: "2.3.0"
# nerdctl_version: "2.3.5"
# crictl_version: "1.36.0"
# runc_version: "1.5.1"
# The exact hardcoded companion versions that Kubespray maps to Kubernetes 1.35.4 are:
# Explicitly pin system component versions for v1.35.4
# kube_version: v1.35.4
# runc_version: "1.4.2"
# crictl_version: "v1.35.0"
# nerdctl_version: "2.2.2"
# calico_ctl_version: "v3.31.5"
# Explicitly matching the exact binaries cached inside /opt/fabric-cache
kube_version: "1.35.4"
# containerd_version: "2.3.0"
# nerdctl_version: "2.3.5"
# crictl_version: "v1.36.0"   # Force this so Kubespray matches your cached file
# runc_version: "1.5.1"

# Absolute persistent path coupling
fabric_cache_release_dir: "/opt/fabric-cache"
