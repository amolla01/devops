---
- name: Deploy Kubernetes cluster via Kubespray
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Clone Kubespray repository
      ansible.builtin.git:
        repo: "{{ ((kubespray_repo_mirror | default('') | trim | length) > 0) | ternary(kubespray_repo_mirror, kubespray_repo) }}"
        dest: "{{ kubespray_dest }}"
        version: "{{ kubespray_version }}"
        force: true

    - name: Install Kubespray Python requirements
      ansible.builtin.pip:
        name:
          - "ansible-core>=2.18.0,<2.19.0"  # <--- Change this line to pin the safe version
          - "cryptography>=46.0.0"
          - "jmespath"
          - "netaddr"
        state: present
      environment:
        PIP_CACHE_DIR: "{{ local_fabric_cache_root }}/pip"

    # containerd 2.x delegates CRI pulls to the transfer service, which has no
    # unpack platform under our native snapshotter -> "no unpack platforms defined".
    # Force CRI to use its own local unpacker (also makes it honor the airgap mirror).
    - name: Patch Kubespray containerd template for local image pull
      ansible.builtin.lineinfile:
        path: "{{ kubespray_dest }}/roles/container-engine/containerd/templates/config.toml.j2"
        insertafter: '^\s*\[plugins\."io\.containerd\.cri\.v1\.images"\]\s*$'
        regexp: '^\s*use_local_image_pull\s*='
        line: '    use_local_image_pull = true'
        state: present

