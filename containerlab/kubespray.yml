    - name: Run Kubespray cluster.yml (Fixed Multi-Layer Isolation)
      ansible.builtin.shell: |
        # Explicitly clear out any inherited environment clutter before running
        set -euo pipefail
        unset ANSIBLE_CONFIG
        unset download_container
        unset download_container_engine

        mkdir -p {{ local_fabric_cache_root }}/logs
        mkdir -p {{ local_fabric_cache_root }}/ansible/kubespray-factcache

        # Fire the execution pass using only clean explicit target parameters
        cmd=(
          ansible-playbook
          -i inventory/sheba-cluster/hosts.yaml
          playbooks/cluster.yml
          -b
          -f {{ kubespray_forks | default(2) }}
          -e ansible_user=ubuntu
          -e ansible_password=ubuntu
          -e ansible_sudo_pass=ubuntu
          -e ansible_ssh_private_key_file=/home/nh1221/.ssh/id_dc_lab
          --extra-vars @inventory/sheba-cluster/group_vars/k8s_cluster/overrides.yaml
        )

        if [ -n "{{ kubespray_limit | default('') | trim }}" ]; then
          limit_value="{{ kubespray_limit | default('') | trim }}"
          if [ "$limit_value" = "kube_node" ]; then
            limit_value="kube_node:{{ groups['kube_control_plane'][0] }}"
          fi
          cmd+=(--limit "$limit_value")
        fi

        if [ -n "{{ kubespray_start_at_task | default('') | trim }}" ]; then
          cmd+=(--start-at-task "{{ kubespray_start_at_task | default('') | trim }}")
        fi

        "${cmd[@]}" > {{ local_fabric_cache_root }}/logs/kubespray-inner.log 2>&1
      args:
        chdir: /opt/kubespray
        executable: /bin/bash
      delegate_to: localhost
      become: false
      environment:
        ANSIBLE_CONFIG: "{{ kubespray_dest }}/ansible.cfg"
        ANSIBLE_HOST_KEY_CHECKING: "False"
        ANSIBLE_PIPELINING: "True"
        ANSIBLE_SSH_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=no -o ControlPersist=0"
        # Cache gathered facts so a rerun after a failure skips re-gathering on
        # every node (facts are the same within the timeout window).
        ANSIBLE_GATHERING: "smart"
        ANSIBLE_CACHE_PLUGIN: "jsonfile"
        ANSIBLE_CACHE_PLUGIN_CONNECTION: "{{ local_fabric_cache_root }}/ansible/kubespray-factcache"
        ANSIBLE_CACHE_PLUGIN_TIMEOUT: "7200"
      async: 14400  # Expand window threshold to 4 hours for full air-gapped node provisions
      poll: 15       # Poll every 15 seconds to minimize background context CPU locks
      register: kubespray_result



    - name: Fetch kubeconfig from primary master
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "~/.kube/sheba-config"
        flat: true
      delegate_to: "{{ groups['kube_control_plane'][0] }}"
      vars:
        ansible_ssh_private_key_file: "{{ hostvars['localhost'].ansible_ssh_private_key_file | default(ansible_ssh_private_key_file | default('~/.ssh/id_dc_lab')) }}"
        ansible_ssh_common_args: "{{ hostvars[groups['kube_control_plane'][0]].ansible_ssh_common_args | default(ansible_ssh_common_args | default('')) }}"
      become: true

    - name: Confirm cluster is reachable
      ansible.builtin.command: kubectl --kubeconfig ~/.kube/sheba-config get nodes
      changed_when: false
      register: nodes_out

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ nodes_out.stdout_lines }}"
