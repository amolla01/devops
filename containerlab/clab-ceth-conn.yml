nh1221@PowerEdge-R810:~$ #!/bin/bash

# Create an associative array of all container interface links
declare -A interface_map

# Gather data from all running containers
for c_id in $(sudo docker ps -q); do
    c_name=$(sudo docker inspect --format '{{.Name}}' $c_id | sed 's/^\///')

    # Get all interfaces, their indexes, and their target peer link indexes
    while read -r line; do
        if [ ! -z "$line" ]; then
            ifindex=$(echo "$line" | awk '{print $1}')
            ifname=$(echo "$line" | awk '{print $2}' | cut -d'@' -f1)
            iflink=$(echo "$line" | awk '{print $3}')

            # Map this unique global index back to this container/interface combo
            interface_map["$c_name-$ifindex"]="$ifname"
            interface_map["idx-$c_name-$ifname"]="$iflink"
        fi
    done < <(sudo docker exec $c_id bash -c "
        for idx in \$(ls /sys/class/net/); do
            echo \"\$(cat /sys/class/net/\$idx/ifindex) \$idx \$(cat /sys/class/net/\$idx/iflink)\";
        done 2>/dev/null"
    )
done

# Focus specifically on tracing Leaf-L1
echo "=========================================================================="
echo "                   Leaf-L1 VIRTUAL WIRE TOPOLOGY MAP                      "
echo "=========================================================================="

for port in $(sudo docker exec Leaf-L1 ls /sys/class/net/ | grep -E 'eth|Ethernet'); do
    # Get the global target link index from Leaf-L1's perspective
    peer_link_idx=${interface_map["idx-Leaf-L1-$port"]}

    # Skip if it links back to itself or is empty
    if [ -z "$peer_link_idx" ]; then continue; fi

    match_found=false

    # Scan other containers to see who owns that target link index
    for c_id in $(sudo docker ps -q); do
        c_name=$(sudo docker inspect --format '{{.Name}}' $c_id | sed 's/^\///')
        if [ "$c_name" == "Leaf-L1" ]; then continue; fi # Skip self

        peer_port=${interface_map["$c_name-$peer_link_idx"]}
        if [ ! -z "$peer_port" ]; then
            printf "Leaf-L1 Interface: %-7s ===> Connected to Container: %-12s Interface: %s\n" "$port" "$c_name" "$peer_port"
            match_found=true
            break
        fi
    done

    # If no other container claimed it, it's tied directly to the host machine
    if [ "$match_found" = false ]; then
        host_veth=$(ip -o link show | awk -F': ' -v idx="^$peer_link_idx" '$1 ~ idx {print $2}' | cut -d'@' -f1)
        if [ ! -z "$host_veth" ]; then
            printf "Leaf-L1 Interface: %-7s ===> Connected to Host Veth:    %s\n" "$port" "$host_veth"
        else
            printf "Leaf-L1 Interface: %-7s ===> Connected to Host/Bridge (Index: %s)\n" "$port" "$peer_link_idx"
        fi
    fi
done
