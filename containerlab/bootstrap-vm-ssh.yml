---
- name: Bootstrap SSH and guest access for vrnetlab nodes
  hosts: all
  gather_facts: false
  become: true
  serial: 1
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_dc_lab
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ServerAliveInterval=30
      -o ServerAliveCountMax=3

  tasks:
    - name: Wait for guest SSH to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 180
        sleep: 5

    - name: Ensure sshd is installed and running
      ansible.builtin.package:
        name: openssh-server
        state: present
      when: ansible_os_family == 'Debian'

    - name: Ensure sshd is enabled and running
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

    - name: Ensure ubuntu user has the lab key
      ansible.posix.authorized_key:
        user: ubuntu
        state: present
        key: "{{ lookup('file', '~/.ssh/id_dc_lab.pub') }}"
        exclusive: false

    - name: Ensure sudoers allows passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/ubuntu-nopasswd
        line: "ubuntu ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"
