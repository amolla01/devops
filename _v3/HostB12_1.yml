---
# =============================================================================
# HostB12_1 - Ubuntu Bare-Metal Server (Border Leaf Pair BL1/BL2)
# =============================================================================
# Role: K8s Controller (initial) + MaaS Region+Rack Controller + PostgreSQL
# KVM Mgmt: 172.16.2.45 (libvirt dc-mgmt network — used for SSH in KVM lab)
# MaaS PXE: 192.168.255.46 (Management Switch port16)
# iDRAC:    192.168.255.31 (Management Switch port6 — real hardware only)
# Bond IP:  10.10.100.1/24 (active-backup across Border_Leaf1 + Border_Leaf2)
#
# This is the FIRST server commissioned. KubeSpray deploys K8s here first,
# then MaaS + PostgreSQL run here to PXE-boot all other hosts.
#
# Physical Wiring:
#   eth1 ↔ Border_Leaf1 Ethernet20 (QSFP+6 breakout sub0, 10G)
#   eth2 ↔ Border_Leaf2 Ethernet20 (QSFP+6 breakout sub0, 10G)
#   eth0 ↔ Management Switch port16 (PXE/MaaS)
#   iDRAC ↔ Management Switch port6
# =============================================================================

hostname: "HostB12_1"
mgmt_ip: "172.16.2.45"
idrac_ip: "192.168.255.31"
pxe_ip: "192.168.255.46"
bond_ip: "10.10.100.1/24"
loopback_ip: "10.10.255.100/32"

fabric_interfaces:
  - name: "eth1"
    speed: "10000"
    neighbor: "Border_Leaf1"
    neighbor_port: "Ethernet0"
    description: "HostB12_1 → Border_Leaf1 (10G QSFP+6 breakout sub0)"
  - name: "eth2"
    speed: "10000"
    neighbor: "Border_Leaf2"
    neighbor_port: "Ethernet0"
    description: "HostB12_1 → Border_Leaf2 (10G QSFP+6 breakout sub0)"

pxe_interface:
  name: "eth0"
  neighbor: "Management_Switch"
  neighbor_port: "port16"

netplan:
  network:
    version: 2
    renderer: networkd
    ethernets:
      eth0:
        dhcp4: true
        dhcp4-overrides:
          use-dns: false
          use-routes: false
      eth1:
        dhcp4: false
        mtu: 9000
      eth2:
        dhcp4: false
        mtu: 9000
    bonds:
      bond0:
        interfaces: [eth1, eth2]
        addresses: ["10.10.100.1/24"]
        mtu: 9000
        parameters:
          mode: active-backup
          mii-monitor-interval: 100
          primary: eth1
    vlans: {}

frr_bgp:
  local_asn: 65106                  # UNIQUE per server (was 65200 — broken)
  router_id: "10.10.255.100"
  neighbors:
    - interface: "eth1"
      remote_asn: 65021
      description: "Border_Leaf1"
    - interface: "eth2"
      remote_asn: 65022
      description: "Border_Leaf2"
  networks:
    - "10.10.100.0/24"
    - "10.10.255.100/32"
  evpn:
    enabled: true
    advertise_all_vni: true
    advertise_ipv4_unicast: true
    advertise_ipv6_unicast: true

# ---- Special roles: MaaS + initial K8s ----
kube_role: controller
is_maas_controller: true
is_initial_kubespray_target: true

kubespray_node_labels:
  - "node-role.kubernetes.io/control-plane="
  - "maas-controller=enabled"

# ---- MaaS services ----
maas_roles:
  - region_controller
  - rack_controller

# ---- Ceph ----
ceph_roles: [osd]

# ---- KVM Lab Interface Mapping ----
# In KVM lab (automation_profile: win11_kvm), Ubuntu Noble uses predictable names:
#   eth0/enp1s0 → mgmt NIC (172.16.2.45 via DHCP)
#   eth1/enp2s0 → fabric NIC1 (br-HB-BL1 → Border_Leaf1 Ethernet20)
#   eth2/enp3s0 → fabric NIC2 (br-HB-BL2 → Border_Leaf2 Ethernet20)
# The deploy_lab_v13.sh Phase 5.5 and deploy_server_networking.yml playbook
# auto-detect the actual interface names at runtime.
# MAC addresses (generated by gen_mac): mgmt=52:54:00:9b:ad:64, fab0=52:54:00:f9:61:95, fab1=52:54:00:8e:e9:0a
kvm_lab:
  mgmt_mac: "52:54:00:9b:ad:64"
  fab0_mac: "52:54:00:f9:61:95"
  fab1_mac: "52:54:00:8e:e9:0a"
  mgmt_ip: "172.16.2.45"

# ---- sonic_server_net role variables ----
server_asn: "{{ server_asn_map[inventory_hostname] }}"
server_router_id: "{{ loopback_ip.split('/')[0] }}"
server_loopback_ip: "{{ loopback_ip }}"
server_interfaces_kvm:
  - name: "eth1"
    peer_asn: "{{ border_leaf_asn_map['Border_Leaf1'] }}"
    neighbor: "Border_Leaf1"
  - name: "eth2"
    peer_asn: "{{ border_leaf_asn_map['Border_Leaf2'] }}"
    neighbor: "Border_Leaf2"
