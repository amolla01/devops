---
# mikrotik_base/tasks/day1_bgp.yml
# Day-1 BGP configuration for MikroTik CHR exit routers.
# Configures eBGP peering with border leaves.
# Uses ansible_connection=local with direct SSH exec commands.

# ---------------------------------------------------------------------------
# Resolve fabric_interfaces from profile-conditional variants
# Uses the same pattern as sonic_server_net (kvm vs real_hardware).
# ---------------------------------------------------------------------------
- name: "day1 | Resolve fabric interfaces (profile-conditional)"
  ansible.builtin.set_fact:
    fabric_interfaces: "{{ fabric_interfaces_real if (automation_profile | default('') == 'real_hardware' and fabric_interfaces_real is defined) else fabric_interfaces_kvm }}"
  when: fabric_interfaces is not defined and (fabric_interfaces_kvm is defined or fabric_interfaces_real is defined)
  tags: [deploy, day1, interfaces, bgp]

- name: "day1 | Probe running ethernet interfaces on KVM CHR"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/interface ethernet print where running=yes' \
      | grep -oE 'ether[0-9]+' \
      | awk '!seen[$0]++'
  register: _running_ethernet
  changed_when: false
  failed_when: false
  when:
    - automation_profile | default('') != 'real_hardware'
    - fabric_interfaces | default([]) | length == 1
  tags: [deploy, day1, interfaces, bgp]

- name: "day1 | Parse running data interfaces on KVM CHR"
  ansible.builtin.set_fact:
    _running_data_ports: >-
      {{
        (_running_ethernet.stdout_lines | default([]))
        | reject('equalto', 'ether1')
        | unique
        | list
      }}
  when:
    - automation_profile | default('') != 'real_hardware'
    - fabric_interfaces | default([]) | length == 1
  tags: [deploy, day1, interfaces, bgp]

- name: "day1 | Rebind KVM fabric interface to the live RouterOS port"
  ansible.builtin.set_fact:
    fabric_interfaces:
      - "{{ fabric_interfaces[0] | combine({'port': _running_data_ports[0]}) }}"
  when:
    - automation_profile | default('') != 'real_hardware'
    - fabric_interfaces | default([]) | length == 1
    - _running_data_ports | default([]) | length == 1
    - fabric_interfaces[0].port != _running_data_ports[0]
  tags: [deploy, day1, interfaces, bgp]

- name: "day1 | Fail when the KVM fabric interface is ambiguous"
  ansible.builtin.fail:
    msg: >-
      Unable to resolve the live fabric interface on {{ inventory_hostname }}.
      Inventory expects {{ fabric_interfaces[0].port }}, but running RouterOS data ports are
      {{ _running_data_ports | default([]) | join(', ') if (_running_data_ports | default([]) | length) > 0 else 'none' }}.
      Fix the CHR NIC ordering or inventory before re-running day1.
  when:
    - automation_profile | default('') != 'real_hardware'
    - fabric_interfaces | default([]) | length == 1
    - fabric_interfaces[0].port not in (_running_data_ports | default([]))
    - (_running_data_ports | default([]) | length) != 1
  tags: [deploy, day1, interfaces, bgp]

- name: "day1 | Report resolved KVM fabric interface"
  ansible.builtin.debug:
    msg: >-
      Using {{ fabric_interfaces[0].port }} as the live fabric interface on {{ inventory_hostname }}.
      Running RouterOS data ports: {{ _running_data_ports | default([]) | join(', ') if (_running_data_ports | default([]) | length) > 0 else 'none' }}
  when:
    - automation_profile | default('') != 'real_hardware'
    - fabric_interfaces | default([]) | length == 1
  tags: [deploy, day1, interfaces, bgp]

- name: "day1 | Configure fabric-facing interface speed"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/interface ethernet set {{ item.port }} speed={{ item.speed }}Mbps'
  loop: "{{ fabric_interfaces }}"
  loop_control:
    label: "{{ item.port }} ({{ item.description }})"
  changed_when: true
  failed_when: false
  when:
    - automation_profile | default('') == 'real_hardware'
    - item.speed is defined
  tags: [deploy, day1, interfaces]

- name: "day1 | Remove existing IP on fabric interface (idempotent re-run)"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/ip address remove [find interface={{ item.port }}]'
  loop: "{{ fabric_interfaces | selectattr('local_ip', 'defined') | list }}"
  loop_control:
    label: "{{ item.port }}"
  changed_when: true
  failed_when: false
  when: fabric_interfaces | selectattr('local_ip', 'defined') | list | length > 0
  tags: [deploy, day1, interfaces]

- name: "day1 | Add IP address to fabric interface"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/ip address add address={{ item.local_ip }} interface={{ item.port }}'
  loop: "{{ fabric_interfaces | selectattr('local_ip', 'defined') | list }}"
  loop_control:
    label: "{{ item.port }}"
  register: _ip_add_result
  changed_when: _ip_add_result.rc == 0
  failed_when: _ip_add_result.rc != 0
  when: fabric_interfaces | selectattr('local_ip', 'defined') | list | length > 0
  tags: [deploy, day1, interfaces]

- name: "day1 | Verify IP is present on fabric interface"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/ip address print where interface={{ item.port }}'
  loop: "{{ fabric_interfaces | selectattr('local_ip', 'defined') | list }}"
  loop_control:
    label: "{{ item.port }}"
  register: _ip_verify
  changed_when: false
  failed_when: item.local_ip.split('/')[0] not in (_ip_verify.stdout | default(''))
  when: fabric_interfaces | selectattr('local_ip', 'defined') | list | length > 0
  tags: [deploy, day1, interfaces]

- name: "day1 | Remove stale BGP firewall accept rules (idempotent re-run)"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/ip firewall filter remove [find where comment~"accept-bgp"]'
  changed_when: true
  failed_when: false
  tags: [deploy, day1, bgp]

- name: "day1 | Ensure default RouterOS BGP template matches inventory"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp template set default as={{ bgp_local_asn }} router-id={{ router_id }} routing-table=main hold-time=3m keepalive-time=1m address-families=ip'
  register: _bgp_template_result
  changed_when: _bgp_template_result.rc == 0
  failed_when: _bgp_template_result.rc != 0
  tags: [deploy, day1, bgp]

- name: "day1 | Ensure default RouterOS routing-id matches inventory"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '{ :if ([:len [/routing id find where name="default"]] > 0) do={ /routing id set [find where name="default"] id={{ router_id }} } else={ /routing id add name=default id={{ router_id }} } }'
  register: _routing_id_result
  changed_when: _routing_id_result.rc == 0
  failed_when: _routing_id_result.rc != 0
  tags: [deploy, day1, bgp]

- name: "day1 | Remove stale RouterOS fabric BGP templates"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp template remove [find where name="fabric"]'
  changed_when: true
  failed_when: false
  tags: [deploy, day1, bgp]

- name: "day1 | Create RouterOS fabric BGP template with inventory router-id"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp template add name=fabric routing-table=main router-id={{ router_id }} as={{ bgp_local_asn }} hold-time=3m keepalive-time=1m address-families=ip'
  register: _fabric_template_result
  changed_when: _fabric_template_result.rc == 0
  failed_when: _fabric_template_result.rc != 0
  tags: [deploy, day1, bgp]

- name: "day1 | Probe legacy RouterOS BGP instance support"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp instance print'
  register: _bgp_instance_probe
  changed_when: false
  failed_when: false
  tags: [deploy, day1, bgp]

- name: "day1 | Ensure legacy RouterOS BGP instance matches inventory"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '{ :if ([:len [/routing bgp instance find where name="main"]] > 0) do={ /routing bgp instance set [find where name="main"] as={{ bgp_local_asn }} router-id={{ router_id }} } else={ /routing bgp instance add name=main as={{ bgp_local_asn }} router-id={{ router_id }} } }'
  register: _bgp_instance_result
  changed_when: _bgp_instance_result.rc == 0
  failed_when: _bgp_instance_result.rc != 0
  when: _bgp_instance_probe.rc == 0
  tags: [deploy, day1, bgp]

- name: "day1 | Add firewall rule to accept BGP (TCP/179) from fabric peer"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '{ :local anchor ""; :foreach i in=[/ip firewall filter find where comment~"drop-all-else" and chain=input] do={ :if ([:len $anchor] = 0) do={ :set anchor $i } }; :if ([:len $anchor] > 0) do={ /ip firewall filter add chain=input action=accept protocol=tcp src-address={{ item.neighbor_ip }}/32 dst-port=179 comment=accept-bgp-{{ item.neighbor }} place-before=$anchor; } else={ /ip firewall filter add chain=input action=accept protocol=tcp src-address={{ item.neighbor_ip }}/32 dst-port=179 comment=accept-bgp-{{ item.neighbor }}; } }'
  loop: "{{ fabric_interfaces | selectattr('neighbor_ip', 'defined') | list }}"
  loop_control:
    label: "BGP accept ← {{ item.neighbor }} ({{ item.neighbor_ip }})"
  register: _bgp_firewall_add_result
  changed_when: _bgp_firewall_add_result.rc == 0
  failed_when: _bgp_firewall_add_result.rc != 0
  when: fabric_interfaces | selectattr('neighbor_ip', 'defined') | list | length > 0
  tags: [deploy, day1, bgp]

- name: "day1 | Remove existing BGP connections (idempotent re-run)"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp connection remove [find]'
  changed_when: true
  failed_when: false
  tags: [deploy, day1, bgp]

- name: "day1 | Configure BGP connection to neighbor"
  ansible.builtin.shell: |
    {% if (_bgp_instance_probe.rc | default(1)) == 0 %}
    {{ mikrotik_ssh_cmd }} '/routing bgp connection add name=to_{{ item.neighbor }} remote.address={{ item.neighbor_ip }} remote.as={{ item.neighbor_asn }} instance=main local.role=ebgp disabled=no connect=yes listen=no'
    {% else %}
    {{ mikrotik_ssh_cmd }} '/routing bgp connection add name=to_{{ item.neighbor }} remote.address={{ item.neighbor_ip }} remote.as={{ item.neighbor_asn }} template=default local.role=ebgp disabled=no connect=yes listen=no'
    {% endif %}
  loop: "{{ fabric_interfaces | selectattr('neighbor_ip', 'defined') | list }}"
  loop_control:
    label: "BGP → {{ item.neighbor }} (AS{{ item.neighbor_asn }})"
  register: _bgp_connection_add_result
  changed_when: _bgp_connection_add_result.rc == 0
  failed_when: _bgp_connection_add_result.rc != 0
  when: fabric_interfaces | selectattr('neighbor_ip', 'defined') | list | length > 0
  tags: [deploy, day1, bgp]

- name: "day1 | Verify BGP connections"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp connection print'
  register: _bgp_connections
  changed_when: false
  failed_when: false
  tags: [day1, verify]

- name: "day1 | Gather BGP connection count"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp connection print count-only'
  register: _bgp_connection_count
  changed_when: false
  failed_when: false
  tags: [deploy, day1, bgp, verify]

- name: "day1 | Parse BGP connection count"
  ansible.builtin.set_fact:
    _bgp_connection_count_value: >-
      {{ (_bgp_connection_count.stdout | default('0') | trim | int) }}
  tags: [deploy, day1, bgp, verify]

- name: "day1 | Gather immediate BGP session state after deploy"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp session print detail'
  register: _bgp_sessions_deploy
  changed_when: false
  failed_when: false
  tags: [deploy, day1, bgp]

- name: "day1 | Gather immediate BGP session count after deploy"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp session print count-only'
  register: _bgp_session_count_deploy
  changed_when: false
  failed_when: false
  tags: [deploy, day1, bgp]

- name: "day1 | Parse immediate BGP session count after deploy"
  ansible.builtin.set_fact:
    _bgp_session_count_value_deploy: >-
      {{ (_bgp_session_count_deploy.stdout | default('0') | trim | int) }}
  tags: [deploy, day1, bgp]

- name: "day1 | Parse concrete BGP session rows after deploy"
  ansible.builtin.set_fact:
    _bgp_session_rows_deploy: >-
      {{
        (_bgp_sessions_deploy.stdout_lines | default([]))
        | reject('match', '^Flags:')
        | reject('match', '^\\s*$')
        | list
      }}
  tags: [deploy, day1, bgp]

- name: "day1 | Warn when BGP connection exists but no live RouterOS session formed"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing id print detail; /routing bgp template print detail; /routing bgp connection print detail; /log print where topics~"route|routing|bgp"'
  register: _bgp_no_session_diag
  changed_when: false
  failed_when: false
  when:
    - (_bgp_connection_count_value | default(0) | int) > 0
    - (_bgp_session_count_value_deploy | default(0) | int) == 0
  tags: [deploy, day1, bgp]

- name: "day1 | Report RouterOS BGP diagnostics when no live session formed"
  ansible.builtin.debug:
    msg: |
      {{ inventory_hostname }} has a configured RouterOS BGP connection but no concrete
      /routing bgp session rows.

      RouterOS reported {{ _bgp_connection_count_value | default(0) | int }} configured BGP connections
      via /routing bgp connection print count-only.

      RouterOS reported {{ _bgp_session_count_value_deploy | default(0) | int }} live BGP sessions
      via /routing bgp session print count-only.

      RouterOS diagnostic snapshot:
      {{ _bgp_no_session_diag.stdout | default('(no diagnostic output)') }}
  when:
    - (_bgp_connection_count_value | default(0) | int) > 0
    - (_bgp_session_count_value_deploy | default(0) | int) == 0
  tags: [deploy, day1, bgp]

- name: "day1 | Fail deploy when RouterOS BGP connection exists but no live session formed"
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} still has no concrete /routing bgp session rows after deploy.
      The BGP connection object exists, but RouterOS did not instantiate a live session.
      See the preceding diagnostic snapshot for routing-id, template, connection, and log state.
  when:
    - (_bgp_connection_count_value | default(0) | int) > 0
    - (_bgp_session_count_value_deploy | default(0) | int) == 0
  tags: [deploy, day1, bgp]

# ──────────────────────────────────────────────────────────────────────────────
# Enhanced Verification: BGP Neighbors, Routes, and LLDP
# ──────────────────────────────────────────────────────────────────────────────

- name: "day1 | Gather BGP peer/session state"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp session print detail'
  register: _bgp_sessions
  changed_when: false
  failed_when: false
  tags: [day1, verify]

- name: "day1 | Gather BGP peer/session count"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp session print count-only'
  register: _bgp_session_count
  changed_when: false
  failed_when: false
  tags: [day1, verify]

- name: "day1 | Parse BGP peer/session count"
  ansible.builtin.set_fact:
    _bgp_session_count_value: >-
      {{ (_bgp_session_count.stdout | default('0') | trim | int) }}
  tags: [day1, verify]

- name: "day1 | Parse concrete BGP session rows"
  ansible.builtin.set_fact:
    _bgp_session_rows: >-
      {{
        (_bgp_sessions.stdout_lines | default([]))
        | reject('match', '^Flags:')
        | reject('match', '^\\s*$')
        | list
      }}
  tags: [day1, verify]

- name: "day1 | Display BGP neighbor sessions"
  ansible.builtin.debug:
    msg: |
      ┌─── BGP Neighbor Sessions ────────────────────────────────────────────
      {{ _bgp_sessions.stdout | default('No BGP sessions found') }}
      └──────────────────────────────────────────────────────────────────────
  tags: [day1, verify]

- name: "day1 | Assert at least one BGP session exists"
  ansible.builtin.assert:
    that:
      - _bgp_session_count_value | int > 0
    fail_msg: >-
      RouterOS reported {{ _bgp_session_count_value | int }} live BGP sessions on {{ inventory_hostname }}.
      The border-leaf session is not actually established.
    success_msg: >-
      RouterOS returned {{ _bgp_session_count_value | int }} live BGP session(s) on {{ inventory_hostname }}.
  tags: [day1, verify]

- name: "day1 | Gather BGP advertised routes"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/routing bgp advertisements print'
  register: _bgp_advertised
  changed_when: false
  failed_when: false
  tags: [day1, verify]

- name: "day1 | Display BGP advertised routes"
  ansible.builtin.debug:
    msg: |
      ┌─── BGP Advertised Routes ───────────────────────────────────────────
      {{ _bgp_advertised.stdout | default('No routes advertised') }}
      └──────────────────────────────────────────────────────────────────────
  tags: [day1, verify]

- name: "day1 | Assert OOB management subnet is not advertised via BGP"
  ansible.builtin.assert:
    that:
      - (_bgp_advertised.stdout | default('')) is not search(oob_management_route_token | default('172.16.2.'))
    fail_msg: >-
      OOB policy violation on {{ inventory_hostname }}:
      management subnet token '{{ oob_management_route_token | default('172.16.2.') }}'
      was found in BGP advertised routes. Management subnet must not be exported into fabric BGP.
    success_msg: >-
      OOB policy OK on {{ inventory_hostname }}:
      management subnet '{{ oob_management_subnet | default('172.16.2.0/24') }}' is not advertised to fabric peers.
  tags: [day1, verify, oob]

- name: "day1 | Gather BGP received routes (IP routes from BGP)"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/ip route print where routing-table=main and bgp'
  register: _bgp_routes_received
  changed_when: false
  failed_when: false
  tags: [day1, verify]

- name: "day1 | Display BGP received routes"
  ansible.builtin.debug:
    msg: |
      ┌─── BGP Received Routes (IP Routing Table) ──────────────────────────
      {{ _bgp_routes_received.stdout | default('No BGP routes in routing table') }}
      └──────────────────────────────────────────────────────────────────────
  tags: [day1, verify]

- name: "day1 | Assert OOB management subnet is not learned from fabric BGP"
  ansible.builtin.assert:
    that:
      - (_bgp_routes_received.stdout | default('')) is not search(oob_management_route_token | default('172.16.2.'))
    fail_msg: >-
      OOB policy violation on {{ inventory_hostname }}:
      management subnet token '{{ oob_management_route_token | default('172.16.2.') }}'
      was found in BGP-received routes. This indicates management-route leakage from fabric.
    success_msg: >-
      OOB policy OK on {{ inventory_hostname }}:
      management subnet '{{ oob_management_subnet | default('172.16.2.0/24') }}' is not present in BGP-learned routes.
  tags: [day1, verify, oob]

- name: "day1 | Gather LLDP neighbor information"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/ip neighbor print detail'
  register: _lldp_neighbors
  changed_when: false
  failed_when: false
  tags: [day1, verify]

- name: "day1 | Display LLDP/CDP neighbors"
  ansible.builtin.debug:
    msg: |
      ┌─── LLDP/CDP Neighbors ──────────────────────────────────────────────
      {{ _lldp_neighbors.stdout | default('No LLDP/CDP neighbors discovered') }}
      └──────────────────────────────────────────────────────────────────────
  tags: [day1, verify]

- name: "day1 | Gather interface status"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/interface ethernet print where running=yes'
  register: _iface_status
  changed_when: false
  failed_when: false
  tags: [day1, verify]

- name: "day1 | Display active interfaces"
  ansible.builtin.debug:
    msg: |
      ┌─── Active Ethernet Interfaces ──────────────────────────────────────
      {{ _iface_status.stdout | default('No running interfaces') }}
      └──────────────────────────────────────────────────────────────────────
  tags: [day1, verify]

- name: "day1 | BGP deployment summary"
  ansible.builtin.debug:
    msg: |
      ════════════════════════════════════════════════════════════════════════
      Day-1 BGP Complete: {{ hostname }} (MikroTik CHR)
      ════════════════════════════════════════════════════════════════════════
      ASN:          {{ bgp_local_asn }}
      Router-ID:    {{ router_id }}
      Peers:        {{ fabric_interfaces | map(attribute='neighbor') | join(', ') }}
      BGP config:   {{ _bgp_connections.stdout_lines | default([]) | length }} lines
        Sessions:     {{ _bgp_session_rows | default([]) | length }} row(s)
      Routes Rx:    {{ _bgp_routes_received.stdout_lines | default([]) | select('search', 'bgp') | list | length }} prefixes
      LLDP peers:   {{ _lldp_neighbors.stdout_lines | default([]) | select('search', 'interface') | list | length }} neighbors
      ════════════════════════════════════════════════════════════════════════
  tags: [day1, verify]
