---
# =============================================================================
# Leaf_L2 - Edgecore/Accton AS5712-54X (Leaf #2, serves Host12_1/2/3 with Leaf_L1)
# =============================================================================
# Platform:   x86_64-accton_as5712_54x-r0 / Accton-AS5712-54X
# ASIC:       Broadcom Trident II BCM56854
# Ports:      48x10G SFP+ (Ethernet0-Ethernet47) + 6x40G QSFP+ (Ethernet48-Ethernet68)
# Management: 172.16.2.22 (Management Switch port44)
# Loopback:   10.0.1.2/32
# ASN:        65012
#
# Source: TopologyRequirements.txt — "Leaf_L1, Leaf_L2: Edge/Accton 5712 model to be used"
#
# KVM Virtual Lab Wiring (73 NICs; SEQUENTIAL port_config.ini position → NIC):
#   port_config.ini has 72 ports (48 SFP+ + 6×4 QSFP+ sub-ports, pre-broken-out).
#   KVM VS maps the Nth data entry in port_config.ini to kernel ethN (NIC-N).
#
#   NIC0  (mgmt/dc-mgmt)   → Management0 (172.16.2.22)
#   NIC1  (br-H121-L2)     → Ethernet0  (tenGigE0,  lane 13,  pos=1)  ↔ Host12_1 eth2
#   NIC2  (br-H122-L2)     → Ethernet1  (tenGigE1,  lane 14,  pos=2)  ↔ Host12_2 eth2
#   NIC3  (br-H123-L2)     → Ethernet2  (tenGigE2,  lane 15,  pos=3)  ↔ Host12_3 eth2
#   NIC4-64 (br-pad)       → positions 4-64: Ethernet3-Ethernet63 (unused in lab)
#   NIC65 (br-L2-S2)       → Ethernet64 (tenGigE64, lane 109, pos=65) ↔ Spine_S2 Ethernet4
#   NIC66-68 (br-pad)      → positions 66-68: Ethernet65-67 (unused QSFP+5 sub-ports)
#   NIC69 (br-L2-S1)       → Ethernet68 (tenGigE68, lane 77,  pos=69) ↔ Spine_S1 Ethernet4
#   NIC70-72 (br-pad)      → positions 70-72: Ethernet69-71 (unused QSFP+6 sub-ports)
#
# VM_BRIDGES: "br-H121-L2,br-H122-L2,br-H123-L2,@61,br-L2-S2,@3,br-L2-S1,@3"
#
# Fabric Wiring:
#   Ethernet68 (QSFP+6, lane 77, 10G breakout) ↔ Spine_S1 Ethernet4
#   Ethernet64 (QSFP+5, lane 109, 10G breakout) ↔ Spine_S2 Ethernet4
# =============================================================================

hostname: "Leaf_L2"
router_id: "10.0.1.2"
loopback_ip: "10.0.1.2/32"
mgmt_ip: "172.16.2.22/24"
mgmt_gateway: "172.16.2.1"
mac_address: "00:1c:73:a1:02:01"

# Platform selection is now driven by automation_profile.

bgp_local_asn: "{{ leaf_asn_map[inventory_hostname] }}"

# ---- Uplink interfaces (to spines, native 40G QSFP+) ----
uplink_interfaces:
  - port: "Ethernet68"
    alias: "fortyGigE68"
    lanes: "77,78,79,80"
    index: "54"
    speed: "40000"
    neighbor: "Spine_S1"
    neighbor_port: "Ethernet4"
    neighbor_asn: "{{ spine_asn }}"
    description: "Leaf_L2 → Spine_S1 (Celestica DX010)"

  - port: "Ethernet64"
    alias: "fortyGigE64"
    lanes: "109,110,111,112"
    index: "53"
    speed: "40000"
    neighbor: "Spine_S2"
    neighbor_port: "Ethernet4"
    neighbor_asn: "{{ spine_asn }}"
    description: "Leaf_L2 → Spine_S2 (Celestica DX010)"

# ---- Downlink interfaces (native 10G SFP+, no breakout needed) ----
downlink_interfaces:
  - port: "Ethernet0"
    alias: "tenGigE0"
    lanes: "13"
    speed: "10000"
    neighbor: "Host12_1"
    neighbor_asn: "{{ server_asn_map['Host12_1'] }}"
    neighbor_port: "eth2"
    description: "Leaf_L2 → Host12_1 eth2 (10G SFP+)"

  - port: "Ethernet1"
    alias: "tenGigE1"
    lanes: "14"
    speed: "10000"
    neighbor: "Host12_2"
    neighbor_asn: "{{ server_asn_map['Host12_2'] }}"
    neighbor_port: "eth2"
    description: "Leaf_L2 → Host12_2 eth2 (10G SFP+)"

  - port: "Ethernet2"
    alias: "tenGigE2"
    lanes: "15"
    speed: "10000"
    neighbor: "Host12_3"
    neighbor_asn: "{{ server_asn_map['Host12_3'] }}"
    neighbor_port: "eth2"
    description: "Leaf_L2 → Host12_3 eth2 (10G SFP+)"

# ---- No breakout needed (all ports are native speed) ----
breakout_cfg: {}

# ---- All ports reference ----
all_ports: "{{ as5712_sfp_ports + as5712_qsfp_ports }}"
