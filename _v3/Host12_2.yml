---
# =============================================================================
# Host12_2 - Ubuntu Bare-Metal Server (Leaf Pair L1/L2)
# =============================================================================
# Role: K8s Worker + Ceph OSD + OpenStack Compute
# MaaS PXE: 192.168.255.42 (Management Switch port12)
# iDRAC:    192.168.255.12 (Management Switch port2)
# Bond IP:  10.10.12.2/24  (active-backup across Leaf_L1 + Leaf_L2)
#
# Physical Wiring:
#   eth1 ↔ Leaf_L1 Ethernet1 (10G, breakout sub1 from QSFP+ port1)
#   eth2 ↔ Leaf_L2 Ethernet1 (10G, breakout sub1 from QSFP+ port1)
#   eth0 ↔ Management Switch port12 (PXE/MaaS)
#   iDRAC ↔ Management Switch port2
# =============================================================================

hostname: "Host12_2"
idrac_ip: "192.168.255.12"
pxe_ip: "192.168.255.42"
bond_ip: "10.10.12.2/24"
loopback_ip: "10.10.255.2/32"

fabric_interfaces:
  - name: "eth1"
    speed: "10000"
    neighbor: "Leaf_L1"
    neighbor_port: "Ethernet1"
    description: "Host12_2 → Leaf_L1 (10G)"
  - name: "eth2"
    speed: "10000"
    neighbor: "Leaf_L2"
    neighbor_port: "Ethernet1"
    description: "Host12_2 → Leaf_L2 (10G)"

pxe_interface:
  name: "eth0"
  neighbor: "Management_Switch"
  neighbor_port: "port12"

netplan:
  network:
    version: 2
    renderer: networkd
    ethernets:
      eth0:
        dhcp4: true
        dhcp4-overrides:
          use-dns: false
          use-routes: false
      eth1:
        dhcp4: false
        mtu: 9000
      eth2:
        dhcp4: false
        mtu: 9000
    bonds:
      bond0:
        interfaces: [eth1, eth2]
        addresses: ["10.10.12.2/24"]
        mtu: 9000
        parameters:
          mode: active-backup
          mii-monitor-interval: 100
          primary: eth1
    vlans: {}

frr_bgp:
  local_asn: 65102                  # UNIQUE per server (was 65200 — broken)
  router_id: "10.10.255.2"
  neighbors:
    - interface: "eth1"
      remote_asn: 65011
      description: "Leaf_L1"
    - interface: "eth2"
      remote_asn: 65012
      description: "Leaf_L2"
  networks:
    - "10.10.12.0/24"
    - "10.10.255.2/32"
  evpn:
    enabled: true
    advertise_all_vni: true
    advertise_ipv4_unicast: true
    advertise_ipv6_unicast: true

kube_role: worker
kubespray_node_labels:
  - "node-role.kubernetes.io/worker="
  - "openstack-compute-node=enabled"

ceph_roles: [osd]

# ---- sonic_server_net role variables ----
server_asn: "{{ server_asn_map[inventory_hostname] }}"
server_router_id: "{{ loopback_ip.split('/')[0] }}"
server_loopback_ip: "{{ loopback_ip }}"
server_interfaces_kvm:
  - name: "eth1"
    peer_asn: "{{ leaf_asn_map['Leaf_L1'] }}"
    neighbor: "Leaf_L1"
  - name: "eth2"
    peer_asn: "{{ leaf_asn_map['Leaf_L2'] }}"
    neighbor: "Leaf_L2"
