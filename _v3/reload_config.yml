---
# sonic_base/tasks/reload_config.yml
# Reload config_db.json on the switch and wait for services to stabilize.

- name: "reload | Skip reload if config unchanged"
  ansible.builtin.debug:
    msg: "Config unchanged — skipping reload on {{ inventory_hostname }}"
  when: not (sonic_config_changed | default(true) | bool)

- name: "reload | Apply config reload"
  ansible.builtin.command: config reload -y
  async: 300
  poll: 0
  register: _reload_job
  when: sonic_config_changed | default(true) | bool

- name: "reload | Kill stale SSH ControlMaster process after config reload"
  ansible.builtin.shell:
    cmd: >
      ssh -o ControlPath=/tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
          -O stop {{ ansible_host }} 2>/dev/null || true;
      rm -f /tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
      /tmp/ansible-ssh-{{ ansible_host }}-22-admin 2>/dev/null || true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  changed_when: false

- name: "reload | Reset SSH ControlMaster socket (sshd restarts during reload)"
  ansible.builtin.meta: reset_connection

- name: "reload | Re-establish SSH connection after socket reset"
  ansible.builtin.wait_for_connection:
    delay: 2
    timeout: 30

- name: "reload | Wait for switch to become reachable"
  ansible.builtin.wait_for_connection:
    delay: "{{ sonic_reload_delay }}"
    timeout: "{{ sonic_reload_timeout }}"
  when: sonic_config_changed | default(true) | bool

- name: "reload | Wait for SONiC services to stabilize"
  ansible.builtin.wait_for:
    timeout: "{{ sonic_service_settle_time }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  when: sonic_config_changed | default(true) | bool

- name: "reload | Verify critical services are running"
  ansible.builtin.command: "systemctl is-active {{ item }}"
  loop:
    - swss
    - syncd
    - database
  register: _svc_check
  retries: "{{ sonic_service_retries }}"
  delay: "{{ sonic_service_retry_delay }}"
  until: _svc_check.rc == 0
  changed_when: false
  when: sonic_config_changed | default(true) | bool

- name: "reload | Confirm reload complete"
  ansible.builtin.debug:
    msg: >-
      {{ 'Config reload complete — critical services (swss, syncd, database) are active on '
         if (sonic_config_changed | default(true) | bool)
         else 'Reload skipped (no config change) on ' }}{{ inventory_hostname }}"
