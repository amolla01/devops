---
# =============================================================================
# Host12_1 - Ubuntu Bare-Metal Server (Leaf Pair L1/L2)
# =============================================================================
# Role: K8s Controller + Ceph MON/MGR/OSD + OpenStack Controller
# MaaS PXE: 192.168.255.41 (Management Switch port11)
# iDRAC:    192.168.255.11 (Management Switch port1)
# Bond IP:  10.10.12.1/24  (active-backup across Leaf_L1 + Leaf_L2)
# Server ASN: 65200
#
# Physical Wiring:
#   eth1 ↔ Leaf_L1 Ethernet0 (10G, breakout sub0 from QSFP+ port1)
#   eth2 ↔ Leaf_L2 Ethernet0 (10G, breakout sub0 from QSFP+ port1)
#   eth0 ↔ Management Switch port11 (PXE/MaaS)
#   iDRAC ↔ Management Switch port1
# =============================================================================

hostname: "Host12_1"
idrac_ip: "192.168.255.11"
pxe_ip: "192.168.255.41"
bond_ip: "10.10.12.1/24"
loopback_ip: "10.10.255.1/32"

# ---- Network interfaces ----
fabric_interfaces:
  - name: "eth1"
    speed: "10000"
    neighbor: "Leaf_L1"
    neighbor_port: "Ethernet0"
    description: "Host12_1 → Leaf_L1 (10G)"
  - name: "eth2"
    speed: "10000"
    neighbor: "Leaf_L2"
    neighbor_port: "Ethernet0"
    description: "Host12_1 → Leaf_L2 (10G)"

pxe_interface:
  name: "eth0"
  neighbor: "Management_Switch"
  neighbor_port: "port11"

# ---- Netplan configuration ----
netplan:
  network:
    version: 2
    renderer: networkd
    ethernets:
      eth0:
        dhcp4: true
        dhcp4-overrides:
          use-dns: false
          use-routes: false
      eth1:
        dhcp4: false
        mtu: 9000
      eth2:
        dhcp4: false
        mtu: 9000
    bonds:
      bond0:
        interfaces: [eth1, eth2]
        addresses: ["10.10.12.1/24"]
        mtu: 9000
        parameters:
          mode: active-backup
          mii-monitor-interval: 100
          primary: eth1
    vlans: {}

# ---- FRR / BGP + EVPN ----
frr_bgp:
  local_asn: 65101                  # UNIQUE per server (was 65200 — broken)
  router_id: "10.10.255.1"
  neighbors:
    - interface: "eth1"
      remote_asn: 65011
      description: "Leaf_L1"
    - interface: "eth2"
      remote_asn: 65012
      description: "Leaf_L2"
  networks:
    - "10.10.12.0/24"
    - "10.10.255.1/32"
  evpn:
    enabled: true
    advertise_all_vni: true
    advertise_ipv4_unicast: true
    advertise_ipv6_unicast: true

# ---- K8s role ----
kube_role: controller
kubespray_node_labels:
  - "node-role.kubernetes.io/control-plane="
  - "ceph-mon=enabled"
  - "ceph-mgr=enabled"
  - "openstack-control-plane=enabled"

# ---- Ceph ----
ceph_roles: [mon, mgr, osd, mds]

# ---- sonic_server_net role variables ----
server_asn: "{{ server_asn_map[inventory_hostname] }}"
server_router_id: "{{ loopback_ip.split('/')[0] }}"
server_loopback_ip: "{{ loopback_ip }}"
server_interfaces_kvm:
  - name: "eth1"
    peer_asn: "{{ leaf_asn_map['Leaf_L1'] }}"
    neighbor: "Leaf_L1"
  - name: "eth2"
    peer_asn: "{{ leaf_asn_map['Leaf_L2'] }}"
    neighbor: "Leaf_L2"
