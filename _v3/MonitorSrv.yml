---
# =============================================================================
# MonitorSrv - Centralized Syslog & Monitoring Server
# =============================================================================
# Role: Syslog aggregator, Prometheus, Grafana, Loki, Alertmanager
# KVM Mgmt: 172.16.2.47 (libvirt dc-mgmt network — used for SSH in KVM lab)
# iDRAC:    192.168.255.33 (Management Switch port7 — real hardware only)
# Bond IP:  10.10.100.3/24 (active-backup across Border_Leaf1 + Border_Leaf2)
#
# This server receives syslog (UDP 514) from all SONiC switches in the
# fabric and runs the full observability stack:
#   - rsyslog: centralized log collection (UDP 514 + TCP 1514)
#   - Prometheus: metrics scraping from sonic_exporter on all switches
#   - Grafana: dashboards accessible from internet via Exit Routers
#   - Loki: log aggregation and querying (Promtail agents on switches)
#   - Alertmanager: alert routing (email, Slack, PagerDuty)
#
# Internet Access:
#   Exit Routers perform DNAT (port-forward) for inbound access:
#     External:3000 → 10.10.255.102:3000 (Grafana)
#     External:9090 → 10.10.255.102:9090 (Prometheus)
#   All fabric hosts can reach this server via BGP-announced loopback.
#
# Physical Wiring:
#   eth1 ↔ Border_Leaf1 Ethernet22 (QSFP+6 breakout sub2, 10G)
#   eth2 ↔ Border_Leaf2 Ethernet22 (QSFP+6 breakout sub2, 10G)
#   eth0 ↔ Management Switch port7 (PXE/MaaS)
# =============================================================================

hostname: "MonitorSrv"
mgmt_ip: "172.16.2.47"
idrac_ip: "192.168.255.33"
bond_ip: "10.10.100.3/24"
loopback_ip: "10.10.255.102/32"

fabric_interfaces:
  - name: "eth1"
    speed: "10000"
    neighbor: "Border_Leaf1"
    neighbor_port: "Ethernet2"
    description: "MonitorSrv → Border_Leaf1 (10G QSFP+6 breakout sub2)"
  - name: "eth2"
    speed: "10000"
    neighbor: "Border_Leaf2"
    neighbor_port: "Ethernet2"
    description: "MonitorSrv → Border_Leaf2 (10G QSFP+6 breakout sub2)"

pxe_interface:
  name: "eth0"
  neighbor: "Management_Switch"
  neighbor_port: "port7"

netplan:
  network:
    version: 2
    renderer: networkd
    ethernets:
      eth0:
        dhcp4: true
        dhcp4-overrides:
          use-dns: false
          use-routes: false
      eth1:
        dhcp4: false
        mtu: 9000
      eth2:
        dhcp4: false
        mtu: 9000
    bonds:
      bond0:
        interfaces: [eth1, eth2]
        addresses: ["10.10.100.3/24"]
        mtu: 9000
        parameters:
          mode: active-backup
          mii-monitor-interval: 100
          primary: eth1
    vlans: {}

frr_bgp:
  local_asn: 65108
  router_id: "10.10.255.102"
  neighbors:
    - interface: "eth1"
      remote_asn: 65021
      description: "Border_Leaf1"
    - interface: "eth2"
      remote_asn: 65022
      description: "Border_Leaf2"
  networks:
    - "10.10.100.0/24"
    - "10.10.255.102/32"

# ---- Services deployed on this host ----
monitoring_services:
  rsyslog:
    listen_udp: 514
    listen_tcp: 1514
    log_retention_days: 90
  prometheus:
    port: 9090
    scrape_interval: "15s"
    retention: "30d"
  grafana:
    port: 3000
    admin_user: "admin"
    # admin_password: from vault
  loki:
    port: 3100
    retention: "30d"
  alertmanager:
    port: 9093

# ---- sonic_server_net role variables ----
server_asn: "{{ server_asn_map[inventory_hostname] }}"
server_router_id: "{{ loopback_ip.split('/')[0] }}"
server_loopback_ip: "{{ loopback_ip }}"
server_interfaces_kvm:
  - name: "eth1"
    peer_asn: "{{ border_leaf_asn_map['Border_Leaf1'] }}"
    neighbor: "Border_Leaf1"
  - name: "eth2"
    peer_asn: "{{ border_leaf_asn_map['Border_Leaf2'] }}"
    neighbor: "Border_Leaf2"
