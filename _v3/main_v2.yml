---
# sonic_fabric/tasks/main_v2.yml
# Phase 2: Fabric interface integration
# Configures: PORT (admin up, correct speed), INTERFACE (IPv6 link-local),
#             BGP_NEIGHBOR (eBGP unnumbered), DEVICE_METADATA routing mode,
#             and LOOPBACK_INTERFACE for BGP router-id.
#
# FIX vs main.yml:
#   Border-only day-1 runs must keep local uplinks programmed on the border
#   leaf even when the spine peers are outside the current Ansible limit.
#   Filtering uplink_interfaces by ansible_play_hosts strips Ethernet120/124
#   out of the rendered patch, so the run only re-applies Ethernet0 and leaves
#   the spine-facing ports stale. That is exactly how a border-only day-1 run
#   can appear to "drop" spine adjacencies.
#
#   Solution: sonic_fabric must also own local server downlinks because the
#   active day-1 path programs leaf<->server BGP here. Those ports need the
#   same ConfigDB INTERFACE link-local settings as other unnumbered peers,
#   otherwise FRR stays at "Waiting for Peer IPv6 LLA" on both ends.
#
# Prerequisites: Day-0 config must already be applied (sonic_day0 role).
# Input vars:
#   - fabric_interfaces (spines) OR uplink_interfaces (leaves)
#   - exit_interfaces (border leaves, optional)
#   - downlink_interfaces (any switch, optional)
#   - bgp_local_asn
#   - router_id / loopback_ip
#   - hostname

- name: "fabric | Validate required variables"
  ansible.builtin.assert:
    that:
      - bgp_local_asn is defined
      - router_id is defined
      - loopback_ip is defined
      - hostname is defined
      - (fabric_interfaces is defined) or (uplink_interfaces is defined)
    fail_msg: >-
      Missing required variables for fabric integration on {{ inventory_hostname }}.
      Need: bgp_local_asn, router_id, loopback_ip, hostname, and
      fabric_interfaces (spine) or uplink_interfaces (leaf).
    quiet: true
  tags: [validate, fabric]

# FIX: sonic_fabric must preserve the current switch's own fabric-facing ports
# regardless of whether the peer is part of this play. BGP is allowed to idle
# until the far end is configured; what must not happen is silently omitting
# the local uplink or exit-facing port from the rendered patch.
- name: "fabric | Set unified interface list"
  ansible.builtin.set_fact:
    _fabric_links: >-
      {{
        (fabric_interfaces | default([]))
        + (uplink_interfaces | default([]))
        + (exit_interfaces | default([]))
        + (downlink_interfaces | default([]))
      }}
  tags: [render, fabric]

- name: "fabric | Resolve local hardware profile paths"
  ansible.builtin.set_fact:
    _fabric_hwsku_profile: "{{ sonic_fabric_hwsku_profiles[hwsku] | default({}) }}"
  tags: [render, fabric]

- name: "fabric | Validate local hardware profile mapping"
  ansible.builtin.assert:
    that:
      - _fabric_hwsku_profile.port_config is defined
      - _fabric_hwsku_profile.hwsku_json is defined
    fail_msg: >-
      No hardware profile mapping is defined for hwsku {{ hwsku }} on
      {{ inventory_hostname }}. Add sonic_fabric_hwsku_profiles[{{ hwsku }}]
      so fabric rendering can be validated against port_config.ini and hwsku.json.
    quiet: true
  tags: [validate, fabric]

# ---- Real Hardware: Port Breakout Pre-check ----
- name: "fabric | Check current port breakout mode matches expected (real hardware)"
  ansible.builtin.shell: |
    BREAKOUT_MISMATCH=""
    {% for link in _fabric_links %}
    {% if link.target_breakout_mode | default('') %}
    CURRENT=$(show interfaces breakout {{ link.port }} 2>/dev/null | grep -oP 'Current Breakout Mode.*?: \K\S+' || echo "unknown")
    if [ "$CURRENT" != "{{ link.target_breakout_mode }}" ] && [ "$CURRENT" != "unknown" ]; then
      BREAKOUT_MISMATCH="$BREAKOUT_MISMATCH {{ link.port }}(current=$CURRENT,target={{ link.target_breakout_mode }})"
    fi
    {% endif %}
    {% endfor %}
    if [ -n "$BREAKOUT_MISMATCH" ]; then
      echo "WARN: Breakout mode changes required:$BREAKOUT_MISMATCH"
      echo "NOTE: Port breakout changes require link flap — plan maintenance window"
      exit 0
    fi
    echo "OK: All port breakout modes match target"
  register: _breakout_precheck
  changed_when: false
  failed_when: false
  when: automation_profile == 'real_hardware'
  tags: [validate, fabric, breakout]

- name: "fabric | Report breakout pre-check result"
  ansible.builtin.debug:
    msg: "{{ _breakout_precheck.stdout | default('breakout check skipped') }}"
  when:
    - automation_profile == 'real_hardware'
    - _breakout_precheck.stdout is defined
  tags: [validate, fabric, breakout]

- name: "fabric | Fail if no interfaces match play hosts"
  ansible.builtin.fail:
    msg: >-
      No fabric interfaces on {{ inventory_hostname }} have a neighbor that is
      part of this play ({{ ansible_play_hosts | join(', ') }}).
      Check host_vars fabric_interfaces/uplink_interfaces/exit_interfaces values.
  when:
    - _fabric_links | length == 0
    - fabric_mode | default('incremental') != 'rollback'
  tags: [render, fabric]

- name: "fabric | Resolve interface metadata from hardware files"
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import os
    import sys

    with open(os.environ["PORT_CONFIG_PATH"], encoding="utf-8") as handle:
        port_rows = {}
        for raw_line in handle:
            line = raw_line.strip()
            if not line or line.startswith("#"):
                continue
            fields = line.split()
            if len(fields) < 5:
                continue
            port_rows[fields[0]] = {
                "lanes": fields[1],
                "alias": fields[2],
                "index": fields[3],
                "hardware_default_speed": str(fields[4]),
            }

    with open(os.environ["HWSKU_JSON_PATH"], encoding="utf-8") as handle:
        hwsku_data = json.load(handle)

    breakout_cfg = json.loads(os.environ.get("BREAKOUT_CFG", "{}"))

    breakout_by_port = {
        port: values.get("default_brkout_mode", "")
        for port, values in (hwsku_data.get("interfaces") or {}).items()
    }

    resolved = []
    missing = []
    for link in json.loads(os.environ["FABRIC_LINKS"]):
        port = link["port"]
        metadata = port_rows.get(port)
        if metadata is None:
            missing.append(port)
            continue

        merged = dict(link)
        requested_breakout_mode = (breakout_cfg.get(port) or {}).get("brkout_mode", "")

        merged["alias"] = merged.get("alias") or metadata["alias"]
        merged["lanes"] = merged.get("lanes") or metadata["lanes"]
        merged["index"] = merged.get("index") or metadata["index"]
        merged["hardware_default_speed"] = metadata["hardware_default_speed"]
        merged["hardware_default_brkout_mode"] = breakout_by_port.get(port, "")
        if requested_breakout_mode:
            merged["target_breakout_mode"] = requested_breakout_mode
        if not merged.get("speed"):
            merged["speed"] = metadata["hardware_default_speed"]
        resolved.append(merged)

    if missing:
        print(
            "Missing ports in local port_config.ini: " + ", ".join(missing),
            file=sys.stderr,
        )
        sys.exit(1)

    print(json.dumps(resolved))
    PY
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    FABRIC_LINKS: "{{ _fabric_links | to_json }}"
    BREAKOUT_CFG: "{{ breakout_cfg | default({}) | to_json }}"
    PORT_CONFIG_PATH: "{{ _fabric_hwsku_profile.port_config }}"
    HWSKU_JSON_PATH: "{{ _fabric_hwsku_profile.hwsku_json }}"
  register: _fabric_hw_links
  changed_when: false
  tags: [render, fabric]

- name: "fabric | Use hardware-resolved interface metadata"
  ansible.builtin.set_fact:
    _fabric_links: "{{ _fabric_hw_links.stdout | from_json }}"
  tags: [render, fabric]

- name: "fabric | Display target interfaces"
  ansible.builtin.debug:
    msg: >-
      Configuring {{ _fabric_links | length }} fabric interface(s) on {{ hostname }}:
      {% for iface in _fabric_links -%}
      {{ iface.port }}(speed={{ iface.speed }}, hw={{ iface.hardware_default_speed }}, breakout={{ iface.hardware_default_brkout_mode | default('') or 'n/a' }}){% if not loop.last %}, {% endif %}
      {%- endfor %}
  tags: [render, fabric]

- name: "fabric | Ensure local render directory exists"
  ansible.builtin.file:
    path: "{{ sonic_fabric_render_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  vars:
    ansible_become: false
  tags: [render, fabric]

- name: "fabric | Render fabric config_db.json"
  ansible.builtin.template:
    src: config_db_fabric.json.j2
    dest: "{{ sonic_fabric_render_dir }}/{{ inventory_hostname }}_config_db_fabric.json"
    mode: "0644"
  delegate_to: localhost
  vars:
    ansible_become: false
  register: _fabric_rendered
  tags: [render, fabric]

- name: "fabric | Validate rendered JSON syntax"
  ansible.builtin.command: >
    python3 -c "import json; json.load(open('{{ _fabric_rendered.dest }}'))"
  delegate_to: localhost
  vars:
    ansible_become: false
  changed_when: false
  tags: [validate, fabric]

- name: "fabric | Set rendered_config_path for push"
  ansible.builtin.set_fact:
    rendered_config_path: "{{ _fabric_rendered.dest }}"
  tags: [render, fabric]

- name: "fabric | Apply rendered fabric patch"
  ansible.builtin.import_tasks: apply_patch.yml
  tags: [deploy, fabric]

- name: "fabric | Run post-deploy verification"
  ansible.builtin.import_tasks: verify.yml
  tags: [verify, fabric]
