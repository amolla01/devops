---
# =============================================================================
# deploy_day1.yml  —  Day-1 Fabric Wiring (ALL device types)
# =============================================================================
# This playbook handles day-1 network/BGP configuration for:
#   - SONiC switches: eBGP unnumbered fabric links (via sonic_fabric role)
#   - MikroTik CHR exit routers: eBGP peering with border leaves
#   - Ubuntu servers: Netplan bond + FRR eBGP to leaf pair
#
# Each device type gets a SEPARATE PLAY so that SONiC-specific commands
# (sonic-cfggen, config_db.json, FRR vtysh via SONiC) never touch MikroTik
# or Ubuntu hosts, and vice versa.
#
# USAGE:
#   # Full fabric day-1 (all device types):
#   ansible-playbook playbooks/deploy_day1.yml -i inventory/hosts.yml
#
#   # SONiC switches only (spine-leaf fabric links):
#   ansible-playbook playbooks/deploy_day1.yml --limit sonic_switches \
#     -e "fabric_nodes=spines:leaves:border_leaves"
#
#   # MikroTik exit routers only:
#   ansible-playbook playbooks/deploy_day1.yml --limit exit_routers
#
#   # Ubuntu servers only:
#   ansible-playbook playbooks/deploy_day1.yml --limit servers
#
#   # Single device:
#   ansible-playbook playbooks/deploy_day1.yml --limit Exit_Router1
#   ansible-playbook playbooks/deploy_day1.yml --limit Host12_1
#
# PREREQUISITES:
#   - deploy_day0.yml must have been run successfully for all target devices
#   - For SONiC: all target switches must have day-0 config loaded
#   - For servers: packages (frr, lldpd) must be installed (day-0 does this)
#
# TAG-BASED PARTIAL RUNS:
#   --tags preflight       Pre-flight only
#   --tags deploy          Deploy configuration
#   --tags verify          Verification checks only
#   --tags interfaces      Interface configuration only
#   --tags bgp             BGP configuration only
#   --tags frr             FRR configuration only (servers)
#   --tags netplan         Netplan configuration only (servers)
# =============================================================================

###############################################################################
# PLAY 1: SONiC Switches — Fabric BGP (eBGP unnumbered)
###############################################################################
# Parallelism: fabric links are per-switch; BGP sessions retry until peer is up.
# Safe to configure all switches simultaneously — no ordering dependency.
# Default: 4 at a time (configurable via -e "fabric_serial=2" or "100%")
# strategy: free — faster switches (spines, fewer ports) don't wait for slower ones.
###############################################################################
- name: "Day-1 Fabric Wiring — SONiC Switches"
  hosts: "sonic_switches"
  become: yes
  gather_facts: false
  serial: "{{ fabric_serial | default(4) }}"
  strategy: "{{ fabric_strategy | default('free') }}"


  pre_tasks:

    - name: "Phase 0 | Assert automation profile is supported"
      ansible.builtin.assert:
        that:
          - automation_profile in automation_profile_supported
        fail_msg: >-
          Unsupported automation_profile '{{ automation_profile }}'.
          Supported: {{ automation_profile_supported | join(', ') }}
        success_msg: >-
          automation_profile={{ automation_profile }}
          ({{ automation_profile_label }})
      vars:
        ansible_become: false
      connection: local
      become: false
      delegate_to: localhost
      when: inventory_hostname == (ansible_play_hosts_all | first)
      tags: [always, day1]

    - name: "Phase 0 | Build hypervisor tap-offload work list (profile-driven)"
      ansible.builtin.set_fact:
        _kvm_hypervisor_work:
          - alias: "{{ lookup('ansible.builtin.env', 'R810_HOST') | default('R810', true) }}"
            vms: "{{ ansible_play_hosts }}"
      vars:
        ansible_become: false
      connection: local
      when:
        - automation_profile == 'ubuntu_r810_kvm'
        - inventory_hostname == (ansible_play_hosts_all | first)
      become: false
      delegate_to: localhost
      tags: [preflight, deploy, day1]

    - name: "Phase 0 | Build hypervisor tap-offload work list (profile-driven)"
      ansible.builtin.set_fact:
        _kvm_hypervisor_work:
          - alias: "{{ lookup('ansible.builtin.env', 'R620_HOST') | default('R620', true) }}"
            vms: "{{ ansible_play_hosts }}"
      vars:
        ansible_become: false
      connection: local
      when:
        - automation_profile == 'ubuntu_r620_kvm'
        - inventory_hostname == (ansible_play_hosts_all | first)
      become: false
      delegate_to: localhost
      tags: [preflight, deploy, day1]

    - name: "Phase 0 | Build hypervisor tap-offload work list"
      ansible.builtin.set_fact:
        _kvm_hypervisor_work:
          - alias: "{{ lookup('ansible.builtin.env', 'R620_HOST') | default('R620', true) }}"
            vms: "{{ ansible_play_hosts | intersect(['Spine_S1', 'Spine_S2', 'Leaf_L1', 'Leaf_L2', 'Border_Leaf1', 'Border_Leaf2', 'Exit_Router1', 'Exit_Router2', 'Host12_1', 'Host12_2', 'Host12_3', 'HostB12_1', 'HostB12_2', 'MonitorSrv']) }}"
          - alias: "{{ lookup('ansible.builtin.env', 'R810_HOST') | default('R810', true) }}"
            vms: "{{ ansible_play_hosts | intersect(['Leaf_L3', 'Leaf_L4', 'Host34_1', 'Host34_2']) }}"
      vars:
        ansible_become: false
      connection: local
      when:
        - automation_profile | default('') not in ['real_hardware', 'ubuntu_r620_kvm', 'ubuntu_r810_kvm']
        - inventory_hostname == (ansible_play_hosts_all | first)
      become: false
      delegate_to: localhost
      tags: [preflight, deploy, day1]

    - name: "Phase 0 | Disable hypervisor tap TX offload for KVM fabric VMs"
      ansible.builtin.shell: |
        ssh {{ item.alias | quote }} 'if ! sudo -n ovs-vsctl list-br >/dev/null 2>&1; then
          echo "__sudo_unavailable__"
          exit 0
        fi
        for vm in {{ item.vms | join(" ") }}; do
          sudo -n ovs-vsctl list-br 2>/dev/null | while read -r br; do
            [ -n "$br" ] || continue
            sudo -n ovs-vsctl list-ports "$br" 2>/dev/null | grep '^vnet' | while read -r tap; do
              [ -n "$tap" ] || continue
              sudo -n virsh domiflist "$vm" 2>/dev/null | grep -q "$tap" || continue
              sudo -n ethtool -K "$tap" tx off tso off gso off gro off 2>/dev/null || true
              echo "$vm:$tap"
            done
          done
        done'
      vars:
        ansible_become: false
      connection: local
      become: false
      delegate_to: localhost
      register: _kvm_tap_offload_fix
      changed_when: ((_kvm_tap_offload_fix.stdout_lines | default([])) | select('search', ':vnet') | list | length) > 0
      when:
        - automation_profile | default('') != 'real_hardware'
        - inventory_hostname == (ansible_play_hosts_all | first)
        - item.vms | length > 0
      loop: "{{ _kvm_hypervisor_work | default([]) }}"
      loop_control:
        label: "{{ item.alias }} => {{ item.vms | join(',') }}"
      tags: [preflight, deploy, day1]

    - name: "Phase 0 | Report hypervisor tap TX offload result"
      ansible.builtin.debug:
        msg: >-
          {{ 'Could not disable hypervisor tap offload via ' ~ item.item.alias ~ ' because remote sudo requires a password. Run the offload fix directly on that hypervisor or configure passwordless sudo for ovs-vsctl, virsh, and ethtool.'
             if ('__sudo_unavailable__' in (item.stdout_lines | default([])))
             else 'Applied hypervisor tap offload fix via ' ~ item.item.alias ~ ' for: ' ~ (((item.stdout_lines | default([])) | select('search', ':vnet') | list) | join(', '))
             if (((item.stdout_lines | default([])) | select('search', ':vnet') | list | length) > 0)
             else 'No matching hypervisor tap interfaces were found via ' ~ item.item.alias ~ ' for: ' ~ (item.item.vms | join(', ')) }}
      vars:
        ansible_become: false
      connection: local
      become: false
      delegate_to: localhost
      loop: "{{ _kvm_tap_offload_fix.results | default([]) }}"
      loop_control:
        label: "{{ item.item.alias if (item.item is defined) else 'hypervisor' }}"
      when:
        - automation_profile | default('') != 'real_hardware'
        - inventory_hostname == (ansible_play_hosts_all | first)
        - not (item.skipped | default(false))
      tags: [preflight, deploy, day1]

    - name: "Phase 0 | Pre-flight connectivity"
      ansible.builtin.include_role:
        name: sonic_base
        tasks_from: preflight.yml
      tags: [preflight, day1]

  roles:
    - role: sonic_fabric
      tags: [deploy, interfaces, bgp, day1]

  post_tasks:

    - name: "Phase 2 | Verify BGP neighbors are established"
      ansible.builtin.shell: |
        vtysh -c "show bgp summary json" 2>/dev/null || echo '{}'
      register: _bgp_summary
      changed_when: false
      failed_when: false
      tags: [verify, day1]

    - name: "Phase 2 | Report BGP state"
      ansible.builtin.debug:
        msg: "BGP summary: {{ _bgp_summary.stdout | default('unavailable') }}"
      tags: [verify, day1]

