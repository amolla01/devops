---
# =============================================================================
# deploy_kubespray.yml - Deploy Kubernetes via KubeSpray (multi-node, profile-aware)
# =============================================================================
# This playbook prepares deployer, generates a KubeSpray inventory from
# the kube_nodes group (kube_controllers + kube_workers), and installs a
# Kubernetes cluster using KubeSpray.
#
# Supports all automation profiles:
#   - win11_kvm        (QEMU/KVM on Windows 11)
#   - ubuntu_r620_kvm  (QEMU/KVM on Dell R620)
#   - ubuntu_r810_kvm  (QEMU/KVM on Dell R810)
#   - real_hardware    (bare-metal switches + physical servers)
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/reused/deploy_kubespray.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/reused/deploy_kubespray.yml --tags prereqs
#   ansible-playbook -i inventory/hosts.yml playbooks/reused/deploy_kubespray.yml --tags generate
#   ansible-playbook -i inventory/hosts.yml playbooks/reused/deploy_kubespray.yml --tags prepare
#   ansible-playbook -i inventory/hosts.yml playbooks/reused/deploy_kubespray.yml --tags deploy
#   ansible-playbook -i inventory/hosts.yml playbooks/reused/deploy_kubespray.yml --tags verify
#
# Prerequisites:
#   - All kube_nodes hosts reachable via SSH
#   - Deployer has python3, pip, git installed
#   - Deployer can reach internet (or has offline packages)
# =============================================================================

- name: "Phase 1: Prepare Deployer Machine for KubeSpray"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags: [prereqs]
  vars:
    ansible_become_pass: "{{ vault_ansible_password | default('amolla01') }}"
    kubespray_version: "{{ kubespray_release | default('v2.24.1') }}"
    kubespray_dir: "{{ kubespray_base_dir | default('/opt/fabric-cache/kubespray/src') }}"
    venv_dir: "/opt/fabric-cache/kubespray/venv"
  tasks:
    - name: Check if preflight cache already has KubeSpray
      ansible.builtin.stat:
        path: "{{ kubespray_dir }}/cluster.yml"
      register: _cache_stat

    - name: Display automation profile
      ansible.builtin.debug:
        msg: |
          Automation Profile: {{ automation_profile }}
          KubeSpray dir: {{ kubespray_dir }} ({{ 'already cached' if _cache_stat.stat.exists else 'will clone from GitHub' }})
          Controllers: {{ groups['kube_controllers'] | default([]) | join(', ') }}
          Workers: {{ groups['kube_workers'] | default([]) | join(', ') }}
          All kube_nodes: {{ groups['kube_nodes'] | default([]) | join(', ') }}

    - name: Install system packages for KubeSpray
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
          - git
          - sshpass
          - rsync
        state: present
      become: true

    - name: Clone KubeSpray repository (skipped if preflight cache available)
      ansible.builtin.git:
        repo: "https://github.com/kubernetes-sigs/kubespray.git"
        dest: "{{ kubespray_dir }}"
        version: "{{ kubespray_version }}"
        force: false
      register: kubespray_clone
      when: not _cache_stat.stat.exists

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/activate"

    - name: Install KubeSpray requirements in venv
      ansible.builtin.pip:
        requirements: "{{ kubespray_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        state: present

    - name: Ensure KubeSpray download cache directory exists
      ansible.builtin.file:
        path: /opt/fabric-cache/kubespray/download-cache
        state: directory
        mode: '0755'
      become: true

    - name: Install Helm binary on deployer
      ansible.builtin.shell: |
        if ! command -v helm &>/dev/null; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
        helm version --short
      register: helm_installed
      changed_when: "'installed' in helm_installed.stdout"

    - name: Display KubeSpray readiness
      ansible.builtin.debug:
        msg: |
          KubeSpray {{ kubespray_version }} ready at: {{ kubespray_dir }}
          Virtual env: {{ venv_dir }}
          Helm: {{ helm_installed.stdout | default('already installed') }}
          Profile: {{ automation_profile }}
          Source: {{ 'preflight cache' if _cache_stat.stat.exists else 'cloned from GitHub' }}

- name: "Phase 2: Generate KubeSpray Inventory (multi-node, profile-aware)"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags: [generate]
  vars:
    kubespray_version: "{{ kubespray_release | default('v2.24.1') }}"
    kubespray_dir: "{{ kubespray_base_dir | default('/opt/fabric-cache/kubespray/src') }}"
    kubespray_inventory_dir: "{{ kubespray_dir }}/inventory/dc-lab"
    kube_version: "v1.29.4"
    container_runtime: "containerd"
    kube_network_plugin: "calico"
  tasks:
    - name: Validate kube_nodes group is populated
      ansible.builtin.assert:
        that:
          - groups['kube_controllers'] | default([]) | length > 0
        fail_msg: |
          ERROR: No hosts found in kube_controllers group.
          Ensure hosts.yml defines kube_controllers with at least one host.

    - name: Create KubeSpray inventory directory
      ansible.builtin.file:
        path: "{{ kubespray_inventory_dir }}/group_vars/all"
        state: directory
        mode: '0755'

    - name: Create KubeSpray inventory directory (k8s-cluster)
      ansible.builtin.file:
        path: "{{ kubespray_inventory_dir }}/group_vars/k8s_cluster"
        state: directory
        mode: '0755'

    - name: Generate KubeSpray hosts.yml
      ansible.builtin.template:
        src: "../../roles/kubespray/templates/kubespray_hosts.yml.j2"
        dest: "{{ kubespray_inventory_dir }}/hosts.yml"
        mode: '0644'

    - name: Generate KubeSpray all.yml vars
      ansible.builtin.template:
        src: "../../roles/kubespray/templates/kubespray_all.yml.j2"
        dest: "{{ kubespray_inventory_dir }}/group_vars/all/all.yml"
        mode: '0644'

    - name: Generate KubeSpray k8s-cluster.yml vars
      ansible.builtin.template:
        src: "../../roles/kubespray/templates/kubespray_k8s_cluster.yml.j2"
        dest: "{{ kubespray_inventory_dir }}/group_vars/k8s_cluster/k8s-cluster.yml"
        mode: '0644'

    - name: Generate KubeSpray addons.yml
      ansible.builtin.template:
        src: "../../roles/kubespray/templates/kubespray_addons.yml.j2"
        dest: "{{ kubespray_inventory_dir }}/group_vars/k8s_cluster/addons.yml"
        mode: '0644'

    - name: Display generated inventory summary
      ansible.builtin.debug:
        msg: |
          KubeSpray inventory generated at: {{ kubespray_inventory_dir }}
          Profile: {{ automation_profile }}
          Controllers (kube_control_plane + etcd): {{ groups['kube_controllers'] | join(', ') }}
          Workers (kube_node): {{ groups['kube_workers'] | default([]) | join(', ') | default('none — controllers will accept workloads') }}

- name: "Phase 3: Prepare All Kubernetes Nodes"
  hosts: kube_nodes
  gather_facts: true
  become: true
  tags: [prepare]
  vars:
    ansible_become_pass: "{{ vault_ansible_password | default('amolla01') }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3
      -o PreferredAuthentications=publickey,password
      -o PubkeyAuthentication=yes -o PasswordAuthentication=yes
      {{ proxy_jump_ssh_arg | default('') | trim }}
  tasks:
    - name: Disable swap (required by kubelet)
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/\sswap\s/d' /etc/fstab
      changed_when: true

    - name: Load required kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay
        - ip_vs
        - ip_vs_rr
        - ip_vs_wrr
        - ip_vs_sh

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter
          overlay
          ip_vs
          ip_vs_rr
          ip_vs_wrr
          ip_vs_sh
        mode: '0644'

    - name: Set sysctl parameters for Kubernetes
      ansible.builtin.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
        reload: true
      loop:
        - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "net.ipv4.ip_forward", value: "1" }
        - { key: "net.ipv6.conf.all.forwarding", value: "1" }

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - conntrack
          - socat
          - ipset
          - ipvsadm
        state: present
        update_cache: true

    - name: Set hostname to kube_node_name
      ansible.builtin.hostname:
        name: "{{ kube_node_name | default(inventory_hostname | lower | replace('_', '-')) }}"

    # ---- Real Hardware: Disk IOPS check for etcd (controllers only) ----
    - name: "preflight_hw | Check disk write latency for etcd (real hardware)"
      ansible.builtin.shell: |
        # etcd requires < 10ms p99 write latency for stable leader election
        # Quick fio test: 4KB sequential writes, measure 99th percentile
        if ! command -v fio >/dev/null 2>&1; then
          echo "SKIP: fio not installed, cannot validate disk IOPS"
          exit 0
        fi
        RESULT=$(fio --name=etcd-test --filename=/tmp/.fio_etcd_test \
          --rw=write --bs=4k --fdatasync=1 --size=16M --runtime=10 \
          --time_based --output-format=json 2>/dev/null | \
          python3 -c "import json,sys; d=json.load(sys.stdin); print(int(d['jobs'][0]['sync']['lat_ns']['percentile']['99.000000']/1000000))" 2>/dev/null)
        rm -f /tmp/.fio_etcd_test
        if [ -z "$RESULT" ]; then
          echo "SKIP: Could not parse fio output"
          exit 0
        fi
        echo "etcd_disk_p99_write_ms=$RESULT"
        if [ "$RESULT" -gt 10 ]; then
          echo "WARN: Disk p99 write latency ${RESULT}ms > 10ms threshold — etcd performance may suffer"
        else
          echo "OK: Disk p99 write latency ${RESULT}ms within etcd requirements"
        fi
      register: _etcd_disk_check
      changed_when: false
      failed_when: false
      when:
        - automation_profile == 'real_hardware'
        - inventory_hostname in groups['kube_controllers']
      tags: [prepare, preflight]

    - name: "preflight_hw | Report disk IOPS result"
      ansible.builtin.debug:
        msg: "{{ _etcd_disk_check.stdout_lines | default(['etcd disk check skipped']) }}"
      when:
        - automation_profile == 'real_hardware'
        - inventory_hostname in groups['kube_controllers']
      tags: [prepare, preflight]

- name: "Phase 4: Execute KubeSpray cluster.yml"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags: [deploy]
  vars:
    kubespray_version: "{{ kubespray_release | default('v2.24.1') }}"
    kubespray_dir: "{{ kubespray_base_dir | default('/opt/fabric-cache/kubespray/src') }}"
    kubespray_inventory_dir: "{{ kubespray_dir }}/inventory/dc-lab"
    venv_dir: "/opt/fabric-cache/kubespray/venv"
    first_controller: "{{ groups['kube_controllers'][0] }}"
    ansible_user_target: "{{ hostvars[first_controller]['ansible_user'] | default('ubuntu') }}"
    # Timeout scales with profile (KVM is slower)
    kubespray_timeout: "{{ '300' if automation_profile in ['win11_kvm', 'ubuntu_r620_kvm'] else '180' if automation_profile == 'ubuntu_r810_kvm' else '120' }}"
  tasks:
    - name: Display deployment plan
      ansible.builtin.debug:
        msg: |
          Deploying Kubernetes cluster via KubeSpray
          Profile: {{ automation_profile }}
          Timeout: {{ kubespray_timeout }}s
          SSH user: {{ ansible_user_target }}
          ProxyJump: {{ proxy_jump_resolved | default('none') }}
          Inventory: {{ kubespray_inventory_dir }}/hosts.yml

    - name: Clear stale SSH ControlMaster sockets
      ansible.builtin.shell: rm -f ~/.ansible/cp/* /tmp/ansible-ssh-* 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # --- ProxyCommand approach ---------------------------------------------------
    # sshpass can only satisfy ONE password prompt. With ProxyJump the SSH client
    # chains two connections (R810 → target) internally, so a single sshpass
    # subprocess cannot handle both.  The fix: use a ProxyCommand wrapper script
    # that runs its OWN sshpass for R810, completely independent from Ansible's
    # sshpass for the target.  Two separate processes → two separate prompts → no
    # conflict.  host_key_checking / StrictHostKeyChecking=no are applied to
    # every hop.
    - name: Write ProxyCommand wrapper script for R810 hop
      ansible.builtin.copy:
        dest: /tmp/kube-proxy-jump.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Hop through {{ proxy_jump_resolved }} to reach the target.
          # This script is called by SSH as a ProxyCommand, so stdin/stdout carry
          # the tunnel data.  sshpass here is dedicated to R810 only.
          # Retry up to 3 times with a short backoff to handle R810 MaxStartups
          # exhaustion when many nodes connect simultaneously.
          for attempt in 1 2 3; do
            sshpass -p '{{ target_ssh_pass | default(vault_ansible_password | default("amolla01")) }}' \
              ssh \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=15 \
                -W "$1:$2" \
                {{ proxy_jump_resolved }} && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      when: proxy_jump_resolved | default('') | length > 0

    - name: Patch kubespray ansible.cfg — disable host key checking
      ansible.builtin.lineinfile:
        path: "{{ kubespray_dir }}/ansible.cfg"
        regexp: '^host_key_checking\s*='
        line: "host_key_checking = False"
        insertafter: '^\[defaults\]'

    - name: Patch kubespray ansible.cfg — SSH args via ProxyCommand script
      ansible.builtin.lineinfile:
        path: "{{ kubespray_dir }}/ansible.cfg"
        regexp: '^ssh_args\s*='
        line: >-
          ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o ConnectTimeout=30 -o ServerAliveInterval=30
          -o "ProxyCommand=/tmp/kube-proxy-jump.sh %h %p"
        insertafter: '^\[ssh_connection\]'
      when: proxy_jump_resolved | default('') | length > 0

    - name: Patch kubespray ansible.cfg — SSH args (no proxy)
      ansible.builtin.lineinfile:
        path: "{{ kubespray_dir }}/ansible.cfg"
        regexp: '^ssh_args\s*='
        line: >-
          ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o ConnectTimeout=30 -o ServerAliveInterval=30
        insertafter: '^\[ssh_connection\]'
      when: proxy_jump_resolved | default('') | length == 0

    - name: Patch kubespray ansible.cfg — disable pipelining
      ansible.builtin.lineinfile:
        path: "{{ kubespray_dir }}/ansible.cfg"
        regexp: '^pipelining\s*='
        line: "pipelining = False"
        insertafter: '^\[ssh_connection\]'

    - name: Run KubeSpray cluster.yml
      ansible.builtin.shell: |
        set -o pipefail
        source {{ venv_dir }}/bin/activate
        cd {{ kubespray_dir }}
        ansible-playbook -i {{ kubespray_inventory_dir }}/hosts.yml \
          cluster.yml \
          --become --become-user=root \
          -e "ansible_user={{ ansible_user_target }}" \
          -e "ansible_ssh_pass={{ target_ssh_pass | default(vault_ansible_password | default('amolla01')) }}" \
          -e "ansible_become_pass={{ target_ssh_pass | default(vault_ansible_password | default('amolla01')) }}" \
          --timeout={{ kubespray_timeout }} \
          2>&1 | tee /tmp/kubespray_deploy.log
      args:
        executable: /bin/bash
      register: kubespray_result
      changed_when: kubespray_result.rc == 0

    - name: Display KubeSpray result
      ansible.builtin.debug:
        msg: "KubeSpray exit code: {{ kubespray_result.rc }}"

    - name: Fail if KubeSpray failed
      ansible.builtin.fail:
        msg: "KubeSpray deployment failed. Check /tmp/kubespray_deploy.log"
      when: kubespray_result.rc != 0

- name: "Phase 5: Verify Kubernetes Cluster"
  hosts: "{{ groups['kube_controllers'][0] }}"
  gather_facts: false
  become: true
  tags: [verify]
  vars:
    kube_user: "{{ ansible_user | default('ubuntu') }}"
    ansible_become_pass: "{{ vault_ansible_password | default('amolla01') }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3
      -o PreferredAuthentications=publickey,password
      -o PubkeyAuthentication=yes -o PasswordAuthentication=yes
      {{ proxy_jump_ssh_arg | default('') | trim }}
  tasks:
    - name: Create .kube directory
      ansible.builtin.file:
        path: "/home/{{ kube_user }}/.kube"
        state: directory
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0755'

    - name: Check admin.conf exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: _admin_conf

    - name: Fail early if kubeconfig missing
      ansible.builtin.fail:
        msg: >-
          /etc/kubernetes/admin.conf not found on {{ inventory_hostname }}.
          KubeSpray likely failed during Phase 4 — check /tmp/kubespray_deploy.log on the deployer.
      when: not _admin_conf.stat.exists

    - name: Copy admin kubeconfig to user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ kube_user }}/.kube/config"
        remote_src: true
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0600'

    - name: Check node status
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_output
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display node status
      ansible.builtin.debug:
        msg: "{{ nodes_output.stdout_lines }}"

    - name: Verify all kube_nodes are Ready
      ansible.builtin.shell: |
        NOT_READY=$(kubectl get nodes --no-headers | grep -v ' Ready' | wc -l)
        TOTAL=$(kubectl get nodes --no-headers | wc -l)
        EXPECTED={{ groups['kube_nodes'] | length }}
        echo "Total nodes: $TOTAL, Expected: $EXPECTED, Not-Ready: $NOT_READY"
        if [ "$NOT_READY" -gt 0 ]; then
          echo "FAIL: $NOT_READY node(s) not in Ready state"
          kubectl get nodes --no-headers | grep -v ' Ready'
          exit 1
        fi
        if [ "$TOTAL" -lt "$EXPECTED" ]; then
          echo "WARN: Only $TOTAL/$EXPECTED nodes joined the cluster"
          exit 1
        fi
        echo "OK: All $TOTAL nodes are Ready"
      register: node_ready_check
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display readiness result
      ansible.builtin.debug:
        msg: "{{ node_ready_check.stdout_lines }}"

    - name: Check all system pods
      ansible.builtin.command: kubectl get pods -A -o wide
      register: pods_output
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display system pods
      ansible.builtin.debug:
        msg: "{{ pods_output.stdout_lines }}"

    - name: Verify CoreDNS is running
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[*].status.phase}'
      register: coredns_status
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Assert CoreDNS running
      ansible.builtin.assert:
        that:
          - "'Running' in coredns_status.stdout"
        fail_msg: "CoreDNS pods are not running!"
        success_msg: "CoreDNS is running."

    - name: Check cluster info
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display cluster info
      ansible.builtin.debug:
        msg: "{{ cluster_info.stdout_lines }}"

    - name: Fetch kubeconfig to deployer
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../kubeconfig/admin.conf"
        flat: true
