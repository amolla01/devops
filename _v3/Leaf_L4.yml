---
# =============================================================================
# Leaf_L4 - Arista 7050-QX32 (Leaf #4, serves Host34_1/2 with Leaf_L3)
# =============================================================================
# Platform:   x86_64-arista_7050_qx32 / Arista-7050-QX32
# ASIC:       Broadcom Trident II BCM56854 (32x40G QSFP+)
# Management: 172.16.2.24 (Management Switch port42)
# Loopback:   10.0.1.4/32
# ASN:        65014
#
# Fabric Wiring (per TopologyRequirements.txt):
#   Ethernet124 (Ethernet32, QSFP+32) ↔ Spine_S1 Ethernet12 (uplink, 40G)
#   Ethernet120 (Ethernet31, QSFP+31) ↔ Spine_S2 Ethernet12 (uplink, 40G)
#
# Server Wiring (QSFP+ port 1 broken out 4x10G):
#   Ethernet0 (breakout sub0) ↔ Host34_1 eth2 (10G)
#   Ethernet2 (breakout sub2) ↔ Host34_2 eth2 (10G)
# =============================================================================

hostname: "Leaf_L4"
router_id: "10.0.1.4"
loopback_ip: "10.0.1.4/32"
mgmt_ip: "172.16.2.24/24"
mgmt_gateway: "172.16.2.1"
mac_address: "00:1c:73:a1:04:01"

bgp_local_asn: "{{ leaf_asn_map[inventory_hostname] }}"

# ---- Uplink interfaces ----
uplink_interfaces:
  - port: "Ethernet124"
    alias: "Ethernet32"
    lanes: "1,2,3,4"
    index: "32"
    speed: "40000"
    neighbor: "Spine_S1"
    neighbor_port: "Ethernet12"
    neighbor_asn: "{{ spine_asn }}"
    description: "Leaf_L4 → Spine_S1 (Celestica DX010)"

  - port: "Ethernet120"
    alias: "Ethernet31"
    lanes: "5,6,7,8"
    index: "31"
    speed: "40000"
    neighbor: "Spine_S2"
    neighbor_port: "Ethernet12"
    neighbor_asn: "{{ spine_asn }}"
    description: "Leaf_L4 → Spine_S2 (Celestica DX010)"

# ---- Downlink interfaces (native QSFP+ ports for KVM VS) ----
# KVM VS does NOT support port breakout — sub-port names (Ethernet1/2/3) are invalid.
# On KVM, use native 40G QSFP+ ports directly (speed mismatch is virtual-only).
#
# KVM VS mapping:
#   Ethernet0  (QSFP+1, idx 1, lanes 125-128) → Host34_1 (NIC1/br-H341-L4)
#   Ethernet4  (QSFP+2, idx 2, lanes 121-124) → Host34_2 (NIC2/br-H342-L4)
#
# Physical hardware mapping (with 4x10G breakout of Ethernet0):
#   Ethernet0 (lane 125) → Host34_1 enps2 (10G)
#   Ethernet1 (lane 126) → Host34_2 enps2 (10G)
#   Ethernet2 (lane 127) → Storage_Server_HDD_01 enps2 (10G, future)
#   Ethernet3 (lane 128) → Storage_Server_HDD_02 enps2 (10G, future)
downlink_interfaces:
  - port: "Ethernet0"
    lanes: "125,126,127,128"
    index: "1"
    speed: "40000"
    neighbor: "Host34_1"
    neighbor_asn: "{{ server_asn_map['Host34_1'] }}"
    neighbor_port: "eth2"
    description: "Leaf_L4 → Host34_1 enps2 (QSFP+1 native 40G) [KVM NIC1/br-H341-L4]"

  - port: "Ethernet4"
    lanes: "121,122,123,124"
    index: "2"
    speed: "40000"
    neighbor: "Host34_2"
    neighbor_asn: "{{ server_asn_map['Host34_2'] }}"
    neighbor_port: "eth2"
    description: "Leaf_L4 → Host34_2 enps2 (QSFP+2 native 40G) [KVM NIC2/br-H342-L4]"

# ---- Breakout configuration ----
# KVM VS does NOT support breakout — native QSFP+ ports used directly.
# Physical hardware would need breakout applied before sub-ports become available.
breakout_cfg: {}

all_ports: "{{ qx32_all_ports }}"
