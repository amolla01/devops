---
# =============================================================================
# Border_Leaf1 - Arista 7050QX-32S (Border Leaf #1)
# =============================================================================
# Platform:   x86_64-arista_7050_qx32s / Arista-7050QX-32S
# ASIC:       Broadcom Trident II BCM56854
# Ports:      32x40G QSFP+ (4 lanes per port, 128 SerDes total)
# Management: 172.16.2.31 (Management Switch port41)
# Loopback:   10.0.2.1/32
# ASN:        65021
#
# Source: TopologyRequirements.txt — "Border-Leaf: Arista-7050QX-32S to be used"
#
# Fabric Wiring (per TopologyWiring.txt, adjusted for KVM VS ethN mapping):
#   Ethernet124 (Ethernet36, index 36) ↔ Spine_S1 Ethernet16  (uplink, 40G)
#   Ethernet120 (Ethernet35, index 35) ↔ Spine_S2 Ethernet16  (uplink, 40G)
#
#   CRITICAL: SONiC VS maps ports to ethN SEQUENTIALLY (1st port → eth1, 2nd → eth2,
#   etc.), NOT by port_config.ini index. For Arista-7050QX-32S (indices 5-36):
#     ethN = index - 4   (e.g., index 36 → eth32, index 35 → eth31)
#   So Ethernet124 (index 36) → eth32 → NIC32 → br-BL1-S1 ✓
#   and Ethernet120 (index 35) → eth31 → NIC31 → br-BL1-S2 ✓
#
# Breakout QSFP+5 (parent Ethernet0, lanes 9-12) → 4x10G:
#   Ethernet0 (lane 9)  ↔ HostB12_1 enps1 (10G)
#   Ethernet1 (lane 10) ↔ HostB12_2 enps1 (10G)
#   Ethernet2 (lane 11) ↔ MonitorSrv enps1 (10G)
#   Ethernet3 (lane 12) ↔ Exit_Router1 CRS326 ether24 (10G)
# =============================================================================

hostname: "Border_Leaf1"
router_id: "10.0.2.1"
loopback_ip: "10.0.2.1/32"
mgmt_ip: "172.16.2.31/24"
mgmt_gateway: "172.16.2.1"
mac_address: "00:e0:ec:57:12:01"

# Platform selection is now driven by automation_profile.
# Override group_vars hwsku: Border_Leaf1 uses Arista-7050QX-32S
platform: "x86_64-arista_7050_qx32s"
hwsku: "Arista-7050QX-32S"

bgp_local_asn: "{{ border_leaf_asn_map[inventory_hostname] }}"

# ---- Uplink interfaces (to spines, native 40G QSFP+) ----
# Ethernet124 → index 36 → eth32 → NIC32 → br-BL1-S1 (Spine_S1)
# Ethernet120 → index 35 → eth31 → NIC31 → br-BL1-S2 (Spine_S2)
uplink_interfaces:
  - port: "Ethernet124"
    alias: "Ethernet36"
    lanes: "5,6,7,8"
    index: "36"
    speed: "40000"
    neighbor: "Spine_S1"
    neighbor_port: "Ethernet16"
    neighbor_asn: "{{ spine_asn }}"
    description: "Border_Leaf1 → Spine_S1 (Celestica DX010)"

  - port: "Ethernet120"
    alias: "Ethernet35"
    lanes: "1,2,3,4"
    index: "35"
    speed: "40000"
    neighbor: "Spine_S2"
    neighbor_port: "Ethernet16"
    neighbor_asn: "{{ spine_asn }}"
    description: "Border_Leaf1 → Spine_S2 (Celestica DX010)"

# ---- Exit router downlink (native QSFP+8 for KVM VS) ----
# KVM VS does NOT support breakout — sub-port names (Ethernet1/2/3) are invalid.
# Use native 40G QSFP+ ports that exist in port_config.ini.
# Point-to-point /31 link: Border_Leaf1 (10.0.253.0) ↔ Exit_Router1 (10.0.253.1)
#
# Physical hardware mapping (with 4x10G breakout of Ethernet0/QSFP+5):
#   Ethernet3 (lane 12, alias Ethernet5/4) → Exit_Router1 ether24
# KVM VS mapping:
#   Ethernet12 (QSFP+8, idx 8, lanes 21-24) → Exit_Router1 ether24
exit_interfaces:
  - port: "Ethernet12"
    alias: "Ethernet8/1"
    lanes: "21,22,23,24"
    index: "8"
    speed: "40000"
    mtu: "1500"
    neighbor: "Exit_Router1"
    neighbor_port: "ether24"
    neighbor_asn: 65253
    local_ip: "10.0.253.0/31"
    neighbor_ip: "10.0.253.1"
    description: "Border_Leaf1 Ethernet12 → Exit_Router1 CRS326 ether24 (QSFP+8 native) [KVM NIC4]"

# ---- Server downlinks (native QSFP+ ports for KVM VS) ----
# KVM VS does NOT support breakout — use native 40G QSFP+ ports directly.
# Port mapping (KVM VS → NIC formula: ethN = index - 4):
#   Ethernet0  (QSFP+5, idx 5, lanes 9-12)   → HostB12_1  [KVM NIC1/br-HB121-BL1]
#   Ethernet4  (QSFP+6, idx 6, lanes 13-16)  → HostB12_2  [KVM NIC2/br-HB122-BL1]
#   Ethernet8  (QSFP+7, idx 7, lanes 17-20)  → MonitorSrv [KVM NIC3/br-MON-BL1]
#
# Physical hardware mapping (with 4x10G breakout of QSFP+5):
#   Ethernet0 (lane 9)  → HostB12_1, Ethernet1 (lane 10) → HostB12_2,
#   Ethernet2 (lane 11) → MonitorSrv
downlink_interfaces:
  - port: "Ethernet0"
    alias: "Ethernet5/1"
    lanes: "9,10,11,12"
    index: "5"
    speed: "40000"
    neighbor: "HostB12_1"
    neighbor_port: "enps1"
    neighbor_asn: 65106
    description: "Border_Leaf1 Ethernet0 → HostB12_1 enps1 (QSFP+5 native 40G) [KVM NIC1]"

  - port: "Ethernet4"
    alias: "Ethernet6/1"
    lanes: "13,14,15,16"
    index: "6"
    speed: "40000"
    neighbor: "HostB12_2"
    neighbor_port: "enps1"
    neighbor_asn: 65107
    description: "Border_Leaf1 Ethernet4 → HostB12_2 enps1 (QSFP+6 native 40G) [KVM NIC2]"

  - port: "Ethernet8"
    alias: "Ethernet7/1"
    lanes: "17,18,19,20"
    index: "7"
    speed: "40000"
    neighbor: "MonitorSrv"
    neighbor_port: "enps1"
    neighbor_asn: 65108
    description: "Border_Leaf1 Ethernet8 → MonitorSrv enps1 (QSFP+7 native 40G) [KVM NIC3]"

# ---- Breakout configuration ----
# KVM VS does NOT support breakout — native QSFP+ ports used directly.
# Physical hardware would need: Ethernet0 → 4x10G breakout (lanes 9-12 → sub-ports)
breakout_cfg: {}

# ---- All ports reference ----
all_ports: "{{ qx32s_all_ports }}"
