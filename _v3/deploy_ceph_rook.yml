---
# =============================================================================
# playbooks/reused/deploy_ceph_rook.yml — Deploy Ceph via Rook Operator (K8s)
# =============================================================================
#
# DESCRIPTION:
#   Deploys Ceph Reef (v18) as Kubernetes pods using the Rook-Ceph operator.
#   This is the PREFERRED method for the KVM lab since K8s is already running.
#   Ceph MON, MGR, OSD, and MDS all run as pods in the 'rook-ceph' namespace.
#
# ADVANTAGES OVER CEPHADM:
#   - Native K8s lifecycle (kubectl, Helm, GitOps-ready)
#   - Automatic OSD pod scheduling on nodes with available disks
#   - Self-healing via K8s pod restart policies
#   - Integrated with K8s StorageClass (no manual keyring distribution)
#   - Dashboard accessible via K8s Service/Ingress
#   - Prometheus metrics auto-discovered by kube-prometheus-stack
#
# PREREQUISITES:
#   - Kubernetes cluster operational (kubespray completed)
#   - Block devices available on OSD nodes (/dev/vdb, /dev/vdc in KVM)
#   - preflight_download.yml --tags ceph completed (Rook charts cached)
#   - Helm 3 installed on deployer or K8s controller
#
# USAGE:
#   # Full deployment (operator + cluster + storage classes)
#   ansible-playbook playbooks/reused/deploy_ceph_rook.yml -i inventory/hosts.yml
#
#   # Operator only (installs Rook without creating cluster)
#   ansible-playbook playbooks/reused/deploy_ceph_rook.yml -i inventory/hosts.yml --tags rook_operator
#
#   # Cluster only (assumes operator already deployed)
#   ansible-playbook playbooks/reused/deploy_ceph_rook.yml -i inventory/hosts.yml --tags rook_cluster
#
#   # Validate only
#   ansible-playbook playbooks/reused/deploy_ceph_rook.yml -i inventory/hosts.yml --tags rook_validate
#
#   # Teardown (DESTRUCTIVE — removes all Ceph data)
#   ansible-playbook playbooks/reused/deploy_ceph_rook.yml -i inventory/hosts.yml --tags rook_teardown
#
# INVENTORY GROUPS USED:
#   kube_controllers[0] — Kubectl/Helm execution host
#   ceph_osd            — OSD nodes (for disk preparation)
#
# =============================================================================

# ===========================================================================
# Phase 0: Prepare OSD nodes (wipe disks, load kernel modules)
# ===========================================================================
- name: "Phase 0: Prepare OSD Nodes for Rook"
  hosts: "ceph_osd"
  gather_facts: true
  become: true
  ignore_unreachable: true
  tags: [rook, rook_prepare]
  vars:
    ceph_osd_devices_default:
      - /dev/vdb
      - /dev/vdc
  tasks:
    - name: Load required kernel modules for Ceph
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - rbd
        - ceph

    - name: Persist kernel modules across reboots
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/ceph.conf
        line: "{{ item }}"
        create: true
        mode: "0644"
      loop:
        - rbd
        - ceph

    - name: Install lvm2 (required for Ceph OSD LVM mode)
      ansible.builtin.apt:
        name:
          - lvm2
          - cryptsetup
        state: present
        update_cache: false

    - name: Build OSD device list
      ansible.builtin.set_fact:
        _osd_devices: "{{ ceph_osd_devices | default(ceph_osd_devices_default) }}"

    - name: Wipe OSD devices (full LVM + BlueStore cleanup)
      ansible.builtin.shell:
        cmd: |
          DEV={{ item }}
          DEVNAME=$(basename "$DEV")
          # Check device existence via sysfs (works regardless of DM/LVM state)
          if [ ! -d "/sys/block/$DEVNAME" ]; then
            echo "SKIP (not found): $DEV"
            exit 0
          fi
          # Check if mounted (use findmnt which doesn't choke on stale DM)
          if findmnt -rn -S "$DEV" >/dev/null 2>&1; then
            echo "SKIP (mounted): $DEV"
            exit 0
          fi
          # Remove any stale device-mapper entries (LVM from previous Ceph OSD)
          for dm in $(ls /sys/block/$DEVNAME/holders/ 2>/dev/null); do
            dmsetup remove -f "$dm" 2>/dev/null || true
          done
          # Deactivate any LVM VGs on this device, then remove PV label
          pvs "$DEV" --noheadings -o vg_name 2>/dev/null | while read VG; do
            [ -n "$VG" ] && vgchange -an "$VG" 2>/dev/null || true
            [ -n "$VG" ] && vgremove -f "$VG" 2>/dev/null || true
          done
          pvremove -ff "$DEV" 2>/dev/null || true
          # Wipe all filesystem/RAID/LVM/Ceph signatures
          wipefs -af "$DEV" 2>/dev/null || true
          # Zero first 100MB (GPT, LVM headers, BlueStore superblock)
          dd if=/dev/zero of="$DEV" bs=1M count=100 2>/dev/null || true
          # Zero last 100MB (backup GPT, Ceph BlueStore label at end of device)
          DEV_SIZE=$(blockdev --getsize64 "$DEV" 2>/dev/null || echo 0)
          if [ "$DEV_SIZE" -gt 104857600 ]; then
            dd if=/dev/zero of="$DEV" bs=1M count=100 seek=$(( (DEV_SIZE / 1048576) - 100 )) 2>/dev/null || true
          fi
          sgdisk --zap-all "$DEV" 2>/dev/null || true
          partprobe "$DEV" 2>/dev/null || true
          echo "WIPED: $DEV"
      loop: "{{ _osd_devices }}"
      register: disk_wipe
      changed_when: "'WIPED' in disk_wipe.stdout"
      when: ceph_osd_wipe_disks | default(true)

    - name: Display disk preparation results
      ansible.builtin.debug:
        msg: "{{ disk_wipe.results | default([]) | map(attribute='stdout', default='skipped') | list }}"

    - name: Remove stale Rook state directory
      ansible.builtin.file:
        path: /var/lib/rook
        state: absent

# ===========================================================================
# Phase 1: Deploy Rook-Ceph Operator
# ===========================================================================
- name: "Phase 1: Deploy Rook-Ceph Operator"
  hosts: "kube_controllers[0]"
  gather_facts: true
  become: true
  tags: [rook, rook_operator]
  vars:
    rook_ceph_namespace: "rook-ceph"
    rook_ceph_version: "v1.14.7"
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    cache_helm_dir: "/opt/fabric-cache/helm-charts"
  tasks:
    - name: Check if Helm is available
      ansible.builtin.command: helm version --short
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: helm_version
      changed_when: false

    - name: Create rook-ceph namespace
      ansible.builtin.shell: |
        # Wait if namespace is still terminating from a prior teardown
        for i in $(seq 1 30); do
          STATUS=$(kubectl get ns {{ rook_ceph_namespace }} -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
          if [ "$STATUS" = "NotFound" ] || [ -z "$STATUS" ]; then
            kubectl create namespace {{ rook_ceph_namespace }}
            exit $?
          elif [ "$STATUS" = "Active" ]; then
            echo "Namespace already exists and active"
            exit 0
          fi
          echo "Namespace is $STATUS, waiting..."
          sleep 5
        done
        echo "ERROR: Namespace stuck in Terminating state after 150s"
        exit 1
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: ns_create
      changed_when: "'created' in ns_create.stdout or 'namespace/' in ns_create.stdout"

    - name: Label OSD nodes for Rook scheduling
      ansible.builtin.command: >
        kubectl label node {{ hostvars[item].kube_node_name | default(item | lower) }}
        ceph-osd=enabled storage-node=true --overwrite
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: "{{ groups['ceph_osd'] }}"
      ignore_errors: true
      changed_when: true

    - name: Label MON nodes for Rook scheduling
      ansible.builtin.command: >
        kubectl label node {{ hostvars[item].kube_node_name | default(item | lower) }}
        ceph-mon=enabled --overwrite
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: "{{ groups['ceph_mon'] }}"
      ignore_errors: true
      changed_when: true

    - name: Check for cached Rook operator chart
      ansible.builtin.stat:
        path: "{{ cache_helm_dir }}"
      register: helm_cache_dir

    - name: Find cached rook-ceph chart tarball
      ansible.builtin.find:
        paths: "{{ cache_helm_dir }}"
        patterns: "rook-ceph-*.tgz"
        excludes: "rook-ceph-cluster-*.tgz"
      register: cached_rook_operator
      when: helm_cache_dir.stat.exists | default(false)

    - name: Add Rook Helm repository (if no cached chart)
      ansible.builtin.command: helm repo add rook-release https://charts.rook.io/release
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr
      when: cached_rook_operator.files | default([]) | length == 0

    - name: Update Helm repos (if no cached chart)
      ansible.builtin.command: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      when: cached_rook_operator.files | default([]) | length == 0

    - name: Deploy Rook-Ceph Operator (from cache)
      ansible.builtin.command: >
        helm upgrade --install rook-ceph
        {{ cached_rook_operator.files[0].path }}
        --namespace {{ rook_ceph_namespace }}
        --set crds.enabled=true
        --set csi.enableRbdDriver=true
        --set csi.enableCephfsDriver=true
        --set monitoring.enabled=true
        --set enableDiscoveryDaemon=true
        --wait --timeout 5m0s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when: cached_rook_operator.files | default([]) | length > 0
      register: helm_operator_cached

    - name: Deploy Rook-Ceph Operator (from repo)
      ansible.builtin.command: >
        helm upgrade --install rook-ceph
        rook-release/rook-ceph
        --namespace {{ rook_ceph_namespace }}
        --version {{ rook_ceph_version }}
        --set crds.enabled=true
        --set csi.enableRbdDriver=true
        --set csi.enableCephfsDriver=true
        --set monitoring.enabled=true
        --set enableDiscoveryDaemon=true
        --wait --timeout 5m0s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when:
        - cached_rook_operator.files | default([]) | length == 0
        - helm_operator_cached is skipped
      register: helm_operator_repo

    - name: Wait for Rook operator pod to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=ready pod
        -l app=rook-ceph-operator
        -n {{ rook_ceph_namespace }}
        --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: operator_ready
      changed_when: false

    - name: Display operator status
      ansible.builtin.debug:
        msg: "Rook-Ceph operator is ready in namespace '{{ rook_ceph_namespace }}'"

# ===========================================================================
# Phase 2: Deploy Ceph Cluster (CephCluster CR via Helm)
# ===========================================================================
- name: "Phase 2: Deploy Ceph Cluster via Rook"
  hosts: "kube_controllers[0]"
  gather_facts: true
  become: true
  tags: [rook, rook_cluster]
  vars_files:
    - "../../inventory/group_vars/ceph_mon.yml"
    - "../../inventory/group_vars/ceph_osd.yml"
  vars:
    rook_ceph_namespace: "rook-ceph"
    rook_ceph_version: "v1.14.7"
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    cache_helm_dir: "/opt/fabric-cache/helm-charts"
    ceph_osd_devices_default:
      - /dev/vdb
      - /dev/vdc
  tasks:
    - name: Generate Rook CephCluster values file
      ansible.builtin.template:
        src: "../../roles/ceph/templates/rook-ceph-cluster-values.yml.j2"
        dest: /tmp/rook-ceph-cluster-values.yml
        mode: "0600"

    - name: Find cached rook-ceph-cluster chart tarball
      ansible.builtin.find:
        paths: "{{ cache_helm_dir }}"
        patterns: "rook-ceph-cluster-*.tgz"
      register: cached_rook_cluster
      ignore_errors: true

    - name: Deploy CephCluster (from cache)
      ansible.builtin.command: >
        helm upgrade --install rook-ceph-cluster
        {{ cached_rook_cluster.files[0].path }}
        --namespace {{ rook_ceph_namespace }}
        --values /tmp/rook-ceph-cluster-values.yml
        --timeout 10m0s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when: cached_rook_cluster.files | default([]) | length > 0
      register: helm_cluster_cached

    - name: Deploy CephCluster (from repo)
      ansible.builtin.command: >
        helm upgrade --install rook-ceph-cluster
        rook-release/rook-ceph-cluster
        --namespace {{ rook_ceph_namespace }}
        --values /tmp/rook-ceph-cluster-values.yml
        --version {{ rook_ceph_version }}
        --timeout 10m0s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when:
        - cached_rook_cluster.files | default([]) | length == 0
        - helm_cluster_cached is skipped
      register: helm_cluster_repo

    - name: Clean up values file
      ansible.builtin.file:
        path: /tmp/rook-ceph-cluster-values.yml
        state: absent

    - name: Wait for Ceph MON pods to be ready (5m timeout)
      ansible.builtin.shell: |
        echo "Waiting for MON pods to be created by operator..."
        for i in $(seq 1 60); do
          MON_COUNT=$(kubectl get pods -n {{ rook_ceph_namespace }} -l app=rook-ceph-mon --no-headers 2>/dev/null | wc -l)
          if [ "$MON_COUNT" -ge 1 ]; then
            echo "MON pod found, waiting for ready..."
            kubectl wait --for=condition=ready pod \
              -l app=rook-ceph-mon \
              -n {{ rook_ceph_namespace }} \
              --timeout=120s 2>&1
            exit $?
          fi
          sleep 5
        done
        echo "WARNING: No MON pods created after 5 minutes — operator may still be initializing"
        exit 0
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: mon_ready
      changed_when: false

    - name: Wait for Ceph OSD pods to be ready (10m timeout)
      ansible.builtin.shell: |
        echo "Waiting for OSD prepare jobs or OSD pods (up to 10 min)..."
        for i in $(seq 1 120); do
          # Check for running OSD pods
          OSD_PODS=$(kubectl get pods -n {{ rook_ceph_namespace }} -l app=rook-ceph-osd --no-headers 2>/dev/null | wc -l)
          if [ "$OSD_PODS" -ge 1 ]; then
            echo "OSD pods found ($OSD_PODS), waiting for ready..."
            kubectl wait --for=condition=ready pod \
              -l app=rook-ceph-osd \
              -n {{ rook_ceph_namespace }} \
              --timeout=300s 2>&1
            exit $?
          fi
          # Check if prepare jobs are running (good sign — means discovery is working)
          PREP_PODS=$(kubectl get pods -n {{ rook_ceph_namespace }} -l app=rook-ceph-osd-prepare --no-headers 2>/dev/null | wc -l)
          if [ "$PREP_PODS" -ge 1 ]; then
            echo "OSD prepare job(s) running ($PREP_PODS) — waiting for completion..."
          fi
          sleep 5
        done
        echo "WARNING: No OSD pods created after 10 minutes"
        echo "Check operator logs: kubectl logs -n {{ rook_ceph_namespace }} -l app=rook-ceph-operator --tail=50"
        exit 0
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: osd_ready
      retries: 2
      delay: 60
      until: osd_ready.rc == 0
      changed_when: false

    - name: Display cluster deployment status
      ansible.builtin.debug:
        msg: |
          Ceph cluster deployed in '{{ rook_ceph_namespace }}' namespace
          MON pods: {{ mon_ready.stdout | default('ready') }}
          OSD pods: {{ osd_ready.stdout | default('ready') }}

    - name: Diagnose OSD failure (operator logs)
      ansible.builtin.shell: |
        echo "=== OSD-related operator log entries ==="
        kubectl logs -n {{ rook_ceph_namespace }} -l app=rook-ceph-operator --tail=100 2>/dev/null | grep -iE 'osd|provision|device|skipp|avail|reject' | tail -30
        echo ""
        echo "=== OSD prepare job/pod status ==="
        kubectl get pods -n {{ rook_ceph_namespace }} -l app=rook-ceph-osd-prepare -o wide 2>/dev/null || echo "(none)"
        echo ""
        echo "=== Discovery daemon device report (first node) ==="
        DISCOVER_POD=$(kubectl get pods -n {{ rook_ceph_namespace }} -l app=rook-discover -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -n "$DISCOVER_POD" ]; then
          kubectl logs -n {{ rook_ceph_namespace }} "$DISCOVER_POD" --tail=30 2>/dev/null | grep -iE 'device|available|skipp|reject' || echo "(no device lines)"
        fi
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: osd_diag
      changed_when: false
      when: "'WARNING' in osd_ready.stdout"

    - name: Show OSD diagnostics
      ansible.builtin.debug:
        msg: "{{ osd_diag.stdout_lines | default(['OSD pods came up successfully']) }}"
      when: osd_diag is not skipped

# ===========================================================================
# Phase 3: Expose Ceph Dashboard (LoadBalancer via MetalLB + credentials)
# ===========================================================================
- name: "Phase 3: Expose Ceph Dashboard"
  hosts: "kube_controllers[0]"
  gather_facts: false
  become: true
  tags: [rook, rook_dashboard]
  vars:
    rook_ceph_namespace: "rook-ceph"
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    ceph_dashboard_service_type: "{{ ceph_dashboard_svc_type | default('LoadBalancer') }}"
  tasks:
    - name: Wait for MGR pod to be ready (creates dashboard service)
      ansible.builtin.shell: |
        echo "Waiting for MGR pod (up to 5 min)..."
        for i in $(seq 1 60); do
          MGR_READY=$(kubectl get pods -n {{ rook_ceph_namespace }} -l app=rook-ceph-mgr --no-headers 2>/dev/null | grep -c Running || true)
          if [ "$MGR_READY" -ge 1 ]; then
            echo "MGR pod is running"
            exit 0
          fi
          sleep 5
        done
        echo "ERROR: MGR pod not ready after 5 minutes"
        exit 1
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: mgr_wait
      changed_when: false

    - name: Wait for dashboard service to be created
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          if kubectl get svc rook-ceph-mgr-dashboard -n {{ rook_ceph_namespace }} 2>/dev/null; then
            exit 0
          fi
          sleep 5
        done
        echo "ERROR: Dashboard service not created after 150s"
        exit 1
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: svc_wait
      changed_when: false

    - name: Patch dashboard service to LoadBalancer (MetalLB assigns external IP)
      ansible.builtin.shell: |
        kubectl patch svc rook-ceph-mgr-dashboard -n {{ rook_ceph_namespace }} \
          -p '{"spec":{"type":"{{ ceph_dashboard_service_type }}","ports":[{"port":8443,"protocol":"TCP","name":"https-dashboard"}]}}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: dashboard_patch
      changed_when: "'patched' in dashboard_patch.stdout or 'configured' in dashboard_patch.stdout"
      ignore_errors: true

    - name: Retrieve dashboard admin password
      ansible.builtin.shell: |
        kubectl get secret rook-ceph-dashboard-password \
          -n {{ rook_ceph_namespace }} \
          -o jsonpath='{.data.password}' | base64 -d
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: dashboard_password
      changed_when: false
      no_log: true

    - name: Wait for LoadBalancer IP assignment (MetalLB)
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          LB_IP=$(kubectl get svc rook-ceph-mgr-dashboard -n {{ rook_ceph_namespace }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$LB_IP" ]; then
            echo "$LB_IP"
            exit 0
          fi
          sleep 5
        done
        echo "WARN: No LB IP after 150s — MetalLB may not be ready"
        exit 0
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: dashboard_lb_ip
      changed_when: false
      ignore_errors: true

    - name: Get dashboard service external endpoint
      ansible.builtin.shell: |
        LB_IP=$(kubectl get svc rook-ceph-mgr-dashboard -n {{ rook_ceph_namespace }} \
          -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
        if [ -n "$LB_IP" ]; then
          echo "$LB_IP:8443"
        else
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          NODE_PORT=$(kubectl get svc rook-ceph-mgr-dashboard -n {{ rook_ceph_namespace }} \
            -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo '8443')
          echo "$NODE_IP:$NODE_PORT (fallback — MetalLB IP not assigned)"
        fi
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: dashboard_endpoint
      changed_when: false

    - name: Display dashboard access information
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════╗
          ║              CEPH DASHBOARD ACCESS INFORMATION                   ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║ URL:      https://{{ dashboard_endpoint.stdout }}
          ║ Username: admin
          ║ Password: {{ dashboard_password.stdout }}
          ║
          ║ Service type: {{ ceph_dashboard_service_type }}
          ║ MetalLB IP:   {{ dashboard_lb_ip.stdout | default('pending') }}
          ║
          ║ NOTE: Uses self-signed TLS certificate — accept browser warning.
          ║ Accessible from any host on the fabric (MetalLB BGP /32 route).
          ╚══════════════════════════════════════════════════════════════════╝

# ===========================================================================
# Phase 4: Validate Ceph Cluster Health
# ===========================================================================
- name: "Phase 4: Validate Rook-Ceph Cluster"
  hosts: "kube_controllers[0]"
  gather_facts: false
  become: true
  tags: [rook, rook_validate]
  vars:
    rook_ceph_namespace: "rook-ceph"
    kubeconfig_path: "/etc/kubernetes/admin.conf"
  tasks:
    - name: Get Ceph cluster status via toolbox
      ansible.builtin.shell: |
        TOOLBOX=$(kubectl get pod -n {{ rook_ceph_namespace }} -l app=rook-ceph-tools -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "$TOOLBOX" ]; then
          echo "Toolbox pod not found — using direct kubectl exec on operator"
          OPERATOR=$(kubectl get pod -n {{ rook_ceph_namespace }} -l app=rook-ceph-operator -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n {{ rook_ceph_namespace }} "$OPERATOR" -- ceph -s 2>/dev/null || echo "Cannot reach ceph from operator pod"
        else
          kubectl exec -n {{ rook_ceph_namespace }} "$TOOLBOX" -- ceph -s
        fi
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: ceph_status
      changed_when: false
      ignore_errors: true

    - name: Get Ceph OSD tree
      ansible.builtin.shell: |
        TOOLBOX=$(kubectl get pod -n {{ rook_ceph_namespace }} -l app=rook-ceph-tools -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -n "$TOOLBOX" ]; then
          kubectl exec -n {{ rook_ceph_namespace }} "$TOOLBOX" -- ceph osd tree
        fi
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: osd_tree
      changed_when: false
      ignore_errors: true

    - name: Get all pods in rook-ceph namespace
      ansible.builtin.command: >
        kubectl get pods -n {{ rook_ceph_namespace }} -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: rook_pods
      changed_when: false

    - name: Get StorageClasses
      ansible.builtin.command: kubectl get sc
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: storage_classes
      changed_when: false

    - name: Print Ceph Health Report
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════╗
          ║              ROOK-CEPH CLUSTER HEALTH REPORT                    ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║ Namespace: {{ rook_ceph_namespace }}
          ╠══════════════════════════════════════════════════════════════════╣
          ║ Cluster Status:
          {{ ceph_status.stdout | default('Status unavailable — cluster may still be initializing') }}
          ╠══════════════════════════════════════════════════════════════════╣
          ║ OSD Tree:
          {{ osd_tree.stdout | default('OSD tree unavailable') }}
          ╠══════════════════════════════════════════════════════════════════╣
          ║ Pods:
          {{ rook_pods.stdout }}
          ╠══════════════════════════════════════════════════════════════════╣
          ║ StorageClasses:
          {{ storage_classes.stdout }}
          ╚══════════════════════════════════════════════════════════════════╝

    - name: Verify ceph-rbd StorageClass exists
      ansible.builtin.command: kubectl get sc ceph-rbd
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: sc_check
      changed_when: false
      failed_when: sc_check.rc != 0 and rook_pods.stdout != ''

    - name: Test PVC creation with ceph-rbd StorageClass
      ansible.builtin.command: >
        kubectl apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ceph-rbd-test-pvc
            namespace: {{ rook_ceph_namespace }}
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: ceph-rbd
            resources:
              requests:
                storage: 1Gi
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: test_pvc
      changed_when: true
      when: sc_check.rc == 0

    - name: Wait for test PVC to bind (60s)
      ansible.builtin.shell: |
        kubectl wait --for=jsonpath='{.status.phase}'=Bound \
          pvc/ceph-rbd-test-pvc -n {{ rook_ceph_namespace }} --timeout=60s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: pvc_bound
      changed_when: false
      ignore_errors: true
      when: sc_check.rc == 0

    - name: Clean up test PVC
      ansible.builtin.command: >
        kubectl delete pvc ceph-rbd-test-pvc -n {{ rook_ceph_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: Final validation summary
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════
          VALIDATION RESULT:
            StorageClass: {{ 'PASS' if sc_check.rc == 0 else 'FAIL' }}
            PVC Binding:  {{ 'PASS' if pvc_bound.rc | default(1) == 0 else 'PENDING (cluster initializing)' }}
          ════════════════════════════════════════════════

# ===========================================================================
# Phase 5: Teardown (DESTRUCTIVE — requires explicit tag)
# ===========================================================================
# This phase performs a COMPLETE removal of Rook-Ceph, including:
#   - Helm releases (cluster + operator)
#   - All Ceph CRs with finalizer stripping (prevents namespace hang)
#   - All pods force-deleted (prevents graceful shutdown waiting on dead MONs)
#   - CRDs removed (cluster-scoped)
#   - Namespace force-finalized (handles stuck Terminating state)
#   - Stale StorageClasses cleaned up
#   - OSD disks fully wiped (LVM PV labels, BlueStore superblock, GPT)
#   - /var/lib/rook removed on all nodes
#
# USAGE:
#   ansible-playbook playbooks/reused/deploy_ceph_rook.yml \
#     -i inventory/hosts.yml --tags rook_teardown -v
# ===========================================================================
- name: "Phase 5: Teardown Rook-Ceph (DESTRUCTIVE)"
  hosts: "kube_controllers[0]"
  gather_facts: false
  become: true
  tags: [rook_teardown, never]
  vars:
    rook_ceph_namespace: "rook-ceph"
    kubeconfig_path: "/etc/kubernetes/admin.conf"
  tasks:
    - name: "TEARDOWN | Delete CephCluster Helm release"
      ansible.builtin.command: >
        helm uninstall rook-ceph-cluster -n {{ rook_ceph_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      ignore_errors: true
      changed_when: true

    - name: "TEARDOWN | Delete Rook operator Helm release"
      ansible.builtin.command: >
        helm uninstall rook-ceph -n {{ rook_ceph_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      ignore_errors: true
      changed_when: true

    - name: "TEARDOWN | Strip finalizers from ALL Rook custom resources"
      ansible.builtin.shell: |
        RESOURCES="cephcluster cephblockpool cephfilesystem cephobjectstore
                   cephfilesystemsubvolumegroup cephclient cephnfs
                   cephobjectstoreuser cephobjectrealm cephobjectzonegroup
                   cephobjectzone cephrbdmirror cephfilesystemmirror
                   cephblockpoolradosnamespace cephbucketnotification
                   cephbuckettopic"
        for resource in $RESOURCES; do
          for item in $(kubectl get $resource -n {{ rook_ceph_namespace }} -o name 2>/dev/null); do
            kubectl patch $item -n {{ rook_ceph_namespace }} --type merge \
              -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
          done
        done
        echo "All finalizers stripped"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Delete all Ceph CRs"
      ansible.builtin.shell: |
        for resource in cephcluster cephblockpool cephfilesystem cephobjectstore \
                        cephfilesystemsubvolumegroup cephclient cephnfs; do
          kubectl delete $resource --all -n {{ rook_ceph_namespace }} --timeout=10s 2>/dev/null || true
        done
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Force-delete all pods in rook-ceph namespace"
      ansible.builtin.shell: |
        kubectl delete pods --all -n {{ rook_ceph_namespace }} \
          --force --grace-period=0 2>/dev/null || true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Delete OSD prepare jobs"
      ansible.builtin.shell: |
        kubectl delete job -n {{ rook_ceph_namespace }} \
          -l app=rook-ceph-osd-prepare 2>/dev/null || true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Delete Rook-managed StorageClasses"
      ansible.builtin.shell: |
        for sc in ceph-rbd ceph-filesystem ceph-bucket ceph-infra-rbd; do
          kubectl delete storageclass "$sc" 2>/dev/null || true
        done
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Delete all Rook CRDs"
      ansible.builtin.shell: |
        kubectl get crd -o name 2>/dev/null | grep -E 'rook|objectbucket' | \
          xargs -r kubectl delete 2>/dev/null || true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Delete namespace (may hang if finalizers stuck)"
      ansible.builtin.shell: |
        kubectl delete namespace {{ rook_ceph_namespace }} --timeout=60s 2>/dev/null || true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      ignore_errors: true
      changed_when: true

    - name: "TEARDOWN | Force-finalize namespace if stuck in Terminating"
      ansible.builtin.shell: |
        for i in $(seq 1 24); do
          STATUS=$(kubectl get ns {{ rook_ceph_namespace }} -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
          if [ "$STATUS" = "NotFound" ] || [ -z "$STATUS" ]; then
            echo "Namespace gone"
            exit 0
          fi
          if [ "$STATUS" = "Terminating" ]; then
            # Force-remove namespace finalizers via API
            kubectl get ns {{ rook_ceph_namespace }} -o json | \
              python3 -c 'import json,sys; ns=json.load(sys.stdin); ns["spec"]["finalizers"]=[]; print(json.dumps(ns))' | \
              kubectl replace --raw "/api/v1/namespaces/{{ rook_ceph_namespace }}/finalize" -f - 2>/dev/null || true
          fi
          sleep 5
        done
        # Final check
        if kubectl get ns {{ rook_ceph_namespace }} 2>/dev/null; then
          echo "WARNING: Namespace still exists after 120s"
          exit 1
        fi
        echo "Namespace removed"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      ignore_errors: true

    - name: "TEARDOWN | Remove node labels"
      ansible.builtin.shell: |
        for node in $(kubectl get nodes -o name); do
          kubectl label $node ceph-osd- ceph-mon- storage-node- 2>/dev/null || true
        done
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Clean up Ceph secrets in other namespaces"
      ansible.builtin.shell: |
        kubectl delete secret ceph-infra-rbd-secret -n sheba-cloud-infra 2>/dev/null || true
        kubectl delete secret ceph-infra-rbd-admin-secret -n sheba-cloud-infra 2>/dev/null || true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | K8s cleanup complete"
      ansible.builtin.debug:
        msg: "Rook-Ceph fully removed from Kubernetes. Wiping OSD disks next..."

# Phase 5b: Wipe OSD disks on all ceph_osd nodes
- name: "Phase 5b: Wipe OSD Disks on All Nodes (DESTRUCTIVE)"
  hosts: "ceph_osd"
  gather_facts: false
  become: true
  tags: [rook_teardown, never]
  vars:
    ceph_osd_devices_default:
      - /dev/vdb
      - /dev/vdc
  tasks:
    - name: "TEARDOWN | Build device list"
      ansible.builtin.set_fact:
        _osd_devices: "{{ ceph_osd_devices | default(ceph_osd_devices_default) }}"

    - name: "TEARDOWN | Full disk wipe (LVM + BlueStore + GPT)"
      ansible.builtin.shell: |
        DEV={{ item }}
        DEVNAME=$(basename "$DEV")
        [ -b "$DEV" ] || { echo "SKIP (not found): $DEV"; exit 0; }
        # Remove device-mapper entries held by this device
        for dm in $(ls /sys/block/$DEVNAME/holders/ 2>/dev/null); do
          dmsetup remove -f "$dm" 2>/dev/null || true
        done
        # Deactivate LVM VGs, then remove PV label
        pvs "$DEV" --noheadings -o vg_name 2>/dev/null | while read VG; do
          [ -n "$VG" ] && vgchange -an "$VG" 2>/dev/null || true
          [ -n "$VG" ] && vgremove -f "$VG" 2>/dev/null || true
        done
        pvremove -ff "$DEV" 2>/dev/null || true
        # Wipe ALL signatures (filesystem, RAID, LVM, Ceph BlueStore)
        wipefs -af "$DEV" 2>/dev/null || true
        # Zero first 100MB (GPT header, LVM PV header, BlueStore superblock)
        dd if=/dev/zero of="$DEV" bs=1M count=100 2>/dev/null || true
        # Zero last 100MB (backup GPT, BlueStore label at end of device)
        DEV_SIZE=$(blockdev --getsize64 "$DEV" 2>/dev/null || echo 0)
        if [ "$DEV_SIZE" -gt 104857600 ]; then
          dd if=/dev/zero of="$DEV" bs=1M count=100 \
            seek=$(( (DEV_SIZE / 1048576) - 100 )) 2>/dev/null || true
        fi
        # Zap GPT/MBR partition table
        sgdisk --zap-all "$DEV" 2>/dev/null || true
        partprobe "$DEV" 2>/dev/null || true
        echo "WIPED: $DEV"
      loop: "{{ _osd_devices }}"
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Remove ALL device-mapper entries"
      ansible.builtin.shell: |
        dmsetup remove_all 2>/dev/null || true
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Remove Rook data directory"
      ansible.builtin.file:
        path: /var/lib/rook
        state: absent

    - name: "TEARDOWN | Remove Ceph data directories"
      ansible.builtin.shell: |
        rm -rf /var/lib/ceph 2>/dev/null || true
        rm -rf /etc/ceph 2>/dev/null || true
      changed_when: true
      ignore_errors: true

    - name: "TEARDOWN | Complete"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  TEARDOWN COMPLETE — Ceph fully removed from this cluster   ║
          ╠══════════════════════════════════════════════════════════════╣
          ║  • Helm releases removed                                    ║
          ║  • All Ceph CRs + finalizers stripped                       ║
          ║  • All pods force-deleted                                   ║
          ║  • CRDs deleted                                             ║
          ║  • Namespace force-finalized                                ║
          ║  • StorageClasses removed                                   ║
          ║  • Node labels cleaned                                      ║
          ║  • OSD disks fully wiped (pvremove + wipefs + zero + sgdisk)║
          ║  • /var/lib/rook + /var/lib/ceph + /etc/ceph removed        ║
          ║                                                             ║
          ║  Ready for fresh deploy:                                    ║
          ║    ansible-playbook playbooks/reused/deploy_ceph_rook.yml \ ║
          ║      -i inventory/hosts.yml -v                              ║
          ╚══════════════════════════════════════════════════════════════╝
