---
# =============================================================================
# sonic_server_net/tasks/main.yml — Server-side Network + FRR Configuration
# =============================================================================
# Configures compute server fabric-facing interfaces, loopback, and FRR BGP
# peering back to dual-homed leaf switches.
#
# Enhanced from _v2 with: explicit validation, profile-conditional interface
# selection, netplan support (Ubuntu 22.04+), and idempotency checks.
# =============================================================================

- name: "Server-Net | Validate required variables"
  ansible.builtin.assert:
    that:
      - server_asn is defined
      - server_router_id is defined
      - server_loopback_ip is defined
      - (server_interfaces_kvm is defined) or (server_interfaces_real is defined) or (server_interfaces is defined)
    fail_msg: >-
      Missing server networking vars. Ensure host_vars defines:
      server_asn, server_router_id, server_loopback_ip, and
      server_interfaces_kvm/server_interfaces_real (or server_interfaces).
  tags: [validate]

- name: "Server-Net | Resolve interface list (profile-conditional)"
  ansible.builtin.set_fact:
    _server_interfaces: "{{ server_interfaces_real if (automation_profile | default('') == 'real_hardware' and server_interfaces_real is defined) else server_interfaces_kvm }}"
  when: server_interfaces_kvm is defined or server_interfaces_real is defined
  tags: [resolve, verify]

- name: "Server-Net | Fallback to unified server_interfaces"
  ansible.builtin.set_fact:
    _server_interfaces: "{{ server_interfaces }}"
  when: _server_interfaces is not defined and server_interfaces is defined
  tags: [resolve, verify]

- name: "Server-Net | Validate resolved interfaces"
  ansible.builtin.assert:
    that:
      - _server_interfaces is defined
      - _server_interfaces | length > 0
    fail_msg: "No server interfaces resolved. Check host_vars interface definitions."
  tags: [validate]

# ---------------------------------------------------------------------------
# Auto-detect actual fabric interface names (KVM uses predictable naming)
# The management interface (ansible_default_ipv4.interface) is excluded.
# Remaining non-lo interfaces are mapped to _server_interfaces in order.
# ---------------------------------------------------------------------------
- name: "Server-Net | Detect non-management interfaces"
  ansible.builtin.set_fact:
    _detected_fabric_ifaces: >-
      {{ ansible_interfaces
         | reject('equalto', 'lo')
         | reject('equalto', ansible_default_ipv4.interface | default(''))
         | reject('match', '^docker|^br-|^veth|^virbr|^tun|^tap|^bond|^dummy')
         | sort | list }}
  tags: [resolve, verify]

- name: "Server-Net | Remap interface list to actual device names"
  ansible.builtin.set_fact:
    _server_interfaces: "{{ _remapped | from_json }}"
  vars:
    _remapped: >-
      [{% for i in range([_server_interfaces | length, _detected_fabric_ifaces | length] | min) %}
      {{ _server_interfaces[i] | combine({'name': _detected_fabric_ifaces[i]}) | to_json }}{% if not loop.last %},{% endif %}
      {% endfor %}{% for i in range(_detected_fabric_ifaces | length, _server_interfaces | length) %},
      {{ _server_interfaces[i] | to_json }}
      {% endfor %}]
  when: _detected_fabric_ifaces | length > 0
  tags: [resolve, verify]

- name: "Server-Net | Show resolved fabric interfaces"
  ansible.builtin.debug:
    msg: "{{ item.name }} → {{ item.neighbor }} (peer AS{{ item.peer_asn }})"
  loop: "{{ _server_interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [resolve]

- name: "Server-Net | Configure loopback address for BGP"
  ansible.builtin.command:
    cmd: "ip addr replace {{ server_loopback_ip }} dev lo"
  become: true
  changed_when: true
  tags: [configure]

- name: "Server-Net | Bring up fabric interfaces with MTU 9000"
  ansible.builtin.shell:
    cmd: |
      ip link set {{ item.name }} up
      ip link set {{ item.name }} mtu 9000
  become: true
  loop: "{{ _server_interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  tags: [configure]

- name: "Server-Net | Enable IPv6 and IP forwarding on fabric interfaces"
  ansible.builtin.sysctl:
    name: "{{ item.0 }}"
    value: "{{ item.1 }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - ['net.ipv4.ip_forward', '1']
    - ['net.ipv6.conf.all.forwarding', '1']
    - ['net.ipv6.conf.all.disable_ipv6', '0']
    - ['net.ipv6.conf.default.disable_ipv6', '0']
  loop_control:
    label: "{{ item.0 }}={{ item.1 }}"
  become: true
  tags: [configure]

- name: "Server-Net | Ensure IPv6 enabled on each fabric interface"
  ansible.builtin.sysctl:
    name: "net.ipv6.conf.{{ item.name }}.disable_ipv6"
    value: '0'
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ _server_interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  tags: [configure]

- name: "Server-Net | Remove conflicting netplan bond config (KVM uses individual links)"
  ansible.builtin.file:
    path: "/etc/netplan/{{ item }}"
    state: absent
  loop:
    - 01-fabric-config.yaml
    - 20-fabric.yaml
  become: true
  when: is_kvm | default(false) | bool
  notify: restart_networking
  tags: [configure]

- name: "Server-Net | Write netplan config for fabric interfaces (persistence)"
  ansible.builtin.copy:
    dest: /etc/netplan/60-fabric-bgp.yaml
    mode: '0600'
    content: |
      # Managed by Ansible (sonic_server_net role) — do not edit
      network:
        version: 2
        renderer: networkd
        ethernets:
      {% for iface in _server_interfaces %}
          {{ iface.name }}:
            dhcp4: false
            dhcp6: false
            mtu: 9000
            link-local: [ipv6]
            ipv6-address-generation: eui64
            accept-ra: false
      {% endfor %}
  become: true
  notify: restart_networking
  tags: [configure]

- name: "Server-Net | Install FRR if not present"
  ansible.builtin.apt:
    name: frr
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [install]

- name: "Server-Net | Enable BGP daemon in FRR daemons config"
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: '^bgpd='
    line: 'bgpd=yes'
  become: true
  notify: restart_frr
  tags: [configure]

- name: "Server-Net | Deploy FRR configuration"
  ansible.builtin.template:
    src: server_frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: '0640'
    backup: true
  become: true
  notify: restart_frr
  tags: [configure]

- name: "Server-Net | Ensure FRR is enabled and running"
  ansible.builtin.systemd:
    name: frr
    enabled: true
    state: started
  become: true
  tags: [configure]

- name: "Server-Net | Verify loopback is up"
  ansible.builtin.command:
    cmd: "ip addr show lo"
  register: lo_check
  changed_when: false
  failed_when: server_router_id not in lo_check.stdout
  tags: [verify]

- name: "Server-Net | Verify fabric interfaces are UP"
  ansible.builtin.command:
    cmd: "ip link show {{ item.name }}"
  loop: "{{ _server_interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  register: iface_check
  changed_when: false
  failed_when: "'state UP' not in iface_check.stdout"
  ignore_errors: true
  tags: [verify]

# =========================================================================
# Post-handler BGP stabilization (runs after all handlers complete)
# =========================================================================
- name: "Server-Net | Pause for IPv6 link-local and networking stabilization"
  ansible.builtin.pause:
    seconds: 3
  tags: [verify]

- name: "Server-Net | Final FRR restart to establish BGP sessions"
  ansible.builtin.systemd:
    name: frr
    state: restarted
  become: true
  tags: [verify]

- name: "Server-Net | Pause for BGP to establish"
  ansible.builtin.pause:
    seconds: 2
  tags: [verify]

- name: "Server-Net | Verify BGP sessions (should be Established or Connect→Active)"
  ansible.builtin.shell:
    cmd: "sudo vtysh -c 'show bgp summary' | grep -A 20 'Neighbor'"
  register: bgp_status
  changed_when: false
  failed_when: false
  become: true
  tags: [verify]

- name: "Server-Net | Display BGP neighbor status"
  ansible.builtin.debug:
    msg: |
      BGP Neighbor Summary:
      {{ bgp_status.stdout }}
  tags: [verify]
