---
# sonic_fabric/tasks/verify.yml
# Post-deployment verification for fabric integration.
# Checks: interfaces up, BGP sessions established, LLDP neighbors visible.

# bgpd takes 15-30s after bgp container restart to finish loading FRR config.
# During that time it can trigger a second sshd restart on a resource-
# constrained KVM VS. Kill any dead ControlMaster socket and wait for a
# fresh stable connection before running any show commands.
- name: "verify | Set unified interface list"
  ansible.builtin.set_fact:
    _fabric_links: >-
      {{
        (fabric_interfaces | default([]))
        + (uplink_interfaces | default([]))
        + (exit_interfaces | default([]))
        + (downlink_interfaces | default([]))
      }}
  tags: [verify, fabric]

- name: "verify | Fail if no fabric interfaces are defined"
  ansible.builtin.fail:
    msg: >-
      No fabric interfaces are defined for {{ inventory_hostname }}.
      Check host_vars fabric_interfaces/uplink_interfaces/exit_interfaces/downlink_interfaces.
  when: _fabric_links | length == 0
  tags: [verify, fabric]

- name: "verify | Kill stale ControlMaster socket before verify"
  ansible.builtin.shell:
    cmd: >
      ssh -o ControlPath=/tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
          -O stop {{ ansible_host }} 2>/dev/null || true;
      rm -f /tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
      /tmp/ansible-ssh-{{ ansible_host }}-22-admin 2>/dev/null || true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  changed_when: false
  tags: [verify, fabric]

- name: "verify | Reset connection cache before verify"
  ansible.builtin.meta: reset_connection

- name: "verify | Wait for SSH port 22 before verify"
  ansible.builtin.shell: |
    for i in $(seq 1 24); do
      output=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=5 -o BatchMode=yes -o LogLevel=ERROR \
               {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1)
      rc=$?
      if [ $rc -eq 0 ] || echo "$output" | grep -qi "permission denied"; then
        echo "PORT_OPEN"
        exit 0
      fi
      sleep 5
    done
    echo "TIMEOUT after 120s waiting for {{ ansible_host }}:22"
    exit 1
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  register: _port_check_verify
  changed_when: false
  failed_when: "'PORT_OPEN' not in _port_check_verify.stdout"
  tags: [verify, fabric]

- name: "verify | Re-establish SSH before verify"
  ansible.builtin.wait_for_connection:
    delay: 0
    timeout: 60
    sleep: 5
  tags: [verify, fabric]

# bgpd continues loading FRR config and allocating memory for 30-90s after
# the container becomes 'active'. Poll until bgp + swss + syncd are all
# active AND stable (command exits 0 three times in a row via retries+until),
# which means the memory spike has passed and sshd is not about to bounce.
- name: "verify | Wait for bgp + swss + syncd to stabilize"
  ansible.builtin.command: >
    bash -c 'systemctl is-active bgp swss syncd 2>&1'
  register: _verify_svc
  changed_when: false
  retries: 18
  delay: 10
  until: (_verify_svc.rc | default(-1)) == 0
  failed_when: (_verify_svc.rc | default(-1)) != 0
  tags: [verify, fabric]

# Extra guard: even after services are active, a stale ControlMaster from
# before the service-gate delay may have been killed by sshd. Refresh it.
- name: "verify | Kill stale ControlMaster after stability gate"
  ansible.builtin.shell:
    cmd: >
      ssh -o ControlPath=/tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
          -O stop {{ ansible_host }} 2>/dev/null || true;
      rm -f /tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
      /tmp/ansible-ssh-{{ ansible_host }}-22-admin 2>/dev/null || true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  changed_when: false
  tags: [verify, fabric]

- name: "verify | Reset connection after stability gate"
  ansible.builtin.meta: reset_connection

- name: "verify | Re-establish SSH after stability gate"
  ansible.builtin.wait_for_connection:
    delay: 0
    timeout: 60
    sleep: 5
  tags: [verify, fabric]

- name: "verify | Check fabric port admin status"
  ansible.builtin.shell: |
    sonic-db-cli CONFIG_DB hget "PORT|{{ item.port }}" admin_status 2>/dev/null || echo "unknown"
  loop: "{{ _fabric_links }}"
  loop_control:
    label: "{{ item.port }}"
  register: _port_admin_status
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: 3
  delay: 10
  until: not (_port_admin_status.unreachable | default(false))
  tags: [verify, fabric]

# Query APPL_DB directly for live operational status — avoids the brittle
# 'show interfaces status | awk' approach that extracts the wrong column
# (Asym PFC / $NF) instead of the Oper column.
- name: "verify | Check fabric port oper status"
  ansible.builtin.shell: |
    sonic-db-cli APPL_DB hget "PORT_TABLE:{{ item.port }}" oper_status 2>/dev/null || echo "unknown"
  loop: "{{ _fabric_links }}"
  loop_control:
    label: "{{ item.port }}"
  register: _port_oper_status
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: 3
  delay: 10
  until: not (_port_oper_status.unreachable | default(false))
  tags: [verify, fabric]

- name: "verify | Report port status"
  ansible.builtin.debug:
    msg: >-
      {{ item.0.item.port }}
      admin={{ item.0.stdout | default('unknown') | trim }}
      oper={{ item.1.stdout | default('unknown') | trim }}
      {{ '✓ LINK UP' if (item.1.stdout | default('') | trim) == 'up' else '✗ LINK DOWN' }}
      {{ '— check KVM virtual bridge connecting this port to its peer' if (item.1.stdout | default('') | trim) != 'up' else '' }}
  loop: "{{ _port_admin_status.results | zip(_port_oper_status.results) | list }}"
  loop_control:
    label: "{{ item.0.item.port }}"
  tags: [verify, fabric]

# If any fabric port is oper=down, dump extended interface info to help the
# operator identify whether the issue is KVM bridge (no carrier) or SONiC
# config (wrong speed/breakout). BGP cannot establish on a down interface.
- name: "verify | Dump port detail when oper=down (KVM bridge diagnostic)"
  ansible.builtin.shell: |
    echo "=== PORT_TABLE:{{ item.item.port }} (APPL_DB) ==="
    sonic-db-cli APPL_DB hgetall "PORT_TABLE:{{ item.item.port }}" 2>/dev/null
    echo "=== PORT|{{ item.item.port }} (CONFIG_DB) ==="
    sonic-db-cli CONFIG_DB hgetall "PORT|{{ item.item.port }}" 2>/dev/null
    echo "=== FRR interface {{ item.item.port }} ==="
    docker exec bgp vtysh -c "show interface {{ item.item.port }}" 2>/dev/null | head -20
  loop: "{{ _port_oper_status.results }}"
  loop_control:
    label: "{{ item.item.port }}"
  when: (item.stdout | default('') | trim) != 'up'
  register: _port_diag
  changed_when: false
  failed_when: false
  tags: [verify, fabric]

- name: "verify | Show port diagnostic output"
  ansible.builtin.debug:
    msg: "{{ item.stdout | default('(no output)') }}"
  loop: "{{ _port_diag.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.port }}"
  when: not (item.skipped | default(false))
  tags: [verify, fabric]

- name: "verify | Check BGP session summary"
  ansible.builtin.shell: |
    timeout 15 docker exec bgp vtysh -c "show bgp summary json" 2>/dev/null
  register: _bgp_summary
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: 3
  delay: 10
  until: not (_bgp_summary.unreachable | default(false))
  tags: [verify, fabric]

- name: "verify | Parse BGP session state"
  ansible.builtin.set_fact:
    _bgp_data: "{{ _bgp_summary.stdout | from_json }}"
  when: _bgp_summary.rc == 0 and _bgp_summary.stdout | length > 2
  failed_when: false
  tags: [verify, fabric]

- name: "verify | Report BGP neighbor states"
  ansible.builtin.debug:
    msg: |
      BGP Summary for {{ hostname }} (AS {{ bgp_local_asn }}):
      {% if _bgp_data is defined and _bgp_data.ipv4Unicast is defined %}
      {% for peer, info in (_bgp_data.ipv4Unicast.peers | default({})).items() %}
        {{ peer }}: state={{ info.state | default('unknown') }}, pfxRcd={{ info.pfxRcd | default(0) }}
      {% endfor %}
      {% elif _bgp_data is defined and _bgp_data.ipv6Unicast is defined %}
      {% for peer, info in (_bgp_data.ipv6Unicast.peers | default({})).items() %}
        {{ peer }}: state={{ info.state | default('unknown') }}, pfxRcd={{ info.pfxRcd | default(0) }}
      {% endfor %}
      {% else %}
        No BGP peers found yet (may need time to establish)
      {% endif %}
  tags: [verify, fabric]

# ---- BFD Session Verification ----
# BFD provides sub-second failure detection on fabric links. Once a BFD
# session is Up, BGP failover happens in ~900ms instead of 180s holdtime.
- name: "verify | Check BFD session states"
  ansible.builtin.shell: |
    timeout 15 docker exec bgp vtysh -c "show bfd peers json" 2>/dev/null
  register: _bfd_peers
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: 3
  delay: 10
  until: not (_bfd_peers.unreachable | default(false))
  when: bfd_enabled | default(true) | bool
  tags: [verify, fabric, bfd]

- name: "verify | Parse BFD peer data"
  ansible.builtin.set_fact:
    _bfd_data: "{{ _bfd_peers.stdout | from_json }}"
  when:
    - bfd_enabled | default(true) | bool
    - _bfd_peers.rc | default(-1) == 0
    - _bfd_peers.stdout | default('') | length > 2
  failed_when: false
  tags: [verify, fabric, bfd]

- name: "verify | Report BFD session status"
  ansible.builtin.debug:
    msg: |
      BFD Sessions for {{ hostname }}:
      {% if _bfd_data is defined and _bfd_data | length > 0 %}
      {% for session in _bfd_data %}
        Interface: {{ session.peer | default(session.interface | default('unknown')) }}
        Status:    {{ session.status | default('unknown') }}
        Tx/Rx:     {{ session['transmit-interval'] | default('?') }}ms / {{ session['receive-interval'] | default('?') }}ms
        Uptime:    {{ session.uptime | default('n/a') }}
        {{ '✓ BFD UP' if (session.status | default('')) == 'up' else '✗ BFD DOWN — failover detection inactive!' }}
      {% endfor %}
      {% else %}
        BFD sessions not yet established (peers may still be negotiating)
      {% endif %}
  when: bfd_enabled | default(true) | bool
  tags: [verify, fabric, bfd]

- name: "verify | Warn if BFD sessions not all Up"
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _bfd_data | selectattr('status', 'ne', 'up') | list | length }}
      BFD session(s) NOT Up on {{ hostname }}.
      Fabric failover will fall back to BGP holdtime ({{ bgp_holdtime }}s).
      Check: interface oper status, peer BFD config, asymmetric timer mismatch.
  when:
    - bfd_enabled | default(true) | bool
    - _bfd_data is defined
    - (_bfd_data | selectattr('status', 'ne', 'up') | list | length) > 0
  tags: [verify, fabric, bfd]

- name: "verify | Check LLDP neighbors"
  ansible.builtin.shell: |
    show lldp neighbors | grep -E "{{ _fabric_links | map(attribute='port') | join('|') }}"
  register: _lldp_neighbors
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: 3
  delay: 10
  until: not (_lldp_neighbors.unreachable | default(false))
  tags: [verify, fabric]

- name: "verify | Report LLDP neighbors"
  ansible.builtin.debug:
    msg: |
      LLDP Neighbors on fabric ports:
      {{ _lldp_neighbors.stdout | default('No LLDP neighbors detected yet') }}
  tags: [verify, fabric]

# ---- Real Hardware: LLDP Neighbor Count Assertion ----
- name: "verify | Assert expected LLDP neighbor count (real hardware)"
  ansible.builtin.shell: |
    EXPECTED={{ _fabric_links | length }}
    FOUND=$(show lldp neighbors 2>/dev/null | grep -cE "{{ _fabric_links | map(attribute='port') | join('|') }}" || echo "0")
    echo "expected=$EXPECTED found=$FOUND"
    if [ "$FOUND" -lt "$EXPECTED" ]; then
      echo "WARN: Only $FOUND/$EXPECTED fabric ports have LLDP neighbors — possible cable/transceiver issue"
      exit 1
    fi
  register: _lldp_count_check
  changed_when: false
  failed_when: false
  when: automation_profile == 'real_hardware'
  tags: [verify, fabric, lldp]

- name: "verify | Report LLDP mismatch (real hardware)"
  ansible.builtin.debug:
    msg: >-
      {{ _lldp_count_check.stdout | default('') }}
      Action: Verify physical cabling, SFP/QSFP transceivers, and peer switch LLDP config.
  when:
    - automation_profile == 'real_hardware'
    - _lldp_count_check.rc | default(0) != 0
  tags: [verify, fabric, lldp]

- name: "verify | Check IPv6 link-local addresses on fabric ports"
  ansible.builtin.shell: |
    show ipv6 interfaces | grep -E "{{ _fabric_links | map(attribute='port') | join('|') }}"
  register: _ipv6_addrs
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: 3
  delay: 10
  until: not (_ipv6_addrs.unreachable | default(false))
  tags: [verify, fabric]

- name: "verify | Report IPv6 link-local"
  ansible.builtin.debug:
    msg: |
      IPv6 link-local on fabric ports:
      {{ _ipv6_addrs.stdout | default('No IPv6 addresses found (interfaces may still be initializing)') }}
  tags: [verify, fabric]

- name: "verify | Fabric integration summary"
  ansible.builtin.debug:
    msg: |
      ============================================
      Fabric Integration Complete: {{ hostname }}
      ============================================
      ASN:            {{ bgp_local_asn }}
      Router-ID:      {{ router_id }}
      Fabric Ports:   {{ _fabric_links | map(attribute='port') | list | join(', ') }}
      BGP Mode:       eBGP unnumbered (IPv6 link-local)
      LLDP:           Enabled (Tx+Rx)
      Neighbors:      {{ _fabric_links | map(attribute='neighbor') | list | join(', ') }}
      ============================================

# ---------------------------------------------------------------------------
# Ping-based connectivity validation (IPv6 link-local over fabric interfaces)
# eBGP unnumbered uses only link-local addresses — ping6 via the specific
# fabric interface to confirm L3 reachability independent of BGP state.
# The peer's link-local is obtained from FRR's BGP neighbor state JSON:
#   "bgpNeighborAddr" contains the peer's fe80:: address once BGP is up.
#
# Timing note: the play runs serial:1 (one switch at a time), so when
# Spine_S1's verify phase runs, Leaf_L1's BGP has not been configured yet
# and the ping will SKIP. When Leaf_L1's verify runs, Spine_S1 is already
# configured and the ping has a good chance of succeeding. A dedicated
# wait-for-BGP-established gate is included before the ping attempt.
# ---------------------------------------------------------------------------
- name: "verify | Wait for at least one BGP session to reach Established"
  ansible.builtin.shell: |
    docker exec bgp vtysh -c "show bgp summary json" 2>/dev/null \
      | grep -q '"Established"' && echo "established" || echo "pending"
  register: _bgp_established
  retries: 18
  delay: 10
  until: _bgp_established.stdout | default('') | trim == 'established'
  changed_when: false
  failed_when: false
  tags: [verify, fabric]

- name: "verify | Report BGP establish result before ping test"
  ansible.builtin.debug:
    msg: >-
      BGP establish check on {{ inventory_hostname }}:
      {{ 'at least one session Established — proceeding with ping' if (_bgp_established.stdout | default('') | trim == 'established') else 'no session Established yet (peer may not be configured yet — ping will SKIP)' }}
  tags: [verify, fabric]

- name: "verify | Discover peer IPv6 link-local from FRR BGP neighbor state"
  ansible.builtin.shell: |
    docker exec bgp vtysh -c "show bgp neighbors {{ item.port }} json" 2>/dev/null \
      | python3 -c "import sys,json;d=json.load(sys.stdin);a=d.get('bgpNeighborAddr','');print(a if a.startswith('fe80') else '')" 2>/dev/null || echo ""
  loop: "{{ _fabric_links }}"
  loop_control:
    label: "{{ item.port }}"
  register: _peer_link_local
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: 3
  delay: 10
  until: not (_peer_link_local.unreachable | default(false))
  tags: [verify, fabric]

- name: "verify | Ping peer IPv6 link-local via fabric interface"
  ansible.builtin.shell: |
    peer_ll="{{ item.stdout | trim }}"
    port="{{ item.item.port }}"
    neighbor="{{ item.item.neighbor }}"
    if [ -z "$peer_ll" ]; then
      echo "SKIP: peer link-local not yet known for ${port} → ${neighbor} (BGP not Established yet)"
      exit 0
    fi
    if ping6 -c 3 -W 2 -I "$port" "$peer_ll" > /tmp/ping6_${port}.out 2>&1; then
      echo "OK: ping6 ${peer_ll}%${port} → ${neighbor}: 3/3 replies received"
    else
      rtt=$(grep -oP '(?<=time=)\S+' /tmp/ping6_${port}.out | tail -1 || true)
      loss=$(grep -oP '\d+(?=% packet loss)' /tmp/ping6_${port}.out | tail -1 || true)
      echo "FAIL: ping6 ${peer_ll}%${port} → ${neighbor}: ${loss:-100}% packet loss"
      cat /tmp/ping6_${port}.out
    fi
  loop: "{{ _peer_link_local.results }}"
  loop_control:
    label: "{{ item.item.port }} → {{ item.item.neighbor }}"
  register: _ping6_results
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  tags: [verify, fabric]

- name: "verify | Report ping connectivity results"
  ansible.builtin.debug:
    msg: "{{ item.stdout | default('(no output)') }}"
  loop: "{{ _ping6_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.port }} → {{ item.item.item.neighbor }}"
  tags: [verify, fabric]
