---
# preflight_connectivity_v2.yml
#
# Phase 1 of shared preflight: all non-privileged TCP/SSH reachability checks
# that must work the same way for day-0 and later fabric playbooks.
#
# FIX: References preflight_ssh_probe_attempt_v2.yml which replaces
# ansible.builtin.pause (incompatible with strategy: free) with a
# shell-based sleep that executes per-host.

- name: "preflight | Kill any stale SSH ControlMaster process"
  ansible.builtin.shell:
    cmd: >
      ssh -o ControlPath=/tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
          -O stop {{ ansible_host }} 2>/dev/null || true;
      rm -f /tmp/ansible-ssh-{{ inventory_hostname }}-22-admin
      /tmp/ansible-ssh-{{ ansible_host }}-22-admin 2>/dev/null || true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  changed_when: false
  tags: [always]

- name: "preflight | Reset Ansible connection cache"
  ansible.builtin.meta: reset_connection

- name: "preflight | Wait for SSH port 22 to accept connections"
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      output=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=5 -o BatchMode=yes -o LogLevel=ERROR \
               {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1)
      rc=$?
      # rc=0 means full login succeeded; "Permission denied" means port is open but auth failed
      if [ $rc -eq 0 ] || echo "$output" | grep -qi "permission denied"; then
        echo "PORT_OPEN"
        exit 0
      fi
      sleep 5
    done
    echo "TIMEOUT after 300s waiting for {{ ansible_host }}:22"
    exit 1
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  register: _port_check
  changed_when: false
  failed_when: "'PORT_OPEN' not in _port_check.stdout"

- name: "preflight | Probe SSH password (primary)"
  ansible.builtin.shell: |
    {% if ansible_ssh_pass | default('') | length > 0 %}
    sshpass -p '{{ ansible_ssh_pass }}' ssh \
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o ConnectTimeout=30 -o PubkeyAuthentication=no \
      {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1
    {% else %}
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o ConnectTimeout=30 -o BatchMode=yes \
      {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1
    {% endif %}
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  register: _pw_primary
  changed_when: false
  failed_when: false
  retries: 6
  delay: 15
  until: >-
    'ok' in (_pw_primary.stdout | default(''))
    or 'Permission denied' in (_pw_primary.stdout | default(''))
    or 'Permission denied' in (_pw_primary.stderr | default(''))

- name: "preflight | Try alternate password (factory default)"
  ansible.builtin.shell: |
    sshpass -p '{{ sonic_factory_password }}' ssh \
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o ConnectTimeout=30 -o PubkeyAuthentication=no \
      {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  register: _pw_alt
  changed_when: false
  failed_when: false
  when: >-
    'ok' not in (_pw_primary.stdout | default(''))
    and (ansible_ssh_pass | default('') | length > 0)

- name: "preflight | Switch to alternate password"
  ansible.builtin.set_fact:
    ansible_ssh_pass: "{{ sonic_factory_password }}"
    ansible_become_password: "{{ sonic_factory_password }}"
  when: >-
    'ok' not in (_pw_primary.stdout | default(''))
    and 'ok' in (_pw_alt.stdout | default(''))
  no_log: true

- name: "preflight | Initialize raw SSH stability probe state"
  ansible.builtin.set_fact:
    _preflight_probe_ok: false
    _preflight_probe_last_rc: -1
    _preflight_probe_last_stdout: ""
    _preflight_probe_last_stderr: ""
  no_log: true

- name: "preflight | Confirm raw SSH is stable before Ansible session"
  ansible.builtin.include_tasks: preflight_ssh_probe_attempt_v2.yml
  loop: "{{ range(1, 5) | list }}"
  loop_control:
    loop_var: preflight_probe_attempt
  vars:
    preflight_probe_name: "raw SSH stability before Ansible session"
    preflight_probe_total_attempts: 4
    preflight_probe_delay_seconds: 10
    preflight_probe_connect_timeout: 15
  when: not (_preflight_probe_ok | default(false))
