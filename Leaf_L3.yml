---
# =============================================================================
# Leaf_L3 - Arista 7050-QX32 (Leaf #3, serves Host34_1/2 with Leaf_L4)
# =============================================================================
# Platform:   x86_64-arista_7050_qx32 / Arista-7050-QX32
# ASIC:       Broadcom Trident II BCM56854 (32x40G QSFP+)
# Management: 172.16.2.23 (Management Switch port43)
# Loopback:   10.0.1.3/32
# ASN:        65013
#
# Fabric Wiring (per TopologyRequirements.txt):
#   Ethernet124 (Ethernet32, QSFP+32) ↔ Spine_S1 Ethernet8  (uplink, 40G)
#   Ethernet120 (Ethernet31, QSFP+31) ↔ Spine_S2 Ethernet8  (uplink, 40G)
#
# Server Wiring (QSFP+ port 1 broken out 4x10G):
#   Ethernet0 (breakout sub0) ↔ Host34_1 eth1 (10G)
#   Ethernet1 (breakout sub1) ↔ Host34_2 eth1 (10G)
# =============================================================================

hostname: "Leaf_L3"
router_id: "10.0.1.3"
loopback_ip: "10.0.1.3/32"
mgmt_ip: "172.16.2.23/24"
mgmt_gateway: "172.16.2.1"
mac_address: "00:1c:73:a1:03:01"

bgp_local_asn: "{{ leaf_asn_map[inventory_hostname] }}"

# ---- Uplink interfaces ----
uplink_interfaces:
  - port: "Ethernet124"
    alias: "Ethernet32"
    lanes: "1,2,3,4"
    index: "32"
    speed: "40000"
    neighbor: "Spine_S1"
    neighbor_port: "Ethernet8"
    neighbor_asn: "{{ spine_asn }}"
    description: "Leaf_L3 → Spine_S1 (Celestica DX010)"

  - port: "Ethernet120"
    alias: "Ethernet31"
    lanes: "5,6,7,8"
    index: "31"
    speed: "40000"
    neighbor: "Spine_S2"
    neighbor_port: "Ethernet8"
    neighbor_asn: "{{ spine_asn }}"
    description: "Leaf_L3 → Spine_S2 (Celestica DX010)"

# ---- Downlink interfaces ----
# NOTE: SONiC VS does not support QSFP breakout sub-ports for data-plane.
# KVM VS maps vNIC position → port_config.ini index → native QSFP port.
#   Position 1 (NIC1) → index 1 → Ethernet0  (br-H341-L3)
#   Position 2 (NIC2) → index 2 → Ethernet4  (br-H342-L3)
# On physical hardware, these would be Ethernet0/1 (4x10G breakout of QSFP+1).
downlink_interfaces:
  - port: "Ethernet0"
    lanes: "125,126,127,128"
    index: "1"
    speed: "40000"
    neighbor: "Host34_1"
    neighbor_port: "eth1"
    description: "Leaf_L3 → Host34_1 eth1 (QSFP+1, VS native port)"

  - port: "Ethernet4"
    lanes: "121,122,123,124"
    index: "2"
    speed: "40000"
    neighbor: "Host34_2"
    neighbor_port: "eth1"
    description: "Leaf_L3 → Host34_2 eth1 (QSFP+2, VS native port)"

# ---- Breakout config (physical hardware only; NOT applied in VS mode) ----
breakout_cfg:
  # Ethernet0:  { brkout_mode: "4x10G" }  # VS: use native Ethernet0 + Ethernet4 instead
  Ethernet124:  { brkout_mode: "1x40G" }
  Ethernet120:  { brkout_mode: "1x40G" }

all_ports: "{{ qx32_all_ports }}"
