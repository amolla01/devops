---
# server_base/tasks/day0_provision.yml
# Day-0 base provisioning for Ubuntu bare-metal servers.
# Sets: hostname, timezone, NTP, DNS, basic security hardening.

# Linux hostnames must be RFC 1123 compliant: lowercase, no underscores.
# Inventory uses CamelCase_Underscore (Host12_1) for readability;
# derive a valid hostname by lowercasing and replacing underscores with hyphens.
- name: "day0 | Derive valid Linux hostname"
  ansible.builtin.set_fact:
    _linux_hostname: "{{ hostname | lower | replace('_', '-') }}"
  tags: [day0, identity]

- name: "day0 | Set hostname"
  ansible.builtin.hostname:
    name: "{{ _linux_hostname }}"
  tags: [day0, identity]

- name: "day0 | Update /etc/hosts with hostname"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ _linux_hostname }} {{ hostname }}"
    state: present
  tags: [day0, identity]

- name: "day0 | Set timezone to UTC"
  ansible.builtin.timezone:
    name: UTC
  tags: [day0, ntp]

- name: "day0 | Install essential packages"
  ansible.builtin.apt:
    name:
      - chrony
      - frr
      - lldpd
      - jq
      - net-tools
      - iproute2
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags: [day0, packages]

- name: "day0 | Configure Chrony NTP"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
    backup: yes
  notify: restart chrony
  tags: [day0, ntp]

- name: "day0 | Configure DNS resolvers"
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    mode: "0644"
  notify: restart systemd-resolved
  tags: [day0, dns]

- name: "day0 | Disable password authentication in sshd"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart sshd
  tags: [day0, hardening]

- name: "day0 | Disable root login in sshd"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: restart sshd
  tags: [day0, hardening]

- name: "day0 | Enable and start LLDP daemon"
  ansible.builtin.systemd:
    name: lldpd
    enabled: yes
    state: started
  tags: [day0, lldp]

- name: "day0 | Deployment summary"
  ansible.builtin.debug:
    msg: |
      ============================================================
      Day-0 Deployment Complete: {{ _linux_hostname }} (Ubuntu Server)
      ============================================================
      Inventory name:  {{ inventory_hostname }}
      Linux hostname:  {{ _linux_hostname }}
      PXE IP:       {{ pxe_ip | default('N/A') }}
      Bond IP:      {{ bond_ip | default('N/A') }}
      Loopback:     {{ loopback_ip | default('N/A') }}
      NTP:          {{ ntp_servers | join(', ') }}
      DNS:          {{ dns_servers | join(', ') }}
      Packages:     chrony, frr, lldpd, jq, net-tools
      ============================================================
      NEXT: deploy_day1.yml for Netplan + FRR BGP configuration
      ============================================================
  tags: [day0, verify]
