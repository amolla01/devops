---
# =============================================================================
# sonic_breakout/tasks/main.yml
# Generic Port Breakout — any switch model, any port, host_vars driven
# =============================================================================
# Purpose:
#   Applies port breakout commands on any SONiC switch where breakout_cfg
#   defines ports with a split mode (e.g. 4x10G, 2x50G, 2x25G).
#   Entries with mode 1x* (1x100G[40G], 1x40G) are skipped — those are
#   native-mode declarations handled by day-0 BREAKOUT_CFG table only.
#
# After breakout, parent ports are removed and child sub-ports are created.
# Optionally configures IP/BGP on sub-ports when exit_interfaces is defined.
#
# This role handles:
#   1. Filtering breakout_cfg for ports needing actual CLI breakout (Nx > 1)
#   2. Checking if breakout is already applied (lane count check)
#   3. Removing any IP/BGP config from the parent port (pre-cleanup)
#   4. Applying: config interface breakout <port> <mode> -f -l -v -y
#   5. Verifying child sub-ports were created
#   6. Configuring child port attributes (speed, MTU, admin_status)
#   7. [Optional] Assigning IP/BGP when exit_interfaces is defined
#   8. Persisting config and restarting BGP container
#
# Input vars (from host_vars/group_vars):
#   - breakout_cfg       (dict, required) — port → {brkout_mode, ...}
#   - exit_interfaces    (list, optional) — sub-port IP/BGP config
#   - hwsku              (string, auto-detected from host_vars)
#   - automation_profile (string, determines KVM vs real hardware behavior)
#
# Supported across all switch models:
#   - Arista 7050QX-32S (border leaves)
#   - Arista 7050-QX32  (leaf L3/L4)
#   - Celestica DX010   (spines)
#   - Accton AS5712-54X (leaf L1/L2)
# =============================================================================

- name: "breakout | Validate breakout_cfg is defined"
  ansible.builtin.assert:
    that:
      - breakout_cfg is defined
      - breakout_cfg | length > 0
    fail_msg: >-
      No breakout_cfg defined on {{ inventory_hostname }} ({{ hwsku | default('unknown') }}).
      Define breakout_cfg in host_vars with at least one port entry.
    quiet: true
  tags: [validate, breakout]

# ---------------------------------------------------------------------------
# Filter to only ports that need actual CLI breakout (multiplier > 1).
# Entries like "1x100G[40G]" or "1x40G" are mode declarations for the
# BREAKOUT_CFG table in config_db.json — they don't need CLI commands.
# ---------------------------------------------------------------------------
- name: "breakout | Filter ports needing actual split (Nx where N > 1)"
  ansible.builtin.set_fact:
    _breakout_ports: "{{ breakout_cfg | dict2items | selectattr('value.brkout_mode', 'match', '^[2-9]x') | map(attribute='key') | list }}"
    _breakout_modes: "{{ breakout_cfg | dict2items | selectattr('value.brkout_mode', 'match', '^[2-9]x') | items2dict }}"
  tags: [breakout]

- name: "breakout | Report breakout plan"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ hwsku | default('unknown') }}):
      {{ _breakout_ports | length }} port(s) need breakout —
      {{ _breakout_ports | zip(_breakout_ports | map('extract', _breakout_modes) | map(attribute='brkout_mode'))
         | map('join', '=') | join(', ') | default('none') }}
  tags: [breakout]

- name: "breakout | Skip host if no ports need breakout"
  ansible.builtin.meta: end_host
  when: _breakout_ports | length == 0
  tags: [breakout]

# ---------------------------------------------------------------------------
# Step 1: Check if breakout is already applied
# On KVM VS, breakout of Ethernet0 (lanes "9,10,11,12") produces Ethernet0
# (lane "9"), Ethernet1 (lane "10"), etc. — sequential port names, one lane each.
# Detection: if the parent port still has multiple lanes (comma in lanes field),
# breakout is needed. Single lane (or port missing) = already broken out.
# ---------------------------------------------------------------------------
- name: "breakout | Check current lane config of parent port"
  ansible.builtin.command: >
    sonic-db-cli CONFIG_DB hget "PORT|{{ item }}" lanes
  loop: "{{ _breakout_ports }}"
  register: _parent_port_lanes
  changed_when: false
  failed_when: false
  tags: [breakout]

- name: "breakout | Determine which ports need breakout (multi-lane = needs split)"
  ansible.builtin.set_fact:
    _ports_needing_breakout: "{{ _parent_port_lanes.results
      | rejectattr('stdout', 'match', '^[0-9]+$')
      | map(attribute='item') | list }}"
  tags: [breakout]

- name: "breakout | Report breakout status"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ hwsku | default('unknown') }}):
      {{ 'Ports needing breakout: ' + _ports_needing_breakout | join(', ')
         if _ports_needing_breakout | length > 0
         else 'All ports already broken out — skipping to post-breakout config' }}
  tags: [breakout]

- name: "breakout | Set breakout-needed flag"
  ansible.builtin.set_fact:
    _needs_breakout: "{{ _ports_needing_breakout | length > 0 }}"
  tags: [breakout]

# ---------------------------------------------------------------------------
# Step 2: Pre-cleanup — Remove existing IP/BGP config from parent port
# This prevents conflicts when the parent port is removed by breakout.
# ---------------------------------------------------------------------------
- name: "breakout | Remove IP addresses from parent port before breakout"
  ansible.builtin.shell: |
    {% for port in _ports_needing_breakout %}
    # Remove all INTERFACE entries for the parent port
    KEYS=$(sonic-db-cli CONFIG_DB keys "INTERFACE|{{ port }}|*" 2>/dev/null)
    for k in $KEYS; do
      sonic-db-cli CONFIG_DB del "$k" 2>/dev/null || true
    done
    sonic-db-cli CONFIG_DB del "INTERFACE|{{ port }}" 2>/dev/null || true
    # Remove BGP_NEIGHBOR entries referencing this port
    sonic-db-cli CONFIG_DB del "BGP_NEIGHBOR|{{ port }}" 2>/dev/null || true
    {% endfor %}
    echo "Pre-cleanup complete for: {{ _ports_needing_breakout | join(', ') }}"
  changed_when: true
  when: _needs_breakout | bool
  tags: [breakout]

# ---------------------------------------------------------------------------
# Step 3: Apply breakout
# Two paths:
#   - Real hardware: uses CLI "config interface breakout <port> <mode> -f -l -v -y"
#     (requires platform.json on the switch)
#   - KVM Virtual Switch: no platform.json — directly manipulate CONFIG_DB
#     (delete parent port, add child sub-ports with correct lanes/speed/alias)
# ---------------------------------------------------------------------------
- name: "breakout | Detect if running on KVM Virtual Switch"
  ansible.builtin.set_fact:
    _is_kvm: "{{ automation_profile in ['win11_kvm', 'ubuntu_r620_kvm', 'ubuntu_r810_kvm'] or profile_sonic_platform | default('') == 'x86_64-kvm_x86_64-r0' }}"
  tags: [breakout]

# --- Real hardware path ---
- name: "breakout | Apply port breakout (real hardware)"
  ansible.builtin.command: >-
    timeout 180 config interface breakout {{ item }}
    {{ _breakout_modes[item].brkout_mode }} -f -l -v -y
  loop: "{{ _ports_needing_breakout }}"
  loop_control:
    label: "{{ item }} → {{ _breakout_modes[item].brkout_mode }}"
  register: _breakout_result
  changed_when: true
  when: (_needs_breakout | bool) and not (_is_kvm | bool)
  tags: [breakout]

# --- KVM Virtual Switch path (software breakout via CONFIG_DB) ---
- name: "breakout | Apply software breakout on KVM (remove parent, add children)"
  ansible.builtin.shell: |
    set -e
    {% for parent in _ports_needing_breakout %}
    {% set cfg = _breakout_modes[parent] %}
    echo "=== Breakout {{ parent }} → {{ cfg.brkout_mode }} (KVM software mode) ==="

    # 1. Capture parent port attributes for reference
    PARENT_ALIAS=$(sonic-db-cli CONFIG_DB hget "PORT|{{ parent }}" alias 2>/dev/null || echo "")
    PARENT_INDEX=$(sonic-db-cli CONFIG_DB hget "PORT|{{ parent }}" index 2>/dev/null || echo "")
    PARENT_ADMIN=$(sonic-db-cli CONFIG_DB hget "PORT|{{ parent }}" admin_status 2>/dev/null || echo "down")

    # 2. Delete the parent port from PORT table
    sonic-db-cli CONFIG_DB del "PORT|{{ parent }}"
    echo "  Removed parent PORT|{{ parent }}"

    # 3. Create child sub-ports
    {% if cfg.child_ports is defined %}
    {% for cp in cfg.child_ports %}
    sonic-db-cli CONFIG_DB hmset "PORT|{{ cp.port }}" \
      alias "{{ cp.alias | default(cp.port) }}" \
      lanes "{{ cp.lane }}" \
      speed "{{ cp.speed }}" \
      index "{{ cp.index | default(PARENT_INDEX) }}" \
      admin_status "down" \
      mtu "9100"
    echo "  Created PORT|{{ cp.port }} (lane {{ cp.lane }}, {{ cp.speed }}, alias {{ cp.alias | default(cp.port) }})"
    {% endfor %}
    {% else %}
    echo "  WARNING: No child_ports defined for {{ parent }} — cannot create sub-ports"
    echo "  Define breakout_cfg.{{ parent }}.child_ports in host_vars"
    exit 1
    {% endif %}
    {% endfor %}
    echo "Software breakout complete"
  changed_when: true
  when: (_needs_breakout | bool) and (_is_kvm | bool)
  tags: [breakout]

- name: "breakout | Wait for port reconfiguration to settle"
  ansible.builtin.wait_for:
    timeout: 10
  delegate_to: localhost
  become: false
  when: _needs_breakout | bool
  tags: [breakout]

# ---------------------------------------------------------------------------
# Step 4: Verify child sub-ports were created
# Build expected child port list from breakout_cfg.child_ports if defined,
# or from exit_interfaces if available.
# ---------------------------------------------------------------------------
- name: "breakout | Build child port verification list"
  ansible.builtin.set_fact:
    _verify_child_ports: "{{ _ports_needing_breakout | map('extract', _breakout_modes) | selectattr('child_ports', 'defined') | map(attribute='child_ports') | flatten | map(attribute='port') | list }}"
  when: _needs_breakout | bool
  tags: [breakout]

- name: "breakout | Verify child sub-ports exist after breakout"
  ansible.builtin.command: >
    sonic-db-cli CONFIG_DB hget "PORT|{{ item }}" lanes
  loop: "{{ _verify_child_ports }}"
  loop_control:
    label: "{{ item }}"
  register: _child_port_check
  changed_when: false
  failed_when: _child_port_check.stdout | default('') | length == 0
  when: (_needs_breakout | bool) and (_verify_child_ports | length > 0)
  tags: [breakout, validate]

- name: "breakout | Display child port verification"
  ansible.builtin.debug:
    msg: >-
      {{ item.item }}: lanes={{ item.stdout }}
  loop: "{{ _child_port_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('n/a') }}"
  when: (_needs_breakout | bool) and (_child_port_check.results is defined)
  tags: [breakout, validate]

# ---------------------------------------------------------------------------
# Step 5: Configure child sub-port attributes from breakout_cfg.child_ports
# This is generic — works for any switch model with child_ports defined.
# ---------------------------------------------------------------------------
- name: "breakout | Build child port attribute list"
  ansible.builtin.set_fact:
    _child_port_attrs: "{{ _ports_needing_breakout | map('extract', _breakout_modes) | selectattr('child_ports', 'defined') | map(attribute='child_ports') | flatten | list }}"
  when: _needs_breakout | bool
  tags: [breakout]

- name: "breakout | Set child sub-port speed"
  ansible.builtin.command: >-
    sonic-db-cli CONFIG_DB hset "PORT|{{ item.port }}" speed {{ item.speed }}
  loop: "{{ _child_port_attrs | default([]) }}"
  loop_control:
    label: "{{ item.port }}={{ item.speed }}"
  changed_when: true
  when: (_needs_breakout | bool) and (_child_port_attrs | default([]) | length > 0)
  tags: [breakout]

- name: "breakout | Set child sub-port admin_status up"
  ansible.builtin.command: >-
    sonic-db-cli CONFIG_DB hset "PORT|{{ item.port }}" admin_status up
  loop: "{{ _child_port_attrs | default([]) }}"
  loop_control:
    label: "{{ item.port }}"
  changed_when: true
  when: (_needs_breakout | bool) and (_child_port_attrs | default([]) | length > 0)
  tags: [breakout]

# ===========================================================================
# OPTIONAL: Exit Interface IP/BGP Configuration
# Only runs when exit_interfaces is defined in host_vars.
# Switches without exit routers (e.g. Leaf_L1) skip this entire block.
# ===========================================================================
- name: "breakout | Configure exit interface attributes"
  when: exit_interfaces is defined and exit_interfaces | length > 0
  tags: [breakout, exit]
  block:
    - name: "breakout | Set exit sub-port speed"
      ansible.builtin.command: >-
        config interface speed {{ item.port }} {{ item.speed }}
      loop: "{{ exit_interfaces }}"
      loop_control:
        label: "{{ item.port }}={{ item.speed }}"
      changed_when: true
      failed_when: false

    - name: "breakout | Set exit sub-port MTU"
      ansible.builtin.command: >-
        config interface mtu {{ item.port }} {{ item.mtu | default('1500') }}
      loop: "{{ exit_interfaces }}"
      loop_control:
        label: "{{ item.port }} mtu={{ item.mtu | default('1500') }}"
      changed_when: true

    - name: "breakout | Bring exit sub-port admin up"
      ansible.builtin.command: >-
        config interface startup {{ item.port }}
      loop: "{{ exit_interfaces }}"
      loop_control:
        label: "{{ item.port }}"
      changed_when: true

    - name: "breakout | Set exit sub-port description"
      ansible.builtin.command: >-
        config interface description {{ item.port }} "{{ item.description }}"
      loop: "{{ exit_interfaces }}"
      loop_control:
        label: "{{ item.port }}"
      changed_when: true
      failed_when: false

    - name: "breakout | Assign IP to exit sub-port"
      ansible.builtin.command: >-
        config interface ip add {{ item.port }} {{ item.local_ip }}
      loop: "{{ exit_interfaces }}"
      loop_control:
        label: "{{ item.port }} = {{ item.local_ip }}"
      register: _ip_add_result
      changed_when: "'already' not in (_ip_add_result.stderr | default(''))"
      failed_when:
        - _ip_add_result.rc != 0
        - "'already' not in (_ip_add_result.stderr | default(''))"

    - name: "breakout | Configure BGP neighbor via vtysh"
      ansible.builtin.shell: |
        docker exec bgp vtysh -c "configure terminal" \
          -c "router bgp {{ bgp_local_asn }}" \
          -c "neighbor {{ item.neighbor_ip }} remote-as {{ item.neighbor_asn }}" \
          -c "neighbor {{ item.neighbor_ip }} description {{ item.neighbor }}" \
          -c "neighbor {{ item.neighbor_ip }} timers {{ bgp_keepalive | default('60') }} {{ bgp_holdtime | default('180') }}" \
          -c "address-family ipv4 unicast" \
          -c "neighbor {{ item.neighbor_ip }} activate" \
          -c "exit-address-family" \
          -c "exit" \
          -c "exit"
        echo "BGP neighbor {{ item.neighbor_ip }} (AS {{ item.neighbor_asn }}) configured via vtysh"
      loop: "{{ exit_interfaces }}"
      loop_control:
        label: "{{ item.neighbor }} ({{ item.neighbor_ip }})"
      changed_when: true

# ---------------------------------------------------------------------------
# Step 6: Persist configuration
# ---------------------------------------------------------------------------
- name: "breakout | Persist SONiC config to /etc/sonic/config_db.json"
  ansible.builtin.command: config save -y
  changed_when: true
  tags: [breakout]

- name: "breakout | Persist FRR config (BGP neighbor)"
  ansible.builtin.shell: >-
    docker exec bgp vtysh -c "write memory"
  when: exit_interfaces is defined and exit_interfaces | length > 0
  changed_when: true
  tags: [breakout]

- name: "breakout | Wait for BGP container to be ready"
  ansible.builtin.command: >-
    docker exec bgp vtysh -c "show version"
  register: _bgp_ready
  retries: 12
  delay: 10
  until: _bgp_ready.rc == 0
  changed_when: false
  tags: [breakout]

# ---------------------------------------------------------------------------
# Step 7: Verify exit router BGP session (only when exit_interfaces defined)
# ---------------------------------------------------------------------------
- name: "breakout | Verify exit BGP sessions"
  when: exit_interfaces is defined and exit_interfaces | length > 0
  tags: [breakout, verify]
  block:
    - name: "breakout | Wait for BGP session establishment (up to 60s)"
      ansible.builtin.shell: |
        for i in $(seq 1 12); do
          STATE=$(docker exec bgp vtysh -c "show bgp summary json" 2>/dev/null | \
                  python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ipv4Unicast',{}).get('peers',{}).get('{{ item.neighbor_ip }}',{}).get('state',''))" 2>/dev/null)
          if [ "$STATE" = "Established" ]; then
            echo "ESTABLISHED after ${i}x5s"
            exit 0
          fi
          sleep 5
        done
        echo "NOT_ESTABLISHED after 60s - current state: $STATE"
        exit 1
      loop: "{{ exit_interfaces }}"
      loop_control:
        label: "{{ item.neighbor }} ({{ item.neighbor_ip }})"
      register: _bgp_verify
      failed_when: false
      changed_when: false

    - name: "breakout | Report BGP session status"
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ _bgp_verify.results }}"
      loop_control:
        label: "{{ item.item.neighbor }}"

- name: "breakout | Deployment complete"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ hwsku | default('unknown') }}):
      Breakout applied on {{ _ports_needing_breakout | join(', ') }}.
      {{ 'Exit BGP configured on ' + (exit_interfaces | map(attribute='port') | join(', ')) + '.'
         if exit_interfaces is defined else 'No exit_interfaces — pure breakout only.' }}
  tags: [breakout]
