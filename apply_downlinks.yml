---
# =============================================================================
# sonic_fabric / tasks / apply_downlinks.yml
# =============================================================================
# Purpose: Configure SONiC leaf switches for server-facing downlink BGP peers.
#   - Renders config_db_downlinks.json.j2 with per-server unique ASNs
#   - Applies via sonic-cfggen merge (non-disruptive to existing BGP sessions)
#   - Validates BGP peer establishment with each connected server
#
# Prerequisites:
#   - SONiC switch must be reachable via SSH
#   - server_asn_map must be defined in group_vars/all.yml
#   - downlink_interfaces must be defined in leaf host_vars
#   - Fabric uplinks should already be configured (deploy_fabric_spine_leaf.yml)
#
# Usage:
#   ansible-playbook playbooks/deploy_server_downlinks.yml -i inventory/hosts.yml \
#     -e "target_leaves=Leaf_L1,Leaf_L2" -v
# =============================================================================

- name: "DOWNLINKS | Validate required variables"
  ansible.builtin.assert:
    that:
      - server_asn_map is defined
      - downlink_interfaces is defined
      - downlink_interfaces | length > 0
      - bgp_local_asn is defined
    fail_msg: >-
      Missing required variables. Ensure server_asn_map is in group_vars/all.yml
      and downlink_interfaces is defined in this leaf's host_vars.
  tags: [downlinks, downlinks_validate]

- name: "DOWNLINKS | Verify all server ASNs are in server_asn_map"
  ansible.builtin.assert:
    that:
      - item.neighbor in server_asn_map
    fail_msg: "Server '{{ item.neighbor }}' not found in server_asn_map!"
  loop: "{{ downlink_interfaces }}"
  loop_control:
    label: "{{ item.neighbor }} → ASN {{ server_asn_map[item.neighbor] | default('MISSING') }}"
  tags: [downlinks, downlinks_validate]

- name: "DOWNLINKS | Display planned server peers"
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════
      LEAF DOWNLINK PLAN — {{ hostname }}
      ═══════════════════════════════════════════════════════════════
      {% for iface in downlink_interfaces %}
      {{ iface.port }} → {{ iface.neighbor }} (ASN {{ server_asn_map[iface.neighbor] }})
      {% endfor %}
      ═══════════════════════════════════════════════════════════════
  tags: [downlinks, downlinks_validate]

# ─── Step 1: Render downlink config_db patch ───
- name: "DOWNLINKS | Render config_db downlinks patch"
  ansible.builtin.template:
    src: config_db_downlinks.json.j2
    dest: "/tmp/sonic_downlinks_patch_{{ inventory_hostname }}.json"
    mode: "0644"
  delegate_to: localhost
  tags: [downlinks, downlinks_render]

- name: "DOWNLINKS | Validate rendered JSON syntax"
  ansible.builtin.command:
    cmd: "python3 -m json.tool /tmp/sonic_downlinks_patch_{{ inventory_hostname }}.json"
  delegate_to: localhost
  changed_when: false
  tags: [downlinks, downlinks_render]

# ─── Step 2: Wait for SSH connectivity ───
- name: "DOWNLINKS | Wait for SONiC switch SSH"
  ansible.builtin.shell: |
    for i in $(seq 1 12); do
      output=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=5 -o BatchMode=yes -o LogLevel=ERROR \
               {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1)
      rc=$?
      if [ $rc -eq 0 ] || echo "$output" | grep -qi "permission denied"; then
        echo "PORT_OPEN"
        exit 0
      fi
      sleep 5
    done
    echo "TIMEOUT after 60s waiting for {{ ansible_host }}:22"
    exit 1
  args:
    executable: /bin/bash
  delegate_to: localhost
  register: _port_check_dl
  changed_when: false
  failed_when: "'PORT_OPEN' not in _port_check_dl.stdout"
  tags: [downlinks, downlinks_apply]

# ─── Step 3: Copy patch to switch ───
- name: "DOWNLINKS | Copy patch to SONiC switch"
  ansible.builtin.copy:
    src: "/tmp/sonic_downlinks_patch_{{ inventory_hostname }}.json"
    dest: "/tmp/sonic_downlinks_patch.json"
    mode: "0644"
  tags: [downlinks, downlinks_apply]

# ─── Step 4: Apply config_db merge ───
- name: "DOWNLINKS | Apply config_db merge (non-disruptive)"
  ansible.builtin.shell: |
    # Merge downlink BGP config into running config_db
    sonic-cfggen -d -j /tmp/sonic_downlinks_patch.json --write-to-db
    RC=$?
    if [ $RC -ne 0 ]; then
      echo "ERROR: sonic-cfggen merge failed with rc=$RC"
      exit $RC
    fi
    echo "OK: config_db merge successful"
  register: cfggen_result
  changed_when: "'OK' in cfggen_result.stdout"
  tags: [downlinks, downlinks_apply]

# ─── Step 5: Bring downlink ports admin-up ───
- name: "DOWNLINKS | Ensure downlink ports are admin-up"
  ansible.builtin.shell: |
    config interface startup {{ item.port }}
  loop: "{{ downlink_interfaces }}"
  loop_control:
    label: "{{ item.port }}"
  changed_when: true
  tags: [downlinks, downlinks_apply]

# ─── Step 6: Save config persistently ───
- name: "DOWNLINKS | Save running config to disk"
  ansible.builtin.command: config save -y
  changed_when: true
  tags: [downlinks, downlinks_apply]

# ─── Step 7: Restart BGP container to pick up new neighbors ───
- name: "DOWNLINKS | Restart BGP container for new peer activation"
  ansible.builtin.shell: |
    # Only restart if new peers aren't already showing up
    EXISTING=$(docker exec bgp vtysh -c "show bgp summary json" 2>/dev/null | \
      python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('ipv4Unicast',{}).get('peers',{})))" 2>/dev/null || echo 0)
    EXPECTED={{ (uplink_interfaces | default([])) | length + downlink_interfaces | length }}
    if [ "$EXISTING" -lt "$EXPECTED" ]; then
      echo "Restarting bgp container (have $EXISTING peers, expect $EXPECTED)..."
      docker stop bgp
      sync; echo 3 > /proc/sys/vm/drop_caches
      docker start bgp
      sleep 5
      echo "BGP container restarted"
    else
      echo "SKIP: All $EXPECTED peers already present"
    fi
  register: bgp_restart
  changed_when: "'Restarting' in bgp_restart.stdout"
  tags: [downlinks, downlinks_apply]

# ─── Step 8: Wait for server BGP peers to establish ───
- name: "DOWNLINKS | Wait for server BGP peers (up to 60s)"
  ansible.builtin.shell: |
    for i in $(seq 1 20); do
      ESTABLISHED=$(docker exec bgp vtysh -c "show bgp summary json" 2>/dev/null | \
        python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    peers = d.get('ipv4Unicast', {}).get('peers', {})
    server_asns = {{ server_asn_map.values() | list | to_json }}
    count = sum(1 for p in peers.values() if p.get('state') == 'Established' and int(p.get('remoteAs',0)) in server_asns)
    print(count)
    " 2>/dev/null)
      EXPECTED={{ downlink_interfaces | length }}
      if [ "$ESTABLISHED" -ge "$EXPECTED" ] 2>/dev/null; then
        echo "OK: $ESTABLISHED/$EXPECTED server peers established"
        exit 0
      fi
      sleep 3
    done
    echo "TIMEOUT: Only $ESTABLISHED/$EXPECTED server peers after 60s"
    docker exec bgp vtysh -c "show bgp summary"
    exit 1
  register: server_peer_check
  changed_when: false
  failed_when: server_peer_check.rc != 0
  tags: [downlinks, downlinks_validate]

# ─── Step 9: Verify server loopbacks are learned ───
- name: "DOWNLINKS | Verify server VTEP loopbacks in routing table"
  ansible.builtin.shell: |
    docker exec bgp vtysh -c "show ip route json" | python3 -c "
    import sys, json
    routes = json.load(sys.stdin)
    vtep_prefix = '10.10.255.'
    vtep_routes = [r for r in routes.keys() if vtep_prefix in r]
    print(f'Server VTEP routes learned: {len(vtep_routes)}')
    for r in vtep_routes:
        print(f'  {r}')
    if len(vtep_routes) == 0:
        sys.exit(1)
    "
  register: vtep_routes
  changed_when: false
  failed_when: vtep_routes.rc != 0
  tags: [downlinks, downlinks_validate]

- name: "DOWNLINKS | Summary"
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════
      DOWNLINK DEPLOYMENT COMPLETE — {{ hostname }}
      ═══════════════════════════════════════════════════════════════
      Server Peers:   {{ server_peer_check.stdout_lines[0] | default('check manually') }}
      VTEP Routes:    {{ vtep_routes.stdout_lines[0] | default('check manually') }}
      Saved Config:   /etc/sonic/config_db.json
      ═══════════════════════════════════════════════════════════════
  tags: [downlinks, downlinks_validate]
