---
# =============================================================================
# Border_Leaf2 - Arista 7050QX-32S (Border Leaf #2)
# =============================================================================
# Platform:   x86_64-arista_7050_qx32s / Arista-7050QX-32S
# ASIC:       Broadcom Trident II BCM56854
# Ports:      32x40G QSFP+ (4 lanes per port, 128 SerDes total)
# Management: 172.16.2.32 (Management Switch port40)
# Loopback:   10.0.2.2/32
# ASN:        65022
#
# Source: TopologyRequirements.txt — "Border-Leaf: Arista-7050QX-32S to be used"
#
# Fabric Wiring (KVM VS index mapping — same as Border_Leaf1):
#   Ethernet124 (Ethernet36, index 36) ↔ Spine_S1 Ethernet20 (uplink, 40G)
#   Ethernet120 (Ethernet35, index 35) ↔ Spine_S2 Ethernet20 (uplink, 40G)
#
#   KVM NIC 32 → Spine_S1 bridge (br-BL2-S1)
#   KVM NIC 31 → Spine_S2 bridge (br-BL2-S2)
#
# Exit Router Wiring:
#   Ethernet0  (lane 9, after 4x10G breakout of QSFP+5) ↔ Exit_Router2 ether2 (10G)
#   KVM VS naming: parent Ethernet0 (lanes 9-12) splits into Ethernet0/1/2/3
#   (Ethernet0=lane9, Ethernet1=lane10, Ethernet2=lane11, Ethernet3=lane12)
#
# Server Wiring:
#   Ethernet20  (Ethernet6/1, QSFP+6 breakout sub0) ↔ HostB12_1 eth2 (10G)
#   (QSFP+ Ethernet20 broken out 4x10G; lanes 29,30,31,32)
# =============================================================================

hostname: "Border_Leaf2"
router_id: "10.0.2.2"
loopback_ip: "10.0.2.2/32"
mgmt_ip: "172.16.2.32/24"
mgmt_gateway: "172.16.2.1"
mac_address: "00:e0:ec:57:12:02"

# Platform selection is now driven by automation_profile.

bgp_local_asn: "{{ border_leaf_asn_map[inventory_hostname] }}"

# ---- Uplink interfaces (to spines, native 40G QSFP+) ----
# Ethernet124 → index 36 → KVM NIC32 → br-BL2-S1 (Spine_S1)
# Ethernet120 → index 35 → KVM NIC31 → br-BL2-S2 (Spine_S2)
uplink_interfaces:
  - port: "Ethernet124"
    alias: "Ethernet36"
    lanes: "5,6,7,8"
    index: "36"
    speed: "40000"
    neighbor: "Spine_S1"
    neighbor_port: "Ethernet20"
    neighbor_asn: "{{ spine_asn }}"
    description: "Border_Leaf2 → Spine_S1 (Celestica DX010)"

  - port: "Ethernet120"
    alias: "Ethernet35"
    lanes: "1,2,3,4"
    index: "35"
    speed: "40000"
    neighbor: "Spine_S2"
    neighbor_port: "Ethernet20"
    neighbor_asn: "{{ spine_asn }}"
    description: "Border_Leaf2 → Spine_S2 (Celestica DX010)"

# ---- Exit router downlink (QSFP+5 / Ethernet0 broken out 4x10G) ----
# Point-to-point /31 link: Border_Leaf2 (10.0.253.2) ↔ Exit_Router2 (10.0.253.3)
#
# CRITICAL: Ethernet0 (QSFP+5, lanes 9-12, index 5) shares ASIC lanes with
# the four front-panel 10G SFP+ ports (sfp1-4). They are MUTUALLY EXCLUSIVE.
# After breakout 4x10G: parent Ethernet0 disappears, Ethernet5/1 (lane 9) is used.
exit_interfaces:
  - port: "Ethernet0"
    parent_port: "Ethernet0"
    breakout_mode: "4x10G"
    alias: "Ethernet5/1"
    lanes: "9"
    index: "5"
    speed: "10000"
    mtu: "1500"
    neighbor: "Exit_Router2"
    neighbor_port: "ether2"
    neighbor_asn: 65254
    local_ip: "10.0.253.2/31"
    neighbor_ip: "10.0.253.3"
    description: "Border_Leaf2 → Exit_Router2 (10G, KVM breakout Ethernet0 lane9)"

# ---- Server downlink (QSFP+ port 6 broken out 4x10G) ----
# ---- Server downlinks (native QSFP+ ports, no breakout in KVM VS) ----
# Platform.json verified port mappings (Arista 7050QX-32S):
#   Ethernet20: index 10, lanes 25,26,27,28, alias Ethernet10/1 (QSFP+10)
#   Ethernet24: index 11, lanes 33,34,35,36, alias Ethernet11/1 (QSFP+11)
#   Ethernet28: index 12, lanes 37,38,39,40, alias Ethernet12/1 (QSFP+12)
downlink_interfaces:
  - port: "Ethernet20"
    alias: "Ethernet10/1"
    lanes: "25,26,27,28"
    index: "10"
    speed: "40000"
    neighbor: "HostB12_1"
    neighbor_port: "eth2"
    neighbor_asn: 65106
    description: "Border_Leaf2 → HostB12_1 eth2 (QSFP+10, native 40G)"

  - port: "Ethernet24"
    alias: "Ethernet11/1"
    lanes: "33,34,35,36"
    index: "11"
    speed: "40000"
    neighbor: "HostB12_2"
    neighbor_port: "eth2"
    neighbor_asn: 65107
    description: "Border_Leaf2 → HostB12_2 eth2 (QSFP+11, native 40G)"

  - port: "Ethernet28"
    alias: "Ethernet12/1"
    lanes: "37,38,39,40"
    index: "12"
    speed: "40000"
    neighbor: "MonitorSrv"
    neighbor_port: "eth2"
    neighbor_asn: 65108
    description: "Border_Leaf2 → MonitorSrv eth2 (QSFP+12, native 40G)"

# ---- Breakout configuration (applied by deploy_breakout.yml) ----
breakout_cfg:
  Ethernet0:
    brkout_mode: "4x10G"
    parent_lanes: "9,10,11,12"
    child_ports:
      # KVM VS naming: sequential EthernetN, one lane each.
      # Ethernet0 (lane 9) = exit router port. Ethernet1-3 unused.
      - { port: "Ethernet0", lane: "9",  speed: "10000", alias: "Ethernet5/1", index: "5" }
      - { port: "Ethernet1", lane: "10", speed: "10000", alias: "Ethernet5/2", index: "5" }
      - { port: "Ethernet2", lane: "11", speed: "10000", alias: "Ethernet5/3", index: "5" }
      - { port: "Ethernet3", lane: "12", speed: "10000", alias: "Ethernet5/4", index: "5" }

# ---- All ports reference ----
all_ports: "{{ qx32s_all_ports }}"
