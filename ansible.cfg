[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
host_key_checking = False
timeout = 60
forks = 10
log_path = ./ansible.log
retry_files_enabled = False
interpreter_python = /usr/bin/python3
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.ansible_facts_cache
fact_caching_timeout = 3600
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_timeout = 300

[ssh_connection]
# ControlMaster=auto reuses one TCP connection per host across all tasks in a
# playbook run. Without this, every task (40+) opens its own SSH connection
# and sshd's default MaxStartups=10 begins dropping banner exchanges.
# meta: reset_connection in reload_config.yml drops the ControlMaster socket
# intentionally after config reload so the next task gets a fresh connection.
ssh_args = -o ControlMaster=auto -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o LogLevel=ERROR -o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no -o PasswordAuthentication=yes -o GSSAPIAuthentication=no
# pipelining=True avoids the temp-file + sudo-TTY mechanism that causes
# 'Timeout waiting for privilege escalation prompt' under memory pressure.
# Requires sudoers to NOT have 'requiretty' — Debian/SONiC default is fine.
pipelining = True
