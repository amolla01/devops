---
# =============================================================================
# Border_Leaf1 - Arista 7050QX-32S (Border Leaf #1)
# =============================================================================
# Platform:   x86_64-arista_7050_qx32s / Arista-7050QX-32S
# ASIC:       Broadcom Trident II BCM56854
# Ports:      32x40G QSFP+ (4 lanes per port, 128 SerDes total)
# Management: 172.16.2.31 (Management Switch port41)
# Loopback:   10.0.2.1/32
# ASN:        65021
#
# Source: TopologyRequirements.txt — "Border-Leaf: Arista-7050QX-32S to be used"
#
# Fabric Wiring (per TopologyRequirements.txt, adjusted for KVM VS ethN mapping):
#   Ethernet124 (Ethernet36, index 36) ↔ Spine_S1 Ethernet16  (uplink, 40G)
#   Ethernet120 (Ethernet35, index 35) ↔ Spine_S2 Ethernet16  (uplink, 40G)
#
#   CRITICAL: SONiC VS maps ports to ethN SEQUENTIALLY (1st port → eth1, 2nd → eth2,
#   etc.), NOT by port_config.ini index. For Arista-7050QX-32S (indices 5-36):
#     ethN = index - 4   (e.g., index 36 → eth32, index 35 → eth31)
#   So Ethernet124 (index 36) → eth32 → NIC32 → br-BL1-S1 ✓
#   and Ethernet120 (index 35) → eth31 → NIC31 → br-BL1-S2 ✓
#
# Exit Router Wiring:
#   Ethernet0  (lane 9, after 4x10G breakout of QSFP+5) ↔ Exit_Router1 ether2 (10G)
#   KVM VS naming: parent Ethernet0 (lanes 9-12) splits into Ethernet0/1/2/3
#   (Ethernet0=lane9, Ethernet1=lane10, Ethernet2=lane11, Ethernet3=lane12)
#
# Server Wiring:
#   Ethernet20 (Ethernet6/1, QSFP+6 breakout sub0) ↔ HostB12_1 eth1 (10G)
#   Ethernet21 (Ethernet6/2, QSFP+6 breakout sub1) ↔ HostB12_2 eth1 (10G)
#   (QSFP+ Ethernet20 broken out 4x10G; lanes 29,30,31,32)
#   NOTE: TopologyRequirements.txt shows HostB12_1/2 on Ethernet0/1 sub-ports,
#         but Ethernet0 is already used by Exit_Router1. On physical hardware
#         both would share QSFP+ port 1 breakout. For KVM VS (separate NICs
#         required per host), hosts use QSFP+ port 6 (Ethernet20-23) instead.
# =============================================================================

hostname: "Border_Leaf1"
router_id: "10.0.2.1"
loopback_ip: "10.0.2.1/32"
mgmt_ip: "172.16.2.31/24"
mgmt_gateway: "172.16.2.1"
mac_address: "00:e0:ec:57:12:01"

# Platform selection is now driven by automation_profile.
# Override group_vars hwsku: Border_Leaf1 uses Arista-7050QX-32S
platform: "x86_64-arista_7050_qx32s"
hwsku: "Arista-7050QX-32S"

bgp_local_asn: "{{ border_leaf_asn_map[inventory_hostname] }}"

# ---- Uplink interfaces (to spines, native 40G QSFP+) ----
# Ethernet124 → index 36 → eth32 → NIC32 → br-BL1-S1 (Spine_S1)
# Ethernet120 → index 35 → eth31 → NIC31 → br-BL1-S2 (Spine_S2)
uplink_interfaces:
  - port: "Ethernet124"
    alias: "Ethernet36"
    lanes: "5,6,7,8"
    index: "36"
    speed: "40000"
    neighbor: "Spine_S1"
    neighbor_port: "Ethernet16"
    neighbor_asn: "{{ spine_asn }}"
    description: "Border_Leaf1 → Spine_S1 (Celestica DX010)"

  - port: "Ethernet120"
    alias: "Ethernet35"
    lanes: "1,2,3,4"
    index: "35"
    speed: "40000"
    neighbor: "Spine_S2"
    neighbor_port: "Ethernet16"
    neighbor_asn: "{{ spine_asn }}"
    description: "Border_Leaf1 → Spine_S2 (Celestica DX010)"

# ---- Exit router downlink (QSFP+5 / Ethernet0 broken out 4x10G) ----
# Point-to-point /31 link: Border_Leaf1 (10.0.253.0) ↔ Exit_Router1 (10.0.253.1)
#
# CRITICAL: Ethernet0 (QSFP+5, lanes 9-12, index 5) shares ASIC lanes with
# the four front-panel 10G SFP+ ports (sfp1-4). They are MUTUALLY EXCLUSIVE.
#   - Default 1x40G[10G] mode: QSFP+5 (Ethernet0/Ethernet5/1) active, SFP+ dead
#   - After 4x10G breakout:   Ethernet5/1, 5/2, 5/3, 5/4 each at 10G
#   - After 3x10G+1x1G:       Ethernet1-4 (SFP+ ports) active, QSFP+5 dead
#
# Platform.json breakout modes for Ethernet0:
#   "1x40G[10G]"         → ["Ethernet5/1"]
#   "4x10G"              → ["Ethernet5/1","Ethernet5/2","Ethernet5/3","Ethernet5/4"]
#   "3x10G(3)+1x1G(1)"  → ["Ethernet1","Ethernet2","Ethernet3","Ethernet4"]
#   "2x20G[10G]"         → ["Ethernet5/1","Ethernet5/3"]
#
# After breakout 4x10G:
#   Parent Ethernet0 (lanes 9,10,11,12) disappears.
#   Sub-port Ethernet5/1 (lane 9) is created at 10G — used for exit router.
#   Sub-ports Ethernet5/2-4 (lanes 10,11,12) available for future use.
exit_interfaces:
  - port: "Ethernet0"
    parent_port: "Ethernet0"
    breakout_mode: "4x10G"
    alias: "Ethernet5/1"
    lanes: "9"
    index: "5"
    speed: "10000"
    mtu: "1500"
    neighbor: "Exit_Router1"
    neighbor_port: "ether2"
    neighbor_asn: 65253
    local_ip: "10.0.253.0/31"
    neighbor_ip: "10.0.253.1"
    description: "Border_Leaf1 → Exit_Router1 (10G, KVM breakout Ethernet0 lane9)"

# ---- Server downlinks (native QSFP+ ports, no breakout in KVM VS) ----
# Platform.json verified port mappings (Arista 7050QX-32S):
#   Ethernet20: index 10, lanes 25,26,27,28, alias Ethernet10/1 (QSFP+10)
#   Ethernet24: index 11, lanes 33,34,35,36, alias Ethernet11/1 (QSFP+11)
#   Ethernet28: index 12, lanes 37,38,39,40, alias Ethernet12/1 (QSFP+12)
#
# KVM VS maps: NIC position = index - 4 → Ethernet20(idx10)=eth6, Ethernet24(idx11)=eth7, etc.
downlink_interfaces:
  - port: "Ethernet20"
    alias: "Ethernet10/1"
    lanes: "25,26,27,28"
    index: "10"
    speed: "40000"
    neighbor: "HostB12_1"
    neighbor_port: "eth1"
    neighbor_asn: 65106
    description: "Border_Leaf1 → HostB12_1 eth1 (QSFP+10, native 40G)"

  - port: "Ethernet24"
    alias: "Ethernet11/1"
    lanes: "33,34,35,36"
    index: "11"
    speed: "40000"
    neighbor: "HostB12_2"
    neighbor_port: "eth1"
    neighbor_asn: 65107
    description: "Border_Leaf1 → HostB12_2 eth1 (QSFP+11, native 40G)"

  - port: "Ethernet28"
    alias: "Ethernet12/1"
    lanes: "37,38,39,40"
    index: "12"
    speed: "40000"
    neighbor: "MonitorSrv"
    neighbor_port: "eth1"
    neighbor_asn: 65108
    description: "Border_Leaf1 → MonitorSrv eth1 (QSFP+12, native 40G)"

# ---- Breakout configuration (applied by deploy_breakout.yml) ----
# Defines parent ports that require breakout before fabric/exit can use sub-ports.
# The breakout playbook applies these BEFORE the fabric patch.
breakout_cfg:
  Ethernet0:
    brkout_mode: "4x10G"
    parent_lanes: "9,10,11,12"
    child_ports:
      # KVM VS naming: sequential EthernetN, one lane each.
      # Ethernet0 (lane 9) = exit router port. Ethernet1-3 unused.
      - { port: "Ethernet0", lane: "9",  speed: "10000", alias: "Ethernet5/1", index: "5" }
      - { port: "Ethernet1", lane: "10", speed: "10000", alias: "Ethernet5/2", index: "5" }
      - { port: "Ethernet2", lane: "11", speed: "10000", alias: "Ethernet5/3", index: "5" }
      - { port: "Ethernet3", lane: "12", speed: "10000", alias: "Ethernet5/4", index: "5" }

# ---- All ports reference ----
all_ports: "{{ qx32s_all_ports }}"
