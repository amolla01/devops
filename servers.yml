---
# =============================================================================
# servers.yml - Ubuntu bare-metal host server variables
# =============================================================================
# OS:          Ubuntu 22.04 LTS (MaaS-commissioned via PXE)
# Networking:  Netplan + FRR (eBGP to leaf pair for L3 fabric reachability)
# Bond:        active-backup bond across dual-homed leaf connections
# =============================================================================

ansible_user: ubuntu
ansible_connection: ssh
ansible_ssh_pass: "{{ vault_ansible_password | default('amolla01') }}"
ansible_ssh_common_args: '-o PreferredAuthentications=publickey,password -o PubkeyAuthentication=yes'
ansible_become: yes
ansible_become_method: sudo
ansible_become_pass: "{{ vault_ansible_password | default('amolla01') }}"
ansible_python_interpreter: /usr/bin/python3

device_type: "Server"
device_role: server

# ---- Network configuration tool ----
netplan_config_path: /etc/netplan/01-fabric-config.yaml
frr_config_path: /etc/frr/frr.conf

# ---- Server BGP ASN (all servers share one ASN for simplicity) ----
server_bgp_asn: 65200

# ---- FRR ----
frr_daemons:
  bgpd: "yes"
  zebra: "yes"
  staticd: "yes"

# ---- Bond configuration ----
bond_mode: "active-backup"
bond_miimon: 100
bond_mtu: 9000

# ---- OS packages required ----
server_packages:
  - frr
  - frr-pythontools
  - lldpd
  - net-tools
  - ethtool
  - linux-modules-extra-{{ ansible_kernel | default('generic') }}

# ---- Ceph disk discovery ----
ceph_osd_device_filter: "/dev/sd[b-z]"
