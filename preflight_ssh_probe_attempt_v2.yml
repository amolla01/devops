- name: "preflight | Probe {{ preflight_probe_name }}"
  ansible.builtin.shell: |
    sshpass -p '{{ ansible_ssh_pass }}' ssh \
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o ConnectTimeout={{ preflight_probe_connect_timeout }} \
      -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
      -o LogLevel=ERROR -o PreferredAuthentications=password \
      -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no \
      -o PasswordAuthentication=yes -o GSSAPIAuthentication=no \
      {{ ansible_user }}@{{ ansible_host }} echo ok 2>&1
  delegate_to: localhost
  become: false
  vars:
    ansible_become: "false"
  register: _preflight_probe_attempt_result
  changed_when: false
  failed_when: false
  when: not (_preflight_probe_ok | bool)

- name: "preflight | Record {{ preflight_probe_name }} result"
  ansible.builtin.set_fact:
    _preflight_probe_ok: "{{ 'ok' in (_preflight_probe_attempt_result.stdout | default('')) }}"
    _preflight_probe_last_rc: "{{ _preflight_probe_attempt_result.rc | default(-1) }}"
    _preflight_probe_last_stdout: "{{ _preflight_probe_attempt_result.stdout | default('') }}"
    _preflight_probe_last_stderr: "{{ _preflight_probe_attempt_result.stderr | default('') }}"
  no_log: true
  when: not (_preflight_probe_ok | bool)

- name: "preflight | Report {{ preflight_probe_name }} progress"
  ansible.builtin.debug:
    msg: >-
      {{ preflight_probe_name }} attempt {{ preflight_probe_attempt }}/{{ preflight_probe_total_attempts }}
      {{ 'succeeded' if (_preflight_probe_ok | bool) else 'failed' }} for {{ inventory_hostname }} at {{ ansible_host }};
      rc={{ _preflight_probe_last_rc }};
      output={{ ((_preflight_probe_last_stdout | default('')) ~ ' ' ~ (_preflight_probe_last_stderr | default(''))) | regex_replace('\s+', ' ') | trim | default('no output captured', true) }}
  when: not (_preflight_probe_ok | bool)

# FIX: ansible.builtin.pause is incompatible with strategy: free
# (it bypasses the host loop and errors out). Use a local shell sleep instead,
# which executes per-host and works correctly under the free strategy.
- name: "preflight | Wait before retrying {{ preflight_probe_name }}"
  ansible.builtin.command: "sleep {{ preflight_probe_delay_seconds }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - not (_preflight_probe_ok | bool)
    - (preflight_probe_attempt | int) < (preflight_probe_total_attempts | int)
