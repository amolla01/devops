---
# mikrotik_base/tasks/preflight.yml
# Pre-flight connectivity check for MikroTik CHR / RouterOS devices.
# MikroTik CHR default: user=admin, no password.
#
# All tasks use ansible_connection=local with direct SSH exec commands.
# This avoids network_cli prompt detection issues on WSL/KVM.

- name: "preflight | Wait for SSH port 22 to accept connections"
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      output=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=5 -o BatchMode=yes -o LogLevel=ERROR \
               admin@{{ ansible_host }} echo ok 2>&1)
      rc=$?
      if [ $rc -eq 0 ] || echo "$output" | grep -qi "permission denied"; then
        echo "PORT_OPEN"
        exit 0
      fi
      sleep 5
    done
    echo "TIMEOUT after 300s waiting for {{ ansible_host }}:22"
    exit 1
  args:
    executable: /bin/bash
  register: _port_check_mt
  changed_when: false
  failed_when: "'PORT_OPEN' not in _port_check_mt.stdout"

- name: "preflight | Probe SSH connectivity"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/system identity print' 2>&1
  register: _mikrotik_ssh_probe
  changed_when: false
  failed_when: false
  retries: 6
  delay: 15
  until: >-
    'name:' in (_mikrotik_ssh_probe.stdout | default('') | lower)
    or 'name=' in (_mikrotik_ssh_probe.stdout | default('') | lower)

- name: "preflight | Assert SSH connectivity succeeded"
  ansible.builtin.assert:
    that:
      - >-
        ('name:' in (_mikrotik_ssh_probe.stdout | default('') | lower))
        or ('name=' in (_mikrotik_ssh_probe.stdout | default('') | lower))
    fail_msg: >-
      Cannot reach {{ inventory_hostname }} ({{ ansible_host }}) via SSH.
      Last output: {{ _mikrotik_ssh_probe.stdout | default('') }}
      Stderr: {{ _mikrotik_ssh_probe.stderr | default('') }}
    success_msg: "SSH to {{ inventory_hostname }} ({{ ansible_host }}) — OK"

- name: "preflight | Gather RouterOS version"
  ansible.builtin.shell: |
    {{ mikrotik_ssh_cmd }} '/system resource print' 2>&1
  register: _ros_version
  changed_when: false
  failed_when: false

- name: "preflight | Display RouterOS identity"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: RouterOS device reachable |
      {{ _ros_version.stdout_lines | default(['version unavailable']) | select('search', 'version') | first | default('version info unavailable') | trim }}
